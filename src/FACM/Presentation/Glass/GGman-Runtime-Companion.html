<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none';">
<title>GGman 实时对局助手</title>
<style>
:root{color-scheme:dark;--bg:#061125;--panel:#101f38;--tile:#152a44;--line:#263e56;--text:#e7f5ff;--soft:#97afc8;--cyan:#56d7e9;--warn:#ffd08a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:12px/1.55 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;color:var(--text);user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--tile);border-radius:9px;padding:5px 8px;min-height:29px}
button:hover{border-color:var(--cyan);background:#1c3855}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
button[disabled]{opacity:.45;pointer-events:none}
h2,h3,p{margin:0}
#shell{width:100%;height:100%;overflow:hidden;border:1px solid #31506a;border-radius:13px}
#head{height:46px;display:flex;align-items:center;gap:5px;padding:0 9px;border-bottom:1px solid var(--line);background:linear-gradient(115deg,#0d2844,#08162b);touch-action:none}
#drag{flex:1;min-width:0;cursor:move;display:flex;align-items:center;gap:7px;height:100%}
#logo{background:linear-gradient(140deg,#20aec2,#11708e);border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:13px;font-weight:900}
#title{font-weight:700;white-space:nowrap;font-size:12px}
#timer{color:var(--cyan);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.chrome{padding:3px 7px;min-width:27px;height:27px;min-height:27px;background:#132940}
#content{height:calc(100% - 46px);overflow-y:auto;overscroll-behavior:contain;padding:9px 10px 13px;scrollbar-color:#345b71 transparent;scrollbar-width:thin}
#shell.collapsed #content{display:none}
#status{font-size:11px;min-height:22px;color:var(--soft);display:flex;align-items:center;gap:7px}
#dot{height:7px;width:7px;border-radius:50%;background:#567489;display:inline-block}
#dot.on{background:#4bdbb3}
.section{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px;margin-top:8px}
.section h3{font-size:12px;letter-spacing:.2px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--soft)}.accent{color:var(--cyan)}.warn{color:var(--warn)}.sub{font-size:11px}
#champ{display:flex;gap:7px;align-items:center}
#champTitle{font-size:14px;font-weight:800;white-space:normal}
#champHint{font-size:11px;color:var(--soft)}
#tier{color:#7adecd;font-size:11px}
#bench{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bench-choice{padding:6px 2px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-width:0}
.bench-choice img{width:32px;height:32px;border-radius:7px;object-fit:cover;background:#1e4256}
.bench-choice .placeholder{width:32px;height:32px;border-radius:7px;background:#20445b;display:grid;place-items:center;color:#b9d6e8}
.bench-choice span{font-size:10px;color:var(--soft);white-space:nowrap}
#benchEmpty{color:var(--soft);font-size:11px}
#source{color:var(--soft);font-size:10px}
#recommend{display:grid;gap:6px}
.rec{border:1px solid #23405b;border-radius:8px;background:#112943;padding:7px}
.iconline{display:flex;gap:4px;margin:3px 0 4px;flex-wrap:wrap}
.iconline img,.augmentIcon{width:28px;height:28px;border-radius:5px;object-fit:cover;border:1px solid #345c75;background:#0b233a;flex-shrink:0}
.rec-label{font-size:10px;color:var(--cyan);margin-bottom:2px}
.rec-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.55}
.rec-note{color:var(--soft);font-size:10px;margin-top:3px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.actions button{font-size:11px;padding:6px 3px}
.actions .primary{background:linear-gradient(140deg,#126b81,#176078);border-color:#26869e}
#recent{font-size:11px;color:var(--soft)}
#guideInfo{font-size:11px;color:var(--soft);white-space:pre-wrap}
#augmentFilters{display:flex;gap:5px;margin:6px 0}
#augmentFilters button{flex:1;font-size:10px;min-height:25px;padding:3px}
#augmentFilters button.active{border-color:var(--cyan);color:var(--cyan)}
.augment{display:flex;gap:7px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.augmentRank{color:var(--cyan);min-width:20px}
.augmentBody{flex:1;min-width:0}
.augmentName{font-size:11px;font-weight:700}
.augmentRarity{font-size:10px;color:var(--soft);margin-left:4px}
.augmentMeta{color:var(--soft);font-size:10px}
.augmentDesc{color:#b8d0e3;font-size:10px;white-space:pre-wrap}
#toast{position:absolute;left:12px;right:12px;bottom:12px;display:none;padding:8px 9px;background:#174258;border:1px solid #408b9a;border-radius:8px;font-size:11px;pointer-events:none}
#confirm{display:none;position:absolute;inset:46px 0 0;background:#04101fe8;align-items:center;justify-content:center;padding:16px}
#confirm.open{display:flex}
.dialog{width:100%;padding:14px;border:1px solid #37647b;border-radius:12px;background:#10263e}
.dialog h3{font-size:14px}.dialog p{margin:10px 0;color:var(--soft);white-space:pre-wrap}
.dialog .actions{grid-template-columns:1fr 1fr}
#emptyGuide{color:var(--soft);font-size:11px}
</style>
</head>
<body>
<div id="shell">
<header id="head">
<div id="drag" aria-label="拖动对局助手"><span id="logo">G</span><span id="title">GGman · 实时对局助手</span><span id="timer">--</span></div>
<button id="pin" class="chrome" title="固定置顶" aria-label="固定置顶">●</button>
<button id="collapse" class="chrome" title="折叠或展开" aria-label="折叠或展开">−</button>
<button id="close" class="chrome" title="关闭本局助手" aria-label="关闭本局助手">×</button>
</header>
<main id="content">
<div id="status"><span id="dot"></span><span id="statusText">连接英雄选择中…</span></div>
<section class="section">
<div id="champ"><div style="flex:1"><div id="champTitle">等待选定英雄</div><div id="champHint">当前选人阶段同步推荐</div></div><div id="tier"></div></div>
<div id="recent"></div>
</section>
<section class="section">
<h3><span>快速选择 · 大乱斗替补席</span><span class="muted sub">点击英雄交换</span></h3>
<div id="benchEmpty">正在确认替补席是否可用…</div>
<div id="bench" role="group" aria-label="可交换的英雄"></div>
</section>
<section class="section">
<h3><span>符文 · 出装 · 技能推荐</span><span id="source"></span></h3>
<div id="recommend"><div class="muted sub">等待当前英雄推荐…</div></div>
<div class="actions">
<button class="primary" id="runes">应用符文</button>
<button id="spells">应用召唤师技能</button>
<button id="items">导入出装</button>
</div>
</section>
<section class="section">
<h3><span>海斗强化 · 大乱斗数据</span><span class="muted sub">当前英雄</span></h3>
<div id="guideInfo"></div><div id="emptyGuide">等待强化数据…</div>
<div id="augmentFilters"><button data-filter="all" class="active">全部</button><button data-filter="prism">棱彩</button><button data-filter="gold">黄金</button><button data-filter="silver">白银</button></div>
<div id="augments"></div>
</section>
<section class="section"><h3>本局队伍</h3><div id="teams" class="sub muted">等待队友数据…</div></section>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span id="message" class="muted sub">来自 LOL 本地客户端与已启用数据源</span><button id="quit" class="warn">退出选人</button></div>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confirm" role="dialog" aria-modal="true" aria-label="确认应用">
<div class="dialog"><h3 id="confirmTitle"></h3><p id="confirmMessage"></p><div class="actions"><button id="no">取消</button><button id="yes" class="primary">确认</button></div></div>
</div>
<script>
(function(){
'use strict';
const $ = id=>document.getElementById(id);
const send = text=>{if(window.chrome && window.chrome.webview)window.chrome.webview.postMessage(text)};
const elem=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=String(value);return e};
const icons=new Map(),assetIcons=new Map();
let snapshot=null,filter='all',confirmation='confirm:yes',dragging=false,toastTimer=null;
const fmtRate=x=>{if(x===null||x===undefined||!isFinite(Number(x)))return '—';let n=Number(x);if(n>=0&&n<=1)n*=100;return n.toFixed(1)+'%'};
const nice=(value,fallback='—')=>value===null||value===undefined||String(value).trim()===''?fallback:String(value);
function showToast(message){
 $('message').textContent=nice(message);
 $('toast').textContent=nice(message);
 $('toast').style.display='block';
 if(toastTimer)clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').style.display='none',2800);
}
function confirm(title,message,code){
 confirmation=code;$('confirmTitle').textContent=title;$('confirmMessage').textContent=message;$('confirm').classList.add('open');
}
$('no').onclick=()=>{$('confirm').classList.remove('open');send('confirm:no')};
$('yes').onclick=()=>{$('confirm').classList.remove('open');send(confirmation)};
$('pin').onclick=()=>send('pin');
$('collapse').onclick=()=>send('collapse');
$('close').onclick=()=>send('close');
$('runes').onclick=()=>send('apply:runes');
$('spells').onclick=()=>send('apply:spells');
$('items').onclick=()=>send('apply:items');
$('quit').onclick=()=>confirm('退出当前选人','此操作仅请求退出英雄选择，不会关闭 LOL 大厅。当前对局可能有退出处罚。','quit:yes');
$('augmentFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 filter=b.dataset.filter;$('augmentFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderAugments();
});
const drag=$('drag');
drag.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;drag.setPointerCapture(e.pointerId);send('drag-start:'+e.screenX+','+e.screenY)});
drag.addEventListener('pointermove',e=>{if(dragging)send('drag-move:'+e.screenX+','+e.screenY)});
function endDrag(){if(dragging){dragging=false;send('drag-end')}}
drag.addEventListener('pointerup',endDrag);drag.addEventListener('pointercancel',endDrag);
function renderBench(){
const host=$('bench');host.replaceChildren();const ids=snapshot&&snapshot.bench?snapshot.choices||[]:[];
$('benchEmpty').style.display=ids.length?'none':'block';
$('benchEmpty').textContent=snapshot&&snapshot.bench?'暂无可交换英雄':'当前模式未开放替补席交换';
for(const id of ids){
 const b=elem('button','bench-choice');b.title='交换英雄 #'+id;
 const image=icons.get(id);
 if(image){const img=elem('img');img.src=image;img.alt='英雄 #'+id;b.appendChild(img)}
 else b.appendChild(elem('span','placeholder',String(id)));
 b.appendChild(elem('span','',String(id)));b.onclick=()=>send('swap:'+id);host.appendChild(b);
}
}
const categories={runes:'符文',spells:'召唤师技能',skills:'技能顺序',starter:'出门装',boots:'鞋子',core:'核心出装',counters:'克制分析',allyTeam:'队友配合',enemyTeam:'敌方阵容',items:'出装'};
function renderBuild(){
const host=$('recommend');host.replaceChildren();const b=snapshot&&snapshot.build;
$('source').textContent=b?nice(b.source,'来源待确认'):'';
if(!b||!Array.isArray(b.rows)||!b.rows.length){
 host.appendChild(elem('div','muted sub',snapshot&&snapshot.buildLoading?'正在载入推荐…':'暂无可用的符文与出装推荐'));
}else{
 b.rows.forEach((r,index)=>{
 const card=elem('div','rec');card.appendChild(elem('div','rec-label',categories[r.category]||nice(r.category,'推荐')));
 const iconsHost=elem('div','iconline');
 for(let n=0;n<3;n++){
 const asset=assetIcons.get('build:'+index+':'+n);if(!asset)continue;
 const img=elem('img');img.src=asset;img.alt=nice(r.category,'推荐')+' 图标';iconsHost.appendChild(img);
 }
 if(iconsHost.childNodes.length)card.appendChild(iconsHost);
 card.appendChild(elem('div','rec-text',nice(r.title,'暂无数据')));
 if(r.evidence)card.appendChild(elem('div','rec-note',r.evidence));
 host.appendChild(card);
 });
}
const canApply=!!(b&&b.status==='ready');
for(const id of ['runes','spells','items'])$(id).disabled=!canApply;
}
function renderAugments(){
const host=$('augments');host.replaceChildren();
const guide=snapshot&&snapshot.guide;const all=guide&&Array.isArray(guide.augments)?guide.augments:[];
const rows=all.filter(x=>filter==='all'||x.rarity===filter).slice(0,20);
if(!rows.length){host.appendChild(elem('div','muted sub','当前筛选没有强化数据'));return;}
for(const r of rows){
 const row=elem('div','augment');row.appendChild(elem('div','augmentRank','#'+nice(r.rank,'—')));
 const asset=assetIcons.get('augment:'+r.id);
 if(asset){const image=elem('img','augmentIcon');image.src=asset;image.alt=nice(r.name,'强化');row.appendChild(image)}
 const body=elem('div','augmentBody');const name=elem('div','augmentName',nice(r.name));
 name.appendChild(elem('span','augmentRarity',nice(r.rarity,'')));
 body.appendChild(name);
 body.appendChild(elem('div','augmentMeta','胜率 '+fmtRate(r.winRate)+' · 选取 '+fmtRate(r.pickRate)+(r.games?' · '+r.games+' 场':'')));
 if(r.description)body.appendChild(elem('div','augmentDesc',r.description));
 row.appendChild(body);host.appendChild(row);
}
}
function render(){
if(!snapshot)return;
$('timer').textContent=Number(snapshot.timer)>0?snapshot.timer+'s':'--';
$('dot').classList.toggle('on',!!snapshot.connected);
$('statusText').textContent=snapshot.connected?'英雄选择中 · '+nice(snapshot.phase,''):'正在连接 LOL 选人会话';
$('champTitle').textContent=nice(snapshot.name,snapshot.championId>0?'英雄 #'+snapshot.championId:'等待选定英雄');
const b=snapshot.build,g=snapshot.guide;
$('champHint').textContent=b?nice(b.mode,'当前模式')+' · '+nice(b.status,'等待推荐'):'等待选定英雄';
$('tier').textContent=b&&b.tier?b.tier+(b.rank?' · #'+b.rank:''):g&&g.tier?g.tier:'';
const recent=snapshot.recent;
$('recent').textContent=recent&&recent.games?
 '最近 '+recent.games+' 局该英雄 · '+recent.wins+' 胜 · KDA '+Number(recent.kills||0).toFixed(1)+'/'+Number(recent.deaths||0).toFixed(1)+'/'+Number(recent.assists||0).toFixed(1):'';
renderBench();renderBuild();
$('guideInfo').textContent=g?[
 nice(g.champion,'当前英雄')+' '+nice(g.tier,'')+' · 胜率 '+fmtRate(g.winRate),
 nice(g.summary,''),g.skills?'加点：'+g.skills:'',
 g.core&&g.core.length?'核心装备：'+g.core.join('、'):''
].filter(Boolean).join('\n'):'';
$('emptyGuide').textContent=snapshot.guideLoading?'正在获取海斗攻略…':nice(snapshot.guideError,'当前没有海斗强化数据');
$('emptyGuide').style.display=g?'none':'block';
renderAugments();
const teams=$('teams');teams.replaceChildren();
for(const p of snapshot.teams||[]){
teams.appendChild(elem('div','','['+nice(p.side,'队伍')+'] '+nice(p.name,'英雄')+
 ' · '+nice(p.position,'')+(p.local?' · 自己':'')));
}
if(!teams.childNodes.length)teams.textContent='等待队伍数据';
}
if(window.chrome&&window.chrome.webview){
window.chrome.webview.addEventListener('message',e=>{
const m=e.data||{};
if(m.type==='snapshot'){snapshot=m;render()}
else if(m.type==='icon'){if(m.id&&typeof m.value==='string'&&m.value.startsWith('data:image/png;base64,')){icons.set(m.id,m.value);if(snapshot)renderBench()}}
else if(m.type==='assets-reset'){assetIcons.clear();if(snapshot){renderBuild();renderAugments()}}
else if(m.type==='asset'){if(typeof m.key==='string'&&typeof m.value==='string'&&m.value.startsWith('data:image/png;base64,')){assetIcons.set(m.key,m.value);if(snapshot){renderBuild();renderAugments()}}}
else if(m.type==='status'){showToast(m.message)}
else if(m.type==='confirm'){confirm(nice(m.title,'确认'),nice(m.message,''),'confirm:yes')}
else if(m.type==='window'){
$('shell').classList.toggle('collapsed',!!m.collapsed);
$('collapse').textContent=m.collapsed?'+':'−';
$('pin').style.color=m.pinned?'var(--cyan)':'var(--soft)';
}
});
send('shell-ready');
}
})();
</script>
</body>
</html>
