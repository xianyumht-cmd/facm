<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>GGman</title>
<style>
:root{color-scheme:dark;--canvas:#040c20;--card:#112349;--card2:#153151;--text:#f1f7ff;--muted:#a9bcda;--accent:#08bad6;--line:#243653;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#shell{height:100dvh;min-height:180px;display:flex;flex-direction:column;padding:16px;gap:14px}
.header{height:42px;flex-shrink:0;display:flex;align-items:center;gap:12px;user-select:none}
.brand-icon{height:40px;width:40px;flex:0 0 40px;display:grid;place-items:center;background:var(--accent);border-radius:10px;color:#fff;font-size:19px;font-weight:800}
.brand-name{font-size:18px;font-weight:750;letter-spacing:.2px}.subhead{font-size:11px;color:var(--muted);margin-top:2px}
.close,.back,.home{background:transparent;color:#c5d8f1;min-width:31px;min-height:31px;border-radius:8px}
.close:hover,.back:hover,.home:hover{background:var(--card2)}.close{margin-left:auto;font-size:21px}
main{min-height:0;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#263b59 transparent}
.status{padding:12px 13px;background:var(--card);border-radius:11px;display:flex;flex-direction:column;gap:4px}
.status b{font-size:14px}.status span{color:var(--muted);font-size:12px}.status .hint{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}
.tile{display:flex;align-items:center;gap:9px;text-align:left;min-width:0;min-height:57px;padding:9px;background:var(--card);border-radius:11px;font-weight:650}
.tile:hover{background:#1a365a}.tile .glyph{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;font-size:19px;color:var(--accent);background:#113c61;border-radius:8px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
.actions button{min-height:34px;background:var(--card2);border-radius:7px;color:#e0ebf9;font-size:12px}
.actions button:hover{background:#205175}
#appearance{display:none;padding:4px 2px}
#appearance h2{font-size:18px;margin:10px 0 6px}
#appearance p{color:var(--muted);font-size:12px;line-height:1.8;margin:0 0 15px}
.tools{display:grid;gap:10px;margin-top:10px}.tool-row{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:14px;background:var(--card);border-radius:11px}
.tool-row strong{font-size:14px}.tool-row small{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}
.toggle{min-width:52px;height:30px;border-radius:17px;background:#2a4360;flex-shrink:0;position:relative}
.toggle:after{content:"";position:absolute;top:5px;left:5px;width:20px;height:20px;background:white;border-radius:50%;transition:transform .15s ease}
.toggle[aria-pressed="true"]{background:var(--accent)}.toggle[aria-pressed="true"]:after{transform:translateX(22px)}
#quicktools{display:none;padding:4px 2px}#quicktools h2{font-size:18px;margin:10px 0 6px}#quicktools p{color:var(--muted);font-size:12px;line-height:1.7}
body[data-mode="quicktools"] #shell{padding:9px 13px;gap:6px}body[data-mode="quicktools"] #home,body[data-mode="quicktools"] #other{display:none!important}
body[data-mode="quicktools"] #detail{display:flex}body[data-mode="quicktools"] .brand-icon,body[data-mode="quicktools"] .brand-text{display:none}
body[data-mode="quicktools"] .header{height:40px}body[data-mode="quicktools"] #quicktools,body[data-mode="quicktools"] main{display:block;overflow-y:auto}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:8px}
.theme-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;min-height:110px;display:flex;align-items:flex-start;gap:10px}
.theme-card:hover{background:var(--card2)}.theme-card.selected{border-color:var(--accent)}
.theme-swatch{flex:0 0 26px;height:26px;border-radius:8px;border:1px solid #ffffff30}
.theme-card strong{display:block;font-size:13px}.theme-card small{color:var(--muted);font-size:11px;line-height:1.6;display:block;margin-top:5px}
@media(max-width:500px){.themes{grid-template-columns:1fr}.theme-card{min-height:70px}}
body[data-mode="appearance"] #shell{padding:9px 13px;gap:6px}
body[data-mode="appearance"] #home,body[data-mode="appearance"] #other{display:none!important}
body[data-mode="appearance"] #detail{display:flex}
body[data-mode="appearance"] .brand-icon,body[data-mode="appearance"] .brand-text{display:none}
body[data-mode="appearance"] #appearance{display:block}
body[data-mode="appearance"] .header{height:40px}
body[data-mode="appearance"] main{display:block;overflow-y:auto}
#other{display:none}#other.open{display:block}
#other .tiles{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:6px}
#other h2{font-size:15px;margin:2px 0 12px}.muted{color:var(--muted);font-size:11px;line-height:1.6}
#detail{display:none;align-items:center;gap:10px;width:100%;min-width:0}
#detail .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
body[data-mode="detail"] #shell{padding:9px 13px;gap:0}
body[data-mode="detail"] #home,body[data-mode="detail"] #other{display:none!important}
body[data-mode="detail"] .header{height:40px}body[data-mode="detail"] .brand-icon,body[data-mode="detail"] .brand-text{display:none}
body[data-mode="detail"] #detail{display:flex}
body[data-mode="detail"] main{display:none}
body[data-mode="detail"] .close{font-size:18px}
@media(max-width:350px){#shell{padding:10px;gap:8px}.tile{padding:7px;min-height:52px}.tile .glyph{width:32px;height:32px;flex-basis:32px}}
@media(prefers-reduced-motion:no-preference){.tile,.actions button{transition:background .14s ease}}
</style>
</head>
<body data-mode="home">
<div id="shell">
<header class="header" id="dragHandle">
  <div class="brand-icon" aria-hidden="true">G</div>
  <div class="brand-text"><div class="brand-name">GGman</div><div class="subhead">轻盈的 LOL 控制中心</div></div>
  <div id="detail"><button class="back" aria-label="返回上一页" data-action="back">‹</button><span class="title" id="routeTitle">LOL 工作台</span><button class="home" title="返回控制中心" data-action="home">⌂</button></div>
  <button class="close" aria-label="关闭控制中心" data-action="close">×</button>
</header>
<main id="pages">
  <section id="home">
    <div class="status"><b id="clientConnection">LOL · 等待连接</b><span id="clientPhase">正在等候当前客户端状态</span><span class="hint">打开 LOL 客户端后会自动显示当前场景</span></div>
    <div class="tiles">
      <button class="tile" data-route="dashboard"><span class="glyph">L</span><span>LOL 工作台</span></button>
      <button class="tile" data-route="player"><span class="glyph">战</span><span>我的战绩</span></button>
      <button class="tile" data-route="mayhem"><span class="glyph">海</span><span>海斗攻略</span></button>
      <button class="tile" data-route="efficiency"><span class="glyph">工</span><span>快捷工具</span></button>
    </div>
    <div class="actions">
      <button data-route="cleanup">清理与修复</button>
      <button data-route="appearance">个性化</button>
      <button data-action="more">更多功能</button>
    </div>
  </section>
  <section id="quicktools">
    <h2>快捷工具</h2><p>开关实时保存到现有 GGman 设置，继续由原生游戏流程控制器执行操作。</p>
    <div class="tools" id="quickSettings">
      <div class="tool-row"><span><strong>自动开始排队</strong><small>符合组队条件时自动寻找对局</small></span><button class="toggle" data-setting="autoSearch" aria-pressed="false" aria-label="自动开始排队"></button></div>
      <div class="tool-row"><span><strong>自动接受对局</strong><small>匹配成功时自动接受一次</small></span><button class="toggle" data-setting="autoAccept" aria-pressed="false" aria-label="自动接受对局"></button></div>
      <div class="tool-row"><span><strong>断线自动重连</strong><small>仅在可确认重连状态后执行</small></span><button class="toggle" data-setting="autoReconnect" aria-pressed="false" aria-label="断线自动重连"></button></div>
      <div class="tool-row"><span><strong>赛后自动点赞</strong><small>延续已保存的点赞优先级</small></span><button class="toggle" data-setting="autoHonor" aria-pressed="false" aria-label="赛后自动点赞"></button></div>
      <div class="tool-row"><span><strong>赛后返回大厅</strong><small>结束点赞流程后再返回</small></span><button class="toggle" data-setting="autoReturn" aria-pressed="false" aria-label="赛后返回大厅"></button></div>
    </div>
    <p id="toolResult" role="status" aria-live="polite"></p>
    <div class="actions"><button data-route="efficiency-advanced">查看其他高级选项</button></div>
  </section>
  <section id="appearance">
    <h2>外观与主题</h2><p>选择喜欢的配色，点击即应用并保存。所有设置仍由 GGman 本地管理。</p>
    <div class="themes" id="themeList" aria-label="可选择的主题"></div>
    <p id="themeResult" role="status" aria-live="polite"></p>
  </section>
  <section id="other">
    <h2>更多功能</h2>
    <div class="tiles">
      <button class="tile" data-route="live"><span class="glyph">实</span>实时对局</button>
      <button class="tile" data-route="recommendation"><span class="glyph">荐</span>出装推荐</button>
      <button class="tile" data-route="presence"><span class="glyph">在</span>在线状态</button>
      <button class="tile" data-route="repair"><span class="glyph">修</span>游戏修复</button>
      <button class="tile" data-route="profile"><span class="glyph">我</span>我的 GGman</button>
    </div>
    <p class="muted">选择功能后在当前控制中心内打开，点击返回可以回到此处。</p>
    <div class="actions"><button data-action="back">返回控制中心</button></div>
  </section>
</main>
</div>
<script>
(function(){
"use strict";
var titles={dashboard:"LOL 工作台",player:"我的战绩",live:"实时对局",mayhem:"海斗攻略",profile:"我的 GGman",recommendation:"出装推荐",efficiency:"快捷工具",repair:"游戏修复",presence:"在线状态",cleanup:"清理与修复",appearance:"外观与主题","efficiency-advanced":"高级工具设置"};
var mode="home";
function post(action){if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(action);}
function setMode(next,title){
  mode=next==="quicktools"?"quicktools":next==="appearance"?"appearance":next==="detail"?"detail":next==="more"?"more":"home";
  document.body.dataset.mode=mode;
  document.getElementById("other").classList.toggle("open",mode==="more");
  document.getElementById("home").style.display=mode==="home"?"block":"none";
  document.getElementById("routeTitle").textContent=titles[title]||"LOL 工作台";
}
document.addEventListener("click",function(event){
  var target=event.target.closest("button");
  if(!target)return;
  if(target.dataset.theme){post("theme:"+target.dataset.theme);return;}
  if(target.dataset.setting){
    if(target.disabled)return;
    var enabled=target.getAttribute("aria-pressed")==="true";
    target.disabled=true;
    post("toggle:"+target.dataset.setting+":"+(!enabled?"true":"false"));
    return;
  }
  if(target.dataset.route&&titles[target.dataset.route]){post("open:"+target.dataset.route);return;}
  var action=target.dataset.action;
  if(action==="close")post("close");
  else if(action==="back"){if(mode==="more")setMode("home");else post("back");}
  else if(action==="home"){post("home");}
  else if(action==="more")setMode("more");
});
document.addEventListener("keydown",function(event){
  if(event.key==="Escape"){event.preventDefault();if(mode==="more")setMode("home");else if(mode==="detail"||mode==="appearance"||mode==="quicktools")post("back");else post("close");}
});
if(window.chrome&&window.chrome.webview)window.chrome.webview.addEventListener("message",function(e){
  var value=String(e.data||"");
  if(e.data&&typeof e.data==="object"&&e.data.type==="quick-tools"){
    Object.keys(e.data.values||{}).forEach(function(key){
      var button=document.querySelector("[data-setting=\""+key+"\"]");
      if(button){button.setAttribute("aria-pressed",e.data.values[key]?"true":"false");button.disabled=false;}
    });
    document.getElementById("toolResult").textContent=e.data.message||"";
    return;
  }
  if(e.data&&typeof e.data==="object"&&e.data.type==="tool-error"){
    document.querySelectorAll("[data-setting]").forEach(function(button){button.disabled=false;});
    document.getElementById("toolResult").textContent="保存失败，请检查程序日志";return;
  }
  if(e.data&&typeof e.data==="object"&&e.data.type==="themes"){renderThemes(e.data);return;}
  if(e.data&&typeof e.data==="object"&&e.data.type==="theme-error"){
    document.getElementById("themeResult").textContent="保存主题失败，请查看程序日志";return;
  }
  if(e.data&&typeof e.data==="object"&&e.data.type==="status"){
    document.getElementById("clientConnection").textContent=e.data.connected?"LOL · 已连接":"LOL · 未连接";
    document.getElementById("clientPhase").textContent=e.data.connected?
      ("当前阶段 · "+phaseLabel(e.data.phase)):"请先启动英雄联盟客户端";
    return;
  }
  if(value==="home"||value==="more")setMode(value);
  else if(value==="detail:appearance")setMode("appearance","appearance");
  else if(value==="detail:efficiency")setMode("quicktools","efficiency");
  else if(value.indexOf("detail:")===0)setMode("detail",value.substring(7));
});
function phaseLabel(phase){
  var labels={None:"空闲",Disconnected:"未连接",Lobby:"组队大厅",Matchmaking:"正在匹配",ReadyCheck:"确认对局",ChampSelect:"选择英雄",InProgress:"游戏中",GameStart:"准备进入游戏",WaitingForStats:"结算中",PreEndOfGame:"赛后结算",EndOfGame:"赛后大厅",Reconnect:"重连中",TerminatedInError:"客户端异常"};
  return labels[String(phase||"")]||"已连接";
}
function renderThemes(data){
  var container=document.getElementById("themeList");container.replaceChildren();
  (Array.isArray(data.items)?data.items:[]).forEach(function(item){
    var button=document.createElement("button");button.className="theme-card"+(item.id===data.selected?" selected":"");
    button.setAttribute("data-theme",String(item.id||""));
    var swatch=document.createElement("span");swatch.className="theme-swatch";swatch.style.background=String(item.accent||"");
    var text=document.createElement("span");var title=document.createElement("strong");title.textContent=String(item.name||"");
    var caption=document.createElement("small");caption.textContent=String(item.description||"");
    text.append(title,caption);button.append(swatch,text);container.appendChild(button);
  });
  var current=(Array.isArray(data.items)?data.items:[]).find(function(item){return item.id===data.selected;});
  if(current){
    var css=document.documentElement.style;
    [["--canvas",current.background],["--card",current.surface],["--card2",current.surfaceRaised],
     ["--text",current.text],["--muted",current.muted],["--accent",current.accent],["--line",current.border]]
      .forEach(function(pair){if(pair[1])css.setProperty(pair[0],String(pair[1]));});
    document.documentElement.style.colorScheme=current.light?"light":"dark";
  }
  if(data.selected){document.getElementById("themeResult").textContent="当前主题已保存";}
}
document.getElementById("dragHandle").addEventListener("mousedown",function(e){
  if(e.button===0&&!e.target.closest("button"))post("drag");
});
window.GGmanUnifiedShell={setMode:setMode,knownRoutes:Object.keys(titles)};
})();
</script>
</body></html>
