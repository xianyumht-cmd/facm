<section class="hero"><div class="hero-copy"><div class="status-line"><span class="green-dot" style="${state.demoConnected?'':'background:#bbcce0;box-shadow:none'}"></span>${state.demoConnected?'演示状态 · 大厅已连接':'演示状态 · 尚未连接大厅'}</div><h2>${state.demoConnected?'一切就绪，开始游戏。':'打开大厅，准备出发。'}</h2><p>${state.demoConnected?'这里会显示当前客户端阶段和最相关的操作。':'这里不会假装真实连接；点击右上角可切换演示状态。'}</p><div class="hero-buttons"><button class="primary-btn" data-route="matches">查看战绩 ${icon('arrow')}</button><button class="ghost-btn" data-route="guides">浏览攻略</button></div></div><div class="hero-orb" aria-hidden="true"><span class="shine"></span><span class="g">G</span></div></section>
<div class="section-row"><h3>习惯，已经替你记住</h3><small>开关只影响本页演示状态</small></div><div class="cards">${tile('bolt','自动接受对局','进入确认阶段时使用现有接受功能。','ready')}${tile('layers','自动应用配置','装备、符文与技能方案统一管理。','build')}${tile('cloud','云端配置同步','换号或换机时优先恢复你的设置。','sync')}</div>
<div class="section-row"><h3>刚刚发生</h3><button class="link-btn" data-route="matches">所有对局 →</button></div><div class="bottom-split"><section class="line-card"><div class="list-entry"><div class="game-badge">${icon('gamepad')}</div><div class="entry-text"><b>亚索 · 海克斯大乱斗</b><small>示例对局 / 非真实战绩</small></div><span class="entry-right">胜利</span></div><div class="list-entry"><div class="game-badge">${icon('spark')}</div><div class="entry-text"><b>攻略示例 · 阿狸</b><small>这里预览选择英雄后的建议界面</small></div><button class="link-btn" data-route="guides">查看 →</button></div></section><section class="note-panel"><strong>属于你的游戏空间</strong><p>常用入口、配置与数据汇总在一个安静的工作台里。云端操作仍由原来的 GGman 服务负责。</p><span class="big">01 <small>/ 设计原型</small></span></section></div>`;}
function matchRows(){const list=data.filter(x=>(x.hero+x.mode+x.result).includes(state.query));return list.map(x=>`<div class="table-item" tabindex="0" role="button" data-match="${data.indexOf(x)}"><span><b>${x.hero}</b><small>${x.mode}</small></span><span>${x.kd}</span><span class="result-${x.tag}">${x.result}</span><span style="color:#bad6f5">${icon('chevron')}</span></div>`).join('')||'<div style="padding:24px;color:#b0c3da;font-size:12px">没有匹配的演示记录</div>';}
function matches(){return `${title('MATCH HISTORY',['对局战绩','更舒服地回顾每一局，而不是翻找一张张挤在一起的表格。'])}<div class="section-row"><h3>最近对局 <small>· 演示数据</small></h3><input id="matchSearch" class="searchfield" placeholder="搜索英雄或模式…" value="${esc(state.query)}" aria-label="搜索演示战绩" /></div><div class="table-card"><div class="table-head"><span>英雄 / 模式</span><span>战绩</span><span>结果</span><span>详情</span></div><div id="matchesRows">${matchRows()}</div></div><p style="color:#98acc7;font-size:11px;margin-top:19px">正式版将继续使用 GGman 现有的战绩查询服务。此处没有网络请求。</p>`;}
function guides(){return `${title('MAYHEM GUIDE',['英雄灵感，随手可得。','挑一个英雄，看看攻略页面在新的视觉体系里是什么样。'])}<div class="section-row"><h3>英雄攻略</h3><small>点击卡片查看交互详情</small></div><div class="guide-grid">${[['亚索','战士 / 近战','Y'],['阿狸','法师 / 机动','A'],['金克丝','射手 / 输出','J'],['拉克丝','法师 / 控制','L'],['伊泽瑞尔','射手 / 灵活','E'],['卡莎','射手 / 爆发','K']].map(([a,b,c])=>`<button class="guide" data-guide="${a}" aria-label="查看${a}演示攻略"><div class="champion-icon">${c}</div><h4>${a}</h4><p>${b}</p><div class="guide-arrow">${icon('arrow')}</div></button>`).join('')}</div><p style="color:#92a9c8;font-size:11px;margin-top:20px">英雄头像采用抽象占位符；不伪装为实时数据或真实资源。</p>`;}
function automation(){return `${title('AUTOMATION',['自动化，刚刚好。','每个动作都能看懂，也随时能够关掉。'])}<div class="line-card">${[['ready','自动接受对局','只在匹配确认阶段触发，状态由现有服务管理。'],['build','应用英雄配置','只在符合当前游戏阶段和规则时提供自动应用。'],['autoQueue','赛后自动继续','演示自动衔接下一场的开关结构。'],['autoHide','进入游戏时隐藏悬浮球','游戏优先，避免悬浮界面打扰对局。']].map(([key,label,desc])=>`<div class="setting-row"><div><b>${label}</b><p>${desc}</p></div>${pillSwitch(key)}</div>`).join('')}</div><div class="demo-warning" style="margin-top:16px">这是纯交互原型，切换这些按钮不会写入游戏客户端或 GGman 配置。</div>`;}
function profile(){return `${title('MY GGMAN',['你的 GGman，跟你走。','配置跨电脑、跨账号的体验应该简单、可靠，而且状态清楚。'])}<section class="hero" style="min-height:190px"><div class="hero-copy"><div class="status-line"><span class="green-dot" style="background:#c6dafa;box-shadow:none"></span> 演示账户 · 未登录</div><h2>始终是熟悉的设置。</h2><p>云端优先与本地恢复只是视觉演示，不访问 CloudBase。</p><div class="hero-buttons"><button class="primary-btn" data-action="cloud">${icon('cloud')} 查看同步流程</button></div></div><div class="hero-orb" aria-hidden="true"><span class="g">G</span></div></section><div class="section-row"><h3>便携配置</h3><small>只显示允许同步的项目</small></div><div class="line-card">${[['应用偏好','自动同步 · 视觉状态'],['ESC 游戏设置','手动上传 · 新设备恢复'],['大厅设置','仅演示状态，不访问本地文件']].map(([x,y])=>`<div class="setting-row"><div><b>${x}</b><p>${y}</p></div>${icon('check')}</div>`).join('')}</div>`;}
function settings(){return `${title('PREFERENCES',['调整到你喜欢的样子。','真正的主题不只是换颜色，还应该让质感、动画和阅读体验保持一致。'])}<div class="line-card"><div class="setting-row"><div><b>外观模式</b><p>夜色玻璃或浅色玻璃，两套界面都可切换。</p></div><div class="segmented"><button id="modeDark" class="${state.light?'':'sel'}">深色</button><button id="modeLight" class="${state.light?'sel':''}">浅色</button></div></div><div class="setting-row"><div><b>背景模糊</b><p>调整交互原型的模糊强度，观察文字和背景之间的关系。</p></div><input type="range" id="blurRange" class="range" min="8" max="55" step="1" value="${state.glass}" aria-label="背景模糊强度" /></div><div class="setting-row"><div><b>减少动画</b><p>减少位移与缩放过渡，保留完整键盘操作。</p></div><button class="switch" role="switch" aria-checked="${state.reduced}" data-reduced="1" aria-label="减少动画"></button></div><div class="setting-row"><div><b>窗口收起行为</b><p>支持通过右上角、Esc 或桌面悬浮入口收起。</p></div><button class="ghost-btn" data-action="hide">体验</button></div></div><div class="demo-warning" style="margin-top:16px">正式实现会继续复用 GGman 已保存的主题、窗口位置与配置所有权。本页面不会写入这些数据。</div>`;}
function render(){const page=state.page;$('bread').textContent=names[page];$('navPrimary').innerHTML=routes.slice(0,4).map(nav).join('');$('navSecondary').innerHTML=routes.slice(4).map(nav).join('');$('pageBody').className='page';$('pageBody').innerHTML=({overview,matches,guides,automation,profile,settings}[page]||overview)();$('pageWrap').scrollTop=0;}
function nav([key,label,glyph]){return `<button class="nav-btn ${state.page===key?'active':''}" ${state.page===key?'aria-current="page"':''} data-route="${key}" title="${label}">${icon(glyph)}<span>${label}</span></button>`;}
function showToast(txt){const el=$('toast');el.textContent=txt;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2400);}
let lastModalFocus=null;
function showModal(label,head,desc,body){lastModalFocus=document.activeElement;$('modalLabel').textContent=label;$('modalTitle').textContent=head;$('modalDesc').textContent=desc;$('modalContent').textContent=body;$('modalScrim').classList.add('open');$('modalScrim').setAttribute('aria-hidden','false');$('modalClose').focus();}
function closeModal(){$('modalScrim').classList.remove('open');$('modalScrim').setAttribute('aria-hidden','true');if(lastModalFocus&&lastModalFocus.isConnected)lastModalFocus.focus();lastModalFocus=null;}
function closeQuick(){$('quickPop').classList.remove('open');$('dockLauncher').setAttribute('aria-expanded','false');}
function openWindow(){$('appWindow').classList.remove('hide');}
function hideWindow(){$('appWindow').classList.add('hide');closeQuick();}
function route(page){if(!names[page])return;closeQuick();openWindow();state.page=page;state.query='';render();}
function toggleTheme(){state.light=!state.light;document.body.classList.toggle('light',state.light);if(state.page==='settings')render();}
function toggleSetting(key){state.toggles[key]=!state.toggles[key];render();showToast(`演示开关：${state.toggles[key]?'已开启':'已关闭'} · 未保存到 GGman`);}
const quick=[['overview','工作台','总览与游戏状态','grid'],['matches','对局战绩','记录，一眼看清','history'],['guides','海斗攻略','英雄的下一步','spark'],['automation','自动化','轻松管理开关','sliders']];
$('quickGrid').innerHTML=`<button class="quick-feature" data-route="overview"><span class="feature-icon">${icon('grid')}</span><b>打开游戏空间</b><small>继续之前的 GGman 工作台</small><span class="quick-arrow">${icon('arrow')}</span></button><div class="quick-stack">${quick.slice(1).map(([key,a,b,c])=>`<button class="quick-item" data-route="${key}"><span class="symbol">${icon(c)}</span><span class="label"><b>${a}</b><small>${b}</small></span>${icon('chevron')}</button>`).join('')}</div>`;
$('dockLauncher').setAttribute('aria-expanded','false');
$('dockLauncher').addEventListener('click',()=>{const q=$('quickPop');q.classList.toggle('open');$('dockLauncher').setAttribute('aria-expanded',String(q.classList.contains('open')));});
$('dockWindow').onclick=()=>{if($('appWindow').classList.contains('hide'))openWindow();else hideWindow();};
$('dockGuides').onclick=()=>route('guides');$('dockSettings').onclick=()=>route('settings');
$('hideWindow').onclick=hideWindow;$('themeButton').onclick=toggleTheme;$('notifyButton').onclick=()=>showToast('当前是设计演示，没有连接通知服务。');
$('modalClose').onclick=closeModal;$('modalOkay').onclick=closeModal;$('modalScrim').addEventListener('click',e=>{if(e.target===$('modalScrim'))closeModal();});
$('stage').addEventListener('click',e=>{if(e.target.id==='stage')hideWindow();});
document.addEventListener('pointerdown',e=>{if($('quickPop').classList.contains('open')&&!e.target.closest('#quickPop,#dockLauncher'))closeQuick();});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-route],[data-toggle],[data-match],[data-guide],[data-action],[data-reduced]');if(!btn)return;
if(btn.dataset.route){route(btn.dataset.route);return;}
if(btn.dataset.toggle){toggleSetting(btn.dataset.toggle);return;}
if(btn.dataset.reduced){state.reduced=!state.reduced;document.body.classList.toggle('reduce',state.reduced);render();return;}
if(btn.dataset.match){const d=data[+btn.dataset.match];if(d)showModal('MATCH DETAIL · SAMPLE',`${d.hero} · ${d.result}`,`${d.mode} · ${d.time}`,`K/D/A：${d.kd}。这是展示交互的示例记录，不代表用户实际战绩。`);return;}
if(btn.dataset.guide){showModal('MAYHEM GUIDE · SAMPLE',`${btn.dataset.guide} 的攻略`, '强化、装备与技能建议，在一个清晰的阅读面板里查看。', '正式版复用原有数据来源。当前展示的是交互布局，不包含英雄实时胜率与实际出装排名。');return;}
if(btn.dataset.action==='demoLink'){state.demoConnected=!state.demoConnected;render();showToast('已切换演示游戏阶段');return;}
if(btn.dataset.action==='cloud'){showModal('CLOUD SYNC · SAMPLE','设置随你一起走','设备更换后优先读取云端配置，并清楚反馈实际同步状态。','这里只演示流程层级。无登录行为、无账号凭据，也没有修改 CloudBase 数据。');return;}
if(btn.dataset.action==='hide'){hideWindow();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modalScrim').classList.contains('open')){closeModal();return;}if($('quickPop').classList.contains('open')){closeQuick();return;}hideWindow();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('quickPop').classList.toggle('open');$('dockLauncher').setAttribute('aria-expanded',String($('quickPop').classList.contains('open')));}});
document.addEventListener('click',e=>{if(e.target.id==='modeDark'&&state.light)toggleTheme();if(e.target.id==='modeLight'&&!state.light)toggleTheme();});
document.addEventListener('input',e=>{if(e.target.id==='blurRange'){state.glass=Number(e.target.value);document.documentElement.style.setProperty('--blur',state.glass+'px');}if(e.target.id==='matchSearch'){state.query=e.target.value;$('matchesRows').innerHTML=matchRows();}});
document.addEventListener('keydown',e=>{const el=e.target.closest('[data-match]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click();}});
render();
})();
</script>
</body>
</html>
