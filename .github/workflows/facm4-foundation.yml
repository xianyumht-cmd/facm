name: FACM 4.0 Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/facm-4-*'

jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare controlled PetHost payload
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'artifacts/pethost'
          $bundle = Join-Path $PWD 'out/PetHostBundle.zip'
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path $bundle) | Out-Null
          dotnet publish src/FACM.PetHost/FACM.PetHost.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'FACM.PetHost publish failed.' }
          $petHostExe = Join-Path $publish 'FACM.PetHost.exe'
          if (-not (Test-Path $petHostExe)) { throw 'FACM.PetHost.exe was not published.' }
          & $petHostExe --self-test
          if ($LASTEXITCODE -ne 0) { throw "FACM.PetHost self-test failed: $LASTEXITCODE" }
          foreach ($critical in @('FACM.PetHost.dll','FACM.PetHost.deps.json','hostfxr.dll','hostpolicy.dll','VPet-Simulator.Core.dll','PresentationFramework.dll','WindowsBase.dll','wpfgfx_cor3.dll')) {
            if (-not (Test-Path (Join-Path $publish $critical))) { throw "PetHost critical payload missing: $critical" }
          }
          if (Test-Path $bundle) { Remove-Item $bundle -Force }
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $bundle -CompressionLevel Optimal
          if (-not (Test-Path $bundle)) { throw 'PetHostBundle.zip was not created.' }
          Write-Host "PetHostBundle.zip bytes=$((Get-Item $bundle).Length)"

      - name: Verify architecture contract
        shell: pwsh
        run: ./scripts/check-facm4-architecture.ps1

      - name: Verify Shell design contract
        shell: pwsh
        run: ./scripts/check-facm4-shell.ps1

      - name: Verify desktop surface contract
        shell: pwsh
        run: ./scripts/check-facm4-desktop.ps1

      - name: Verify Cleanup safety contract
        shell: pwsh
        run: ./scripts/check-facm4-cleanup.ps1

      - name: Verify Repair parity contract
        shell: pwsh
        run: ./scripts/check-facm4-repair.ps1

      - name: Verify Personalization foundation contract
        shell: pwsh
        run: ./scripts/check-facm4-personalization.ps1

      - name: Verify League Workbench contract
        shell: pwsh
        run: ./scripts/check-facm4-league-workbench.ps1

      - name: Verify League recommended setup contract
        shell: pwsh
        run: ./scripts/check-facm4-league-recommended.ps1

      - name: Verify League efficiency contract
        shell: pwsh
        run: ./scripts/check-facm4-league-efficiency.ps1

      - name: Verify League bench quick-pick contract
        shell: pwsh
        run: ./scripts/check-facm4-league-bench.ps1

      - name: Verify ARAM Mayhem base query contract
        shell: pwsh
        run: ./scripts/check-facm4-mayhem.ps1

      - name: Verify Diagnostics Center contract
        shell: pwsh
        run: ./scripts/check-facm4-diagnostics.ps1

      - name: Verify DPI and accessibility contract
        shell: pwsh
        run: ./scripts/check-facm4-accessibility.ps1

      - name: Verify Recovery and feature policy contract
        shell: pwsh
        run: ./scripts/check-facm4-recovery.ps1

      - name: Verify release evidence and performance contract
        shell: pwsh
        run: ./scripts/check-facm4-release-evidence.ps1

      - name: Verify production cutover guard
        shell: pwsh
        run: ./scripts/check-facm4-cutover.ps1

      - name: Verify real-machine evidence collector contract
        shell: pwsh
        run: ./scripts/check-facm4-real-machine-evidence.ps1

      - name: Run Windows PowerShell 5.1 evidence collector self-test
        shell: powershell
        run: .\scripts\collect-facm4-real-machine-evidence.ps1 -SelfTest

      - name: Restore FACM 4.0 solution
        shell: pwsh
        run: dotnet restore FACM4.sln -p:Platform=x64

      - name: Build FACM 4.0 solution
        shell: pwsh
        run: dotnet build FACM4.sln -c Release -p:Platform=x64 -p:RequirePetHostBundle=true --no-restore

      - name: Run deterministic foundation smoke
        shell: pwsh
        run: dotnet run --project src/FACM.FoundationSmoke/FACM.FoundationSmoke.csproj -c Release

      - name: Run deterministic Windows runtime smoke
        shell: pwsh
        run: dotnet run --project src/FACM.WindowsSmoke/FACM.WindowsSmoke.csproj -c Release

      - name: Publish WinUI x64 self-contained candidate
        shell: pwsh
        run: >-
          dotnet publish src/FACM.App/FACM.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=true
          -p:RequirePetHostBundle=true
          -o artifacts/facm4

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/facm4/FACM.App.exe'
          if (-not (Test-Path $exe)) { throw 'FACM.App.exe was not published.' }
          $dlls = @(Get-ChildItem (Split-Path $exe) -Filter '*.dll' -File)
          if ($dlls.Count -gt 0) { throw "Single-file candidate leaked $($dlls.Count) DLL(s)." }
          Write-Host "FACM.App.exe bytes=$((Get-Item $exe).Length)"

      - name: Upload FACM 4.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: facm4-x64
          path: artifacts/facm4/
          if-no-files-found: error
