name: Runtime Companion Akari Automation Parity

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend existing matchmaking owner with bounded Akari-style options
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')
          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit('missing anchor: ' + label)
              return text.replace(old, new, 1)

          # Shared settings: keep the same INI/LKG owners and clamp all user-provided values.
          path = 'src/FACM/Services/AppSettings.cs'
          text = read(path)
          text = once(text,
              '        public bool LeagueAutoAcceptEnabled { get; set; } = false;\n',
              '        public bool LeagueAutoAcceptEnabled { get; set; } = false;\n'
              '        public int LeagueAutoMatchmakingMinPartySize { get; set; } = 1;\n'
              '        public int LeagueAutoMatchmakingStartDelayMs { get; set; } = 0;\n'
              '        public int LeagueAutoAcceptDelayMs { get; set; } = 0;\n',
              'settings fields')
          text = once(text,
              '                "LeagueAutoAcceptEnabled=" + LeagueAutoAcceptEnabled,\n',
              '                "LeagueAutoAcceptEnabled=" + LeagueAutoAcceptEnabled,\n'
              '                "LeagueAutoMatchmakingMinPartySize=" + LeagueAutoMatchmakingMinPartySize.ToString(CultureInfo.InvariantCulture),\n'
              '                "LeagueAutoMatchmakingStartDelayMs=" + LeagueAutoMatchmakingStartDelayMs.ToString(CultureInfo.InvariantCulture),\n'
              '                "LeagueAutoAcceptDelayMs=" + LeagueAutoAcceptDelayMs.ToString(CultureInfo.InvariantCulture),\n',
              'settings serialization')
          text = once(text,
              '            else if (key.Equals("LeagueAutoAcceptEnabled", StringComparison.OrdinalIgnoreCase) && bool.TryParse(value, out flag)) result.LeagueAutoAcceptEnabled = flag;\n',
              '            else if (key.Equals("LeagueAutoAcceptEnabled", StringComparison.OrdinalIgnoreCase) && bool.TryParse(value, out flag)) result.LeagueAutoAcceptEnabled = flag;\n'
              '            else if (key.Equals("LeagueAutoMatchmakingMinPartySize", StringComparison.OrdinalIgnoreCase) && int.TryParse(value, NumberStyles.Integer, CultureInfo.InvariantCulture, out number)) result.LeagueAutoMatchmakingMinPartySize = number;\n'
              '            else if (key.Equals("LeagueAutoMatchmakingStartDelayMs", StringComparison.OrdinalIgnoreCase) && int.TryParse(value, NumberStyles.Integer, CultureInfo.InvariantCulture, out number)) result.LeagueAutoMatchmakingStartDelayMs = number;\n'
              '            else if (key.Equals("LeagueAutoAcceptDelayMs", StringComparison.OrdinalIgnoreCase) && int.TryParse(value, NumberStyles.Integer, CultureInfo.InvariantCulture, out number)) result.LeagueAutoAcceptDelayMs = number;\n',
              'settings parsing')
          text = once(text,
              '            result.LeagueCloseLobbyHotkey = Sanitize(result.LeagueCloseLobbyHotkey).Trim();\n',
              '            result.LeagueCloseLobbyHotkey = Sanitize(result.LeagueCloseLobbyHotkey).Trim();\n'
              '            result.LeagueAutoMatchmakingMinPartySize = Math.Max(1, Math.Min(5, result.LeagueAutoMatchmakingMinPartySize));\n'
              '            result.LeagueAutoMatchmakingStartDelayMs = Math.Max(0, Math.Min(60000, result.LeagueAutoMatchmakingStartDelayMs));\n'
              '            result.LeagueAutoAcceptDelayMs = Math.Max(0, Math.Min(15000, result.LeagueAutoAcceptDelayMs));\n',
              'settings clamp')
          write(path, text)

          path = 'src/FACM/Services/AppSettingsRecovery.cs'
          text = read(path)
          text = once(text,
              '            "LeagueAutoAcceptEnabled",\n',
              '            "LeagueAutoAcceptEnabled",\n'
              '            "LeagueAutoMatchmakingMinPartySize",\n'
              '            "LeagueAutoMatchmakingStartDelayMs",\n'
              '            "LeagueAutoAcceptDelayMs",\n',
              'LKG known keys')
          write(path, text)

          # Existing matchmaking owner gains only bounded configuration; no new Gameflow/session/timer owner.
          path = 'src/FACM/League/LeagueMatchmakingAutomation.cs'
          text = read(path)
          text = once(text,
              '''        public bool IsEligible\n        {\n            get { return CanStartActivity && IsLeader && RealMemberCount > 0; }\n        }\n\n        public string BlockReason\n        {\n            get\n            {\n                if (!CanStartActivity) return "cannot-start";\n                if (!IsLeader) return "not-leader";\n                if (RealMemberCount <= 0) return "no-members";\n                return null;\n            }\n        }\n''',
              '''        public bool IsEligible\n        {\n            get { return IsEligibleFor(1); }\n        }\n\n        public string BlockReason\n        {\n            get { return BlockReasonFor(1); }\n        }\n\n        public bool IsEligibleFor(int minimumPartySize)\n        {\n            var minimum = Math.Max(1, Math.Min(5, minimumPartySize));\n            return CanStartActivity && IsLeader && RealMemberCount >= minimum;\n        }\n\n        public string BlockReasonFor(int minimumPartySize)\n        {\n            var minimum = Math.Max(1, Math.Min(5, minimumPartySize));\n            if (!CanStartActivity) return "cannot-start";\n            if (!IsLeader) return "not-leader";\n            if (RealMemberCount <= 0) return "no-members";\n            if (RealMemberCount < minimum) return "party-below-minimum-" + minimum.ToString();\n            return null;\n        }\n''',
              'lobby min-party policy')
          text = once(text,
              '        private bool _autoSearch;\n        private bool _autoAccept;\n',
              '        private bool _autoSearch;\n        private bool _autoAccept;\n'
              '        private int _minimumPartySize = 1;\n'
              '        private int _searchStartDelayMs;\n'
              '        private int _acceptDelayMs;\n',
              'controller config fields')
          old_config = '''        public void Configure(bool autoSearch, bool autoAccept)\n        {\n            bool restartLobby;\n            bool restartReady;\n            lock (_sync)\n            {\n                if (_disposed) return;\n                restartLobby = autoSearch && !_autoSearch && IsPhase("Lobby");\n                restartReady = autoAccept && !_autoAccept && IsPhase("ReadyCheck");\n                if (!autoSearch && _autoSearch)\n                {\n                    // Turning the feature off pauses this Lobby episode; it does not create a new one.\n                    // Preserve a claimed/confirmed/reconciled fingerprint so re-enabling cannot\n                    // duplicate a matchmaking POST whose wire outcome became ambiguous on cancel.\n                    // Observe clears it on the real Lobby phase boundary.\n                    _lastSearchDiagnostic = null;\n                    CancelLobbyLocked();\n                }\n                if (!autoAccept && _autoAccept)\n                {\n                    // A settings toggle does not end the current ReadyCheck episode. Preserve the\n                    // episode's at-most-once accept claim so OFF -> ON cannot duplicate an accept\n                    // that already succeeded or became ambiguous while cancellation was in flight.\n                    // Observe clears the claim only when Gameflow actually leaves ReadyCheck.\n                    CancelReadyLocked();\n                }\n                _autoSearch = autoSearch;\n                _autoAccept = autoAccept;\n            }\n            if (restartLobby) StartLobbyObserver();\n            if (restartReady) StartReadyObserver();\n        }\n'''
          new_config = '''        public void Configure(bool autoSearch, bool autoAccept)\n        {\n            Configure(autoSearch, autoAccept, 1, 0, 0);\n        }\n\n        public void Configure(\n            bool autoSearch,\n            bool autoAccept,\n            int minimumPartySize,\n            int searchStartDelayMs,\n            int acceptDelayMs)\n        {\n            minimumPartySize = Math.Max(1, Math.Min(5, minimumPartySize));\n            searchStartDelayMs = Math.Max(0, Math.Min(60000, searchStartDelayMs));\n            acceptDelayMs = Math.Max(0, Math.Min(15000, acceptDelayMs));\n\n            bool restartLobby;\n            bool restartReady;\n            lock (_sync)\n            {\n                if (_disposed) return;\n                var wasAutoSearch = _autoSearch;\n                var wasAutoAccept = _autoAccept;\n                var lobbyPolicyChanged = _minimumPartySize != minimumPartySize || _searchStartDelayMs != searchStartDelayMs;\n                var readyPolicyChanged = _acceptDelayMs != acceptDelayMs;\n\n                restartLobby = autoSearch && IsPhase("Lobby") && (!wasAutoSearch || lobbyPolicyChanged);\n                restartReady = autoAccept && IsPhase("ReadyCheck") && (!wasAutoAccept || readyPolicyChanged);\n\n                if ((!autoSearch && wasAutoSearch) || (autoSearch && wasAutoSearch && lobbyPolicyChanged))\n                {\n                    _lastSearchDiagnostic = null;\n                    CancelLobbyLocked();\n                }\n                if ((!autoAccept && wasAutoAccept) || (autoAccept && wasAutoAccept && readyPolicyChanged))\n                {\n                    CancelReadyLocked();\n                }\n\n                _autoSearch = autoSearch;\n                _autoAccept = autoAccept;\n                _minimumPartySize = minimumPartySize;\n                _searchStartDelayMs = searchStartDelayMs;\n                _acceptDelayMs = acceptDelayMs;\n            }\n            if (restartLobby) StartLobbyObserver();\n            if (restartReady) StartReadyObserver();\n        }\n'''
          text = once(text, old_config, new_config, 'controller configure')
          text = once(text,
              '''        private async Task RunLobbyObserverAsync(CancellationToken cancellationToken)\n        {\n            // Gameflow already proved that Lobby is active. Evaluate immediately; if the\n            // lobby payload has not caught up yet, the existing phase-bounded observer retries.\n            while (IsSearchActive())\n''',
              '''        private async Task RunLobbyObserverAsync(CancellationToken cancellationToken)\n        {\n            var initialDelay = GetSearchStartDelay();\n            if (initialDelay > TimeSpan.Zero)\n            {\n                AppLog.Info("League auto matchmaking: wait/start-delay-ms-" + ((int)initialDelay.TotalMilliseconds).ToString());\n                await _clock.Delay(initialDelay, cancellationToken).ConfigureAwait(false);\n            }\n            while (IsSearchActive())\n''',
              'search initial delay')
          text = once(text,
              '''            if (!lobby.IsEligible)\n            {\n                LogSearchDiagnostic(lobby.BlockReason ?? "not-eligible");\n                return false;\n            }\n''',
              '''            var minimumPartySize = GetMinimumPartySize();\n            if (!lobby.IsEligibleFor(minimumPartySize))\n            {\n                LogSearchDiagnostic(lobby.BlockReasonFor(minimumPartySize) ?? "not-eligible");\n                return false;\n            }\n''',
              'minimum party eligibility')
          text = once(text,
              '''        private async Task RunReadyObserverAsync(CancellationToken cancellationToken)\n        {\n            // The first attempt stays immediate. Only a real failed/ambiguous write pays the\n            // short retry delay, and every retry is bounded by the same ReadyCheck episode.\n            while (IsAcceptActive())\n''',
              '''        private async Task RunReadyObserverAsync(CancellationToken cancellationToken)\n        {\n            var initialDelay = GetAcceptDelay();\n            if (initialDelay > TimeSpan.Zero)\n            {\n                AppLog.Info("League auto accept: wait/delay-ms-" + ((int)initialDelay.TotalMilliseconds).ToString());\n                await _clock.Delay(initialDelay, cancellationToken).ConfigureAwait(false);\n            }\n            while (IsAcceptActive())\n''',
              'accept initial delay')
          marker = '''        private bool IsSearchActive()\n'''
          helpers = '''        private int GetMinimumPartySize()\n        {\n            lock (_sync) return _minimumPartySize;\n        }\n\n        private TimeSpan GetSearchStartDelay()\n        {\n            lock (_sync) return TimeSpan.FromMilliseconds(_searchStartDelayMs);\n        }\n\n        private TimeSpan GetAcceptDelay()\n        {\n            lock (_sync) return TimeSpan.FromMilliseconds(_acceptDelayMs);\n        }\n\n'''
          text = once(text, marker, helpers + marker, 'matchmaking config readers')
          write(path, text)

          # Module persists and reconfigures the same automation controller.
          path = 'src/FACM/Application/Modules/LeagueEfficiencyModule.cs'
          text = read(path)
          text = once(text,
              '            _matchmaking.Configure(AutoMatchmakingEnabled, AutoAcceptEnabled);\n',
              '            _matchmaking.Configure(AutoMatchmakingEnabled, AutoAcceptEnabled, AutoMatchmakingMinPartySize, AutoMatchmakingStartDelayMs, AutoAcceptDelayMs);\n',
              'module initial configure')
          text = once(text,
              '        public bool AutoAcceptEnabled { get { return _settingsModule.Settings.LeagueAutoAcceptEnabled; } }\n',
              '        public bool AutoAcceptEnabled { get { return _settingsModule.Settings.LeagueAutoAcceptEnabled; } }\n'
              '        public int AutoMatchmakingMinPartySize { get { return _settingsModule.Settings.LeagueAutoMatchmakingMinPartySize; } }\n'
              '        public int AutoMatchmakingStartDelayMs { get { return _settingsModule.Settings.LeagueAutoMatchmakingStartDelayMs; } }\n'
              '        public int AutoAcceptDelayMs { get { return _settingsModule.Settings.LeagueAutoAcceptDelayMs; } }\n',
              'module policy properties')
          old = '''        public void UpdateMatchmakingSettings(bool autoSearch, bool autoAccept)\n        {\n            ThrowIfDisposed();\n            _settingsModule.Settings.LeagueAutoMatchmakingEnabled = autoSearch;\n            _settingsModule.Settings.LeagueAutoAcceptEnabled = autoAccept;\n            _settingsModule.Settings.Save();\n            if (_matchmaking != null)\n            {\n                _matchmaking.Configure(autoSearch, autoAccept);\n                var current = _dashboard.CurrentGameflowState;\n                if (current != null) _matchmaking.Observe(current);\n            }\n        }\n'''
          new = '''        public void UpdateMatchmakingSettings(\n            bool autoSearch,\n            bool autoAccept,\n            int minimumPartySize,\n            int searchStartDelayMs,\n            int acceptDelayMs)\n        {\n            ThrowIfDisposed();\n            minimumPartySize = Math.Max(1, Math.Min(5, minimumPartySize));\n            searchStartDelayMs = Math.Max(0, Math.Min(60000, searchStartDelayMs));\n            acceptDelayMs = Math.Max(0, Math.Min(15000, acceptDelayMs));\n            _settingsModule.Settings.LeagueAutoMatchmakingEnabled = autoSearch;\n            _settingsModule.Settings.LeagueAutoAcceptEnabled = autoAccept;\n            _settingsModule.Settings.LeagueAutoMatchmakingMinPartySize = minimumPartySize;\n            _settingsModule.Settings.LeagueAutoMatchmakingStartDelayMs = searchStartDelayMs;\n            _settingsModule.Settings.LeagueAutoAcceptDelayMs = acceptDelayMs;\n            _settingsModule.Settings.Save();\n            if (_matchmaking != null)\n            {\n                _matchmaking.Configure(autoSearch, autoAccept, minimumPartySize, searchStartDelayMs, acceptDelayMs);\n                var current = _dashboard.CurrentGameflowState;\n                if (current != null) _matchmaking.Observe(current);\n            }\n        }\n'''
          text = once(text, old, new, 'module update settings')
          write(path, text)

          # Localized UI copy.
          path = 'src/FACM/League/LeagueEfficiencyUiText.cs'
          text = read(path)
          text = once(text,
              '        public const string AutoAcceptHint = "LeagueEfficiencyAutoAcceptHint";\n',
              '        public const string AutoAcceptHint = "LeagueEfficiencyAutoAcceptHint";\n'
              '        public const string MinPartySize = "LeagueEfficiencyMinPartySize";\n'
              '        public const string MinPartySizeHint = "LeagueEfficiencyMinPartySizeHint";\n'
              '        public const string MatchmakingDelay = "LeagueEfficiencyMatchmakingDelay";\n'
              '        public const string MatchmakingDelayHint = "LeagueEfficiencyMatchmakingDelayHint";\n'
              '        public const string AcceptDelay = "LeagueEfficiencyAcceptDelay";\n'
              '        public const string AcceptDelayHint = "LeagueEfficiencyAcceptDelayHint";\n',
              'efficiency text keys')
          text = once(text,
              '            { LeagueEfficiencyUiTextKeys.AutoAcceptHint, "匹配成功后自动接受一次；已经接受或你主动拒绝时不会反复操作。" },\n',
              '            { LeagueEfficiencyUiTextKeys.AutoAcceptHint, "匹配成功后自动接受一次；已经接受或你主动拒绝时不会反复操作。" },\n'
              '            { LeagueEfficiencyUiTextKeys.MinPartySize, "自动排队最低人数" },\n'
              '            { LeagueEfficiencyUiTextKeys.MinPartySizeHint, "只有当前大厅真人数量达到这个值时才自动开始排队；1-5 人。" },\n'
              '            { LeagueEfficiencyUiTextKeys.MatchmakingDelay, "排队前等待" },\n'
              '            { LeagueEfficiencyUiTextKeys.MatchmakingDelayHint, "进入大厅并满足条件后等待一段时间再开始排队；期间离开大厅会立即取消。" },\n'
              '            { LeagueEfficiencyUiTextKeys.AcceptDelay, "接受对局延迟" },\n'
              '            { LeagueEfficiencyUiTextKeys.AcceptDelayHint, "ReadyCheck 出现后等待指定时间再接受；离开 ReadyCheck 或关闭自动接受会立即取消。" },\n',
              'efficiency text defaults')
          write(path, text)

          # Compact numeric controls in existing Efficiency surface.
          path = 'src/FACM/League/LeagueEfficiencyForm.cs'
          text = read(path)
          text = once(text,
              '        private readonly CheckBox _autoAccept;\n',
              '        private readonly CheckBox _autoAccept;\n'
              '        private readonly NumericUpDown _minPartySize;\n'
              '        private readonly NumericUpDown _matchmakingDelaySeconds;\n'
              '        private readonly NumericUpDown _acceptDelaySeconds;\n',
              'form numeric fields')
          text = once(text,
              '            ClientSize = new Size(720, 680);\n            MinimumSize = new Size(680, 610);\n',
              '            ClientSize = new Size(720, 760);\n            MinimumSize = new Size(680, 650);\n',
              'form size')
          text = once(text,
              '                RowCount = 13,\n',
              '                RowCount = 16,\n',
              'form row count')
          text = once(text,
              '            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Percent, 100));\n',
              '            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Absolute, 52));\n            root.RowStyles.Add(new RowStyle(SizeType.Percent, 100));\n',
              'form added row styles')
          text = once(text,
              '''            _autoSearch.CheckedChanged += MatchmakingSettingChanged;\n            _autoAccept.CheckedChanged += MatchmakingSettingChanged;\n\n            _module.HonorStatusChanged += HandleHonorStatusChanged;\n''',
              '''            _autoSearch.CheckedChanged += MatchmakingSettingChanged;\n            _autoAccept.CheckedChanged += MatchmakingSettingChanged;\n            _minPartySize = AddNumberRow(root, 12, T(LeagueEfficiencyUiTextKeys.MinPartySize), T(LeagueEfficiencyUiTextKeys.MinPartySizeHint), 1m, 5m, 1m, _module.AutoMatchmakingMinPartySize, "人");\n            _matchmakingDelaySeconds = AddNumberRow(root, 13, T(LeagueEfficiencyUiTextKeys.MatchmakingDelay), T(LeagueEfficiencyUiTextKeys.MatchmakingDelayHint), 0m, 60m, 1m, _module.AutoMatchmakingStartDelayMs / 1000m, "秒");\n            _acceptDelaySeconds = AddNumberRow(root, 14, T(LeagueEfficiencyUiTextKeys.AcceptDelay), T(LeagueEfficiencyUiTextKeys.AcceptDelayHint), 0m, 15m, 0.5m, _module.AutoAcceptDelayMs / 1000m, "秒");\n            _minPartySize.ValueChanged += MatchmakingSettingChanged;\n            _matchmakingDelaySeconds.ValueChanged += MatchmakingSettingChanged;\n            _acceptDelaySeconds.ValueChanged += MatchmakingSettingChanged;\n\n            _module.HonorStatusChanged += HandleHonorStatusChanged;\n''',
              'form new numeric rows')
          text = once(text,
              '            Controls.Add(root);\n            _loading = false;\n',
              '            Controls.Add(root);\n            _loading = false;\n            UpdateMatchmakingControlStates();\n',
              'form control state init')
          marker = '''        private void WireHelp(Control control, string text)\n'''
          helper = '''        private NumericUpDown AddNumberRow(\n            TableLayoutPanel parent,\n            int row,\n            string title,\n            string hint,\n            decimal minimum,\n            decimal maximum,\n            decimal increment,\n            decimal value,\n            string suffix)\n        {\n            var panel = new TableLayoutPanel\n            {\n                Dock = DockStyle.Fill,\n                ColumnCount = 3,\n                RowCount = 1,\n                Margin = new Padding(0, 4, 0, 4),\n                BackColor = FacmDesignSystem.Surface,\n                Padding = new Padding(12, 7, 12, 7)\n            };\n            panel.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100));\n            panel.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 96));\n            panel.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 34));\n            var titleLabel = new Label\n            {\n                Text = title,\n                Dock = DockStyle.Fill,\n                Font = new Font(Font.FontFamily, 10F, FontStyle.Bold),\n                ForeColor = FacmDesignSystem.Text,\n                BackColor = Color.Transparent,\n                TextAlign = ContentAlignment.MiddleLeft\n            };\n            var input = new NumericUpDown\n            {\n                Minimum = minimum,\n                Maximum = maximum,\n                Increment = increment,\n                DecimalPlaces = increment < 1m ? 1 : 0,\n                Value = Math.Max(minimum, Math.Min(maximum, value)),\n                Dock = DockStyle.Fill,\n                Margin = new Padding(4, 2, 4, 2),\n                BackColor = FacmDesignSystem.CanvasRaised,\n                ForeColor = FacmDesignSystem.Text,\n                BorderStyle = BorderStyle.FixedSingle,\n                TextAlign = HorizontalAlignment.Right\n            };\n            var unit = new Label\n            {\n                Text = suffix ?? string.Empty,\n                Dock = DockStyle.Fill,\n                ForeColor = FacmDesignSystem.TextMuted,\n                BackColor = Color.Transparent,\n                TextAlign = ContentAlignment.MiddleLeft\n            };\n            panel.Controls.Add(titleLabel, 0, 0);\n            panel.Controls.Add(input, 1, 0);\n            panel.Controls.Add(unit, 2, 0);\n            WireHelp(panel, hint);\n            WireHelp(titleLabel, hint);\n            WireHelp(input, hint);\n            WireHelp(unit, hint);\n            parent.Controls.Add(panel, 0, row);\n            return input;\n        }\n\n'''
          text = once(text, marker, helper + marker, 'form number row helper')
          text = once(text,
              '''        private void MatchmakingSettingChanged(object sender, EventArgs e)\n        {\n            if (_loading) return;\n            _module.UpdateMatchmakingSettings(_autoSearch.Checked, _autoAccept.Checked);\n            _status.ForeColor = FacmDesignSystem.Success;\n            _status.Text = T(LeagueEfficiencyUiTextKeys.NextGameSaved);\n        }\n''',
              '''        private void MatchmakingSettingChanged(object sender, EventArgs e)\n        {\n            if (_loading) return;\n            UpdateMatchmakingControlStates();\n            _module.UpdateMatchmakingSettings(\n                _autoSearch.Checked,\n                _autoAccept.Checked,\n                Decimal.ToInt32(_minPartySize.Value),\n                Decimal.ToInt32(_matchmakingDelaySeconds.Value * 1000m),\n                Decimal.ToInt32(_acceptDelaySeconds.Value * 1000m));\n            _status.ForeColor = FacmDesignSystem.Success;\n            _status.Text = T(LeagueEfficiencyUiTextKeys.NextGameSaved);\n        }\n\n        private void UpdateMatchmakingControlStates()\n        {\n            if (_minPartySize != null) _minPartySize.Enabled = _autoSearch != null && _autoSearch.Checked;\n            if (_matchmakingDelaySeconds != null) _matchmakingDelaySeconds.Enabled = _autoSearch != null && _autoSearch.Checked;\n            if (_acceptDelaySeconds != null) _acceptDelaySeconds.Enabled = _autoAccept != null && _autoAccept.Checked;\n        }\n''',
              'form matchmaking save')
          write(path, text)

          # Smoke: parse/serialize/clamp + minimum party + one-time configured delays.
          path = 'src/FACM/League/LeagueMatchmakingAutomationSmokeTest.cs'
          text = read(path)
          text = once(text,
              '            ValidateImmediatePhaseReaction();\n',
              '            ValidateImmediatePhaseReaction();\n            ValidateAkariStyleAutomationPolicies();\n',
              'smoke call')
          text = once(text,
              '''            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoAcceptEnabled=True");\n            Require(settings.LeagueAutoMatchmakingEnabled && settings.LeagueAutoAcceptEnabled,\n                "Gate 7 settings did not parse.");\n''',
              '''            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoAcceptEnabled=True");\n            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoMatchmakingMinPartySize=4");\n            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoMatchmakingStartDelayMs=2500");\n            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoAcceptDelayMs=750");\n            Require(settings.LeagueAutoMatchmakingEnabled && settings.LeagueAutoAcceptEnabled,\n                "Gate 7 settings did not parse.");\n            Require(settings.LeagueAutoMatchmakingMinPartySize == 4 && settings.LeagueAutoMatchmakingStartDelayMs == 2500 && settings.LeagueAutoAcceptDelayMs == 750,\n                "Akari-style matchmaking policy settings did not parse.");\n''',
              'smoke settings parse')
          text = once(text,
              '            Require(serialized.Contains("LeagueAutoAcceptEnabled=True"), "Auto-accept setting did not serialize.");\n',
              '            Require(serialized.Contains("LeagueAutoAcceptEnabled=True"), "Auto-accept setting did not serialize.");\n'
              '            Require(serialized.Contains("LeagueAutoMatchmakingMinPartySize=4"), "Minimum-party setting did not serialize.");\n'
              '            Require(serialized.Contains("LeagueAutoMatchmakingStartDelayMs=2500"), "Matchmaking delay setting did not serialize.");\n'
              '            Require(serialized.Contains("LeagueAutoAcceptDelayMs=750"), "Accept delay setting did not serialize.");\n'
              '            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoMatchmakingMinPartySize=99");\n'
              '            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoMatchmakingStartDelayMs=999999");\n'
              '            AppSettings.ApplyLineForSmokeTest(settings, "LeagueAutoAcceptDelayMs=-1");\n'
              '            Require(settings.LeagueAutoMatchmakingMinPartySize == 5 && settings.LeagueAutoMatchmakingStartDelayMs == 60000 && settings.LeagueAutoAcceptDelayMs == 0,\n'
              '                "Akari-style matchmaking policy clamps regressed.");\n',
              'smoke settings serialize clamp')
          marker = '''        private static void ValidateTencentLobbyWithoutOptionalFields()\n'''
          method = '''        private static void ValidateAkariStyleAutomationPolicies()\n        {\n            var lobbyRead = new FakeReadApi();\n            lobbyRead.Set(LeagueMatchmakingAutomationController.LobbyPath,\n                LobbyJson(420, true, true, true, new[] { "self", "ally" }, false));\n            var lobbyWrite = new FakeWriteApi();\n            var lobbyClock = new FakeClock();\n            using (var controller = new LeagueMatchmakingAutomationController(lobbyRead, lobbyWrite, lobbyClock))\n            {\n                controller.Configure(true, false, 3, 1500, 0);\n                controller.Observe(new LeagueDashboardPhaseState { Connected = true, Phase = "Lobby" });\n                Thread.Sleep(40);\n                Require(lobbyWrite.Calls.Count(call => call.Path == LeagueMatchmakingWriteApiClient.SearchPath) == 0,\n                    "Minimum party size did not block auto matchmaking.");\n                Require(lobbyClock.Delays.Any(value => value == TimeSpan.FromMilliseconds(1500)),\n                    "Configured matchmaking start delay was not observed exactly at episode start.");\n\n                lobbyRead.Set(LeagueMatchmakingAutomationController.LobbyPath,\n                    LobbyJson(420, true, true, true, new[] { "self", "ally", "ally2" }, false));\n                Require(lobbyWrite.WaitForCall(TimeSpan.FromSeconds(1)),\n                    "Reaching the configured minimum party size did not allow matchmaking.");\n            }\n\n            var readyRead = new FakeReadApi();\n            readyRead.Set(LeagueMatchmakingAutomationController.SearchStatePath,\n                "{\\\"readyCheck\\\":{\\\"state\\\":\\\"InProgress\\\",\\\"playerResponse\\\":\\\"None\\\"}}");\n            var readyWrite = new FakeWriteApi();\n            var readyClock = new FakeClock();\n            using (var controller = new LeagueMatchmakingAutomationController(readyRead, readyWrite, readyClock))\n            {\n                controller.Configure(false, true, 1, 0, 750);\n                controller.Observe(new LeagueDashboardPhaseState { Connected = true, Phase = "ReadyCheck" });\n                Require(readyWrite.WaitForCall(TimeSpan.FromSeconds(1)),\n                    "Configured delayed ReadyCheck did not eventually accept.");\n                Require(readyClock.Delays.Any(value => value == TimeSpan.FromMilliseconds(750)),\n                    "Configured auto-accept delay was not applied before the first accept attempt.");\n            }\n        }\n\n'''
