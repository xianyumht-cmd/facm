name: Inspect Cherry Augment Schema

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current CommunityDragon augment schema
        shell: python
        run: |
          import collections, json, urllib.request
          url = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/cherry-augments.json'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 FACM-schema-probe/1.0',
              'Accept': 'application/json,text/plain,*/*'
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              rows = json.load(r)
          print('row_count=', len(rows))
          print('first_keys=', sorted(rows[0].keys()) if rows else [])
          counts = collections.Counter(str(row.get('rarity')) for row in rows)
          print('rarity_counts=', json.dumps(dict(sorted(counts.items())), ensure_ascii=False, sort_keys=True))
          for rarity in sorted(counts):
              samples = []
              for row in rows:
                  if str(row.get('rarity')) != rarity:
                      continue
                  samples.append({
                      'id': row.get('id'),
                      'rarity': row.get('rarity'),
                      'nameTRA': row.get('nameTRA'),
                      'augmentNameId': row.get('augmentNameId'),
                      'icon': row.get('augmentSmallIconPath')
                  })
                  if len(samples) >= 3:
                      break
              print('rarity_samples', rarity, json.dumps(samples, ensure_ascii=False, sort_keys=True))
