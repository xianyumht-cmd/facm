name: GGman Update Bridge Hotfix

on:
  push:
    branches:
      - hotfix/ggman-update-bridge-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ggman-update-bridge-20260917
          fetch-depth: 0

      - name: Patch client validator and online manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $content = Get-Content -LiteralPath $Path -Raw -Encoding utf8
            if (-not $content.Contains($Old)) {
              throw "Expected text not found in $Path`n--- expected ---`n$Old"
            }
            Set-Content -LiteralPath $Path -Value ($content.Replace($Old, $New)) -Encoding utf8
          }

          $online = 'src/FACM/Online/OnlineService.cs'
          $oldValidator = '!IsApprovedReleaseUrl(download, parsedVersion, "FACM.exe"))'
          $newValidator = "!(IsApprovedReleaseUrl(download, parsedVersion, `"FACM.exe`") ||`r`n                  IsApprovedReleaseUrl(download, parsedVersion, `"GGman.exe`")))"
          Replace-Exact $online $oldValidator $newValidator
          Replace-Exact $online `
            'client.DefaultRequestHeaders.UserAgent.ParseAdd("FACM-Windows/3.5");' `
            'client.DefaultRequestHeaders.UserAgent.ParseAdd("GGman-Windows/3.5");'

          $manifestPath = 'online/version.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ([string]$manifest.version -ne '3.5.40') {
            throw "Expected online version 3.5.40, got $($manifest.version)"
          }
          if ([string]$manifest.download_url -notlike '*/v3.5.40/GGman.exe') {
            throw "Unexpected current download_url: $($manifest.download_url)"
          }
          $manifest.download_url = 'https://github.com/xianyumht-cmd/facm/releases/download/v3.5.40/FACM.exe'
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8

          $patched = Get-Content -LiteralPath $online -Raw -Encoding utf8
          if ($patched -notmatch 'IsApprovedReleaseUrl\(download, parsedVersion, "FACM\.exe"\)[\s\S]*IsApprovedReleaseUrl\(download, parsedVersion, "GGman\.exe"\)') {
            throw 'Dual-name manifest validation was not applied.'
          }

      - name: Add FACM.exe compatibility alias to v3.5.40
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ggman-update-bridge'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          gh release download v3.5.40 --repo $env:GITHUB_REPOSITORY --pattern 'GGman.exe' --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download GGman.exe from v3.5.40.' }
          $ggman = Join-Path $root 'GGman.exe'
          $facm = Join-Path $root 'FACM.exe'
          Copy-Item $ggman $facm -Force
          $expectedHash = (Get-FileHash $ggman -Algorithm SHA256).Hash.ToUpperInvariant()

          gh release upload v3.5.40 $facm --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload FACM.exe compatibility alias.' }

          $verify = Join-Path $root 'verify'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download v3.5.40 --repo $env:GITHUB_REPOSITORY --pattern 'FACM.exe' --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download published FACM.exe compatibility alias.' }
          $actualHash = (Get-FileHash (Join-Path $verify 'FACM.exe') -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "FACM.exe alias hash mismatch: expected $expectedHash, got $actualHash"
          }
          Write-Host "Compatibility alias verified: SHA256=$actualHash"

      - name: Commit source and manifest bridge
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FACM/Online/OnlineService.cs online/version.json
          git commit -m "hotfix: restore legacy FACM update compatibility"
          git push origin HEAD:hotfix/ggman-update-bridge-20260917
