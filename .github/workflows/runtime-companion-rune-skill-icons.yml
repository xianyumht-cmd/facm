name: Runtime Companion rune skill icons

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-companion-20260910
          fetch-depth: 0
      - name: Apply grouped rune and skill token pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorModels.cs',
              '''            Perks = new Dictionary<int, string>();\n            ItemIcons = new Dictionary<int, string>();\n            SpellIcons = new Dictionary<int, string>();\n            ChampionIcons = new Dictionary<int, string>();\n''',
              '''            Perks = new Dictionary<int, string>();\n            ItemIcons = new Dictionary<int, string>();\n            SpellIcons = new Dictionary<int, string>();\n            PerkIcons = new Dictionary<int, string>();\n            ChampionIcons = new Dictionary<int, string>();\n''',
              'initialize perk icons')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorModels.cs',
              '''        public Dictionary<int, string> ItemIcons { get; private set; }\n        public Dictionary<int, string> SpellIcons { get; private set; }\n        public Dictionary<int, string> ChampionIcons { get; private set; }\n''',
              '''        public Dictionary<int, string> ItemIcons { get; private set; }\n        public Dictionary<int, string> SpellIcons { get; private set; }\n        public Dictionary<int, string> PerkIcons { get; private set; }\n        public Dictionary<int, string> ChampionIcons { get; private set; }\n''',
              'expose perk icons')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorDataService.cs',
              '''            AddRuneRows(output, ReadValue(data, "runes"), ReadValue(data, "rune_pages"), catalog == null ? null : catalog.Perks, AlternativeRowLimit);\n''',
              '''            AddRuneRows(output, ReadValue(data, "runes"), ReadValue(data, "rune_pages"),\n                catalog == null ? null : catalog.Perks, catalog == null ? null : catalog.PerkIcons, AlternativeRowLimit);\n''',
              'pass perk icons into rune parser')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorDataService.cs',
              '''            ParseIdNameArray(spellsBytes, catalog.Spells, catalog.SpellIcons);\n            ParseIdNameArray(perksBytes, catalog.Perks);\n''',
              '''            ParseIdNameArray(spellsBytes, catalog.Spells, catalog.SpellIcons);\n            ParseIdNameArray(perksBytes, catalog.Perks, catalog.PerkIcons);\n''',
              'parse perk icon paths')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorDataService.cs',
              '''        private void AddRuneRows(\n            LeagueBuildRecommendation output,\n            object runesValue,\n            object runePagesValue,\n            IDictionary<int, string> names,\n            int limit)\n''',
              '''        private void AddRuneRows(\n            LeagueBuildRecommendation output,\n            object runesValue,\n            object runePagesValue,\n            IDictionary<int, string> names,\n            IDictionary<int, string> icons,\n            int limit)\n''',
              'extend rune parser signature')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorDataService.cs',
              '''                    output.Rows.Add(new LeagueBuildAdvisorRow\n                    {\n                        Category = "runes",\n                        Recommendation = JoinNames(ids, names),\n                        Evidence = BuildEvidence(build, page)\n                    });\n''',
              '''                    output.Rows.Add(new LeagueBuildAdvisorRow\n                    {\n                        Category = "runes",\n                        Recommendation = JoinNames(ids, names),\n                        Evidence = BuildEvidence(build, page),\n                        IconReferences = BuildIconReferences(ids, icons)\n                    });\n''',
              'project grouped rune icon references')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorDataService.cs',
              '''            Copy(source.ItemIcons, clone.ItemIcons);\n            Copy(source.SpellIcons, clone.SpellIcons);\n            Copy(source.ChampionIcons, clone.ChampionIcons);\n''',
              '''            Copy(source.ItemIcons, clone.ItemIcons);\n            Copy(source.SpellIcons, clone.SpellIcons);\n            Copy(source.PerkIcons, clone.PerkIcons);\n            Copy(source.ChampionIcons, clone.ChampionIcons);\n''',
              'clone perk icon catalog')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private bool TryRenderBuildPrimaryIcons(RecommendationSection section, LeagueBuildAdvisorRow row)\n        {\n            if (section == null || row == null || !SupportsBuildPrimaryIcons(section.Category) ||\n                row.IconReferences == null || row.IconReferences.Count == 0) return false;\n            var labels = (row.Recommendation ?? string.Empty).Split(new[] { " · " }, StringSplitOptions.None);\n            var count = Math.Min(BuildPrimaryIconLimit(section.Category), row.IconReferences.Count);\n            for (var index = 0; index < count; index++)\n            {\n                var label = index < labels.Length ? labels[index] : row.Recommendation;\n                section.Visuals.Controls.Add(CreateGuideToken(label, row.IconReferences[index], _guideSectionRenderGeneration));\n            }\n            section.Visuals.Visible = section.Visuals.Controls.Count > 0;\n            if (section.Visuals.Visible) _toolTip.SetToolTip(section.Visuals, row.Recommendation ?? string.Empty);\n            return section.Visuals.Visible;\n        }\n''',
              '''        private bool TryRenderBuildPrimaryIcons(RecommendationSection section, LeagueBuildAdvisorRow row)\n        {\n            if (section == null || row == null || !SupportsBuildPrimaryIcons(section.Category)) return false;\n\n            if (string.Equals(section.Category, "skills", StringComparison.OrdinalIgnoreCase))\n            {\n                var skills = (row.Recommendation ?? string.Empty)\n                    .Split(new[] { '>', '→' }, StringSplitOptions.RemoveEmptyEntries)\n                    .Select(value => value.Trim())\n                    .Where(value => !string.IsNullOrWhiteSpace(value))\n                    .Take(4)\n                    .ToArray();\n                foreach (var skill in skills)\n                    section.Visuals.Controls.Add(CreateGuideToken(skill, null, _guideSectionRenderGeneration));\n                section.Visuals.Visible = section.Visuals.Controls.Count > 0;\n                if (section.Visuals.Visible) _toolTip.SetToolTip(section.Visuals, row.Recommendation ?? string.Empty);\n                return section.Visuals.Visible;\n            }\n\n            if (row.IconReferences == null || row.IconReferences.Count == 0) return false;\n            var labels = (row.Recommendation ?? string.Empty).Split(new[] { " · " }, StringSplitOptions.None);\n            var count = Math.Min(BuildPrimaryIconLimit(section.Category), row.IconReferences.Count);\n            var compactRunes = string.Equals(section.Category, "runes", StringComparison.OrdinalIgnoreCase);\n            var tokenSize = compactRunes ? 24 : GuideTokenSize;\n            var tokenGap = compactRunes ? 3 : GuideTokenGap;\n            for (var index = 0; index < count; index++)\n            {\n                var label = index < labels.Length ? labels[index] : row.Recommendation;\n                section.Visuals.Controls.Add(CreateGuideToken(label, row.IconReferences[index], _guideSectionRenderGeneration, tokenSize, tokenGap));\n            }\n            section.Visuals.Visible = section.Visuals.Controls.Count > 0;\n            if (section.Visuals.Visible) _toolTip.SetToolTip(section.Visuals, row.Recommendation ?? string.Empty);\n            return section.Visuals.Visible;\n        }\n''',
              'render grouped rune icons and skill tokens')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            return string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase) ||\n                   string.Equals(category, "starter-items", StringComparison.OrdinalIgnoreCase) ||\n''',
              '''            return string.Equals(category, "runes", StringComparison.OrdinalIgnoreCase) ||\n                   string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase) ||\n                   string.Equals(category, "skills", StringComparison.OrdinalIgnoreCase) ||\n                   string.Equals(category, "starter-items", StringComparison.OrdinalIgnoreCase) ||\n''',
              'allow rune and skill visual rows')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private static int BuildPrimaryIconLimit(string category)\n        {\n            if (string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase)) return 2;\n''',
              '''        private static int BuildPrimaryIconLimit(string category)\n        {\n            if (string.Equals(category, "runes", StringComparison.OrdinalIgnoreCase)) return 6;\n            if (string.Equals(category, "skills", StringComparison.OrdinalIgnoreCase)) return 4;\n            if (string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase)) return 2;\n''',
              'set compact rune and skill limits')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private Control CreateGuideToken(string text, string iconReference, int generation)\n        {\n            var host = new Panel\n            {\n                Size = new Size(GuideTokenSize, GuideTokenSize),\n                Margin = new Padding(0, 2, GuideTokenGap, 0),\n''',
              '''        private Control CreateGuideToken(string text, string iconReference, int generation, int tokenSize = GuideTokenSize, int tokenGap = GuideTokenGap)\n        {\n            tokenSize = Math.Max(18, tokenSize);\n            tokenGap = Math.Max(0, tokenGap);\n            var host = new Panel\n            {\n                Size = new Size(tokenSize, tokenSize),\n                Margin = new Padding(0, 2, tokenGap, 0),\n''',
              'support compact grouped rune token geometry')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            if (GuideTokenSize * 5 + GuideTokenGap * 4 > 214)\n                throw new InvalidOperationException("Runtime Companion guide icon density no longer fits the compact recommendation row.");\n''',
              '''            if (GuideTokenSize * 5 + GuideTokenGap * 4 > 214)\n                throw new InvalidOperationException("Runtime Companion guide icon density no longer fits the compact recommendation row.");\n            if ((24 * 6) + (3 * 5) > SectionActionContentWidth)\n                throw new InvalidOperationException("Runtime Companion grouped rune icons no longer fit beside the Apply action.");\n            if (BuildPrimaryIconLimit("runes") != 6 || BuildPrimaryIconLimit("skills") != 4)\n                throw new InvalidOperationException("Runtime Companion grouped rune/skill visual limits drifted.");\n''',
              'smoke compact rune geometry')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorSmokeTest.cs',
              '''                Require(runeRows.Count == 2 && runeRows[0].Recommendation.Contains("电刑") && runeRows[1].Recommendation.Contains("奥术彗星"),\n                    "Build Advisor did not preserve ordered rune alternatives.");\n''',
              '''                Require(runeRows.Count == 2 && runeRows[0].Recommendation.Contains("电刑") && runeRows[1].Recommendation.Contains("奥术彗星"),\n                    "Build Advisor did not preserve ordered rune alternatives.");\n                Require(runeRows[0].IconReferences.Count == 3 && runeRows[0].IconReferences.All(value => value != null && value.StartsWith("lcu:/lol-game-data/assets/", StringComparison.OrdinalIgnoreCase)),\n                    "Build Advisor did not preserve grouped rune icon references for Runtime Companion.");\n''',
              'assert rune icon projection')

          replace_once(
              'src/FACM/League/LeagueBuildAdvisorSmokeTest.cs',
              '''                if (path == LeagueBuildAdvisorDataService.PerksPath)\n                    return Bytes("[{\\\"id\\\":8112,\\\"name\\\":\\\"电刑\\\"},{\\\"id\\\":8143,\\\"name\\\":\\\"突然冲击\\\"},{\\\"id\\\":8347,\\\"name\\\":\\\"饼干配送\\\"},{\\\"id\\\":8214,\\\"name\\\":\\\"奥术彗星\\\"},{\\\"id\\\":8226,\\\"name\\\":\\\"法力流系带\\\"}]");\n''',
              '''                if (path == LeagueBuildAdvisorDataService.PerksPath)\n                    return Bytes("[{\\\"id\\\":8112,\\\"name\\\":\\\"电刑\\\",\\\"iconPath\\\":\\\"ASSETS/Perks/Styles/Domination/Electrocute/Electrocute.png\\\"},{\\\"id\\\":8143,\\\"name\\\":\\\"突然冲击\\\",\\\"iconPath\\\":\\\"ASSETS/Perks/Styles/Domination/SuddenImpact/SuddenImpact.png\\\"},{\\\"id\\\":8347,\\\"name\\\":\\\"饼干配送\\\",\\\"iconPath\\\":\\\"ASSETS/Perks/Styles/Inspiration/BiscuitDelivery/BiscuitDelivery.png\\\"},{\\\"id\\\":8214,\\\"name\\\":\\\"奥术彗星\\\",\\\"iconPath\\\":\\\"ASSETS/Perks/Styles/Sorcery/ArcaneComet/ArcaneComet.png\\\"},{\\\"id\\\":8226,\\\"name\\\":\\\"法力流系带\\\",\\\"iconPath\\\":\\\"ASSETS/Perks/Styles/Sorcery/ManaflowBand/ManaflowBand.png\\\"}]");\n''',
              'add perk icon fixture')

          p = Path('docs/RUNTIME-COMPANION-DESIGN.md')
          text = p.read_text(encoding='utf-8')
          anchor = 'A non-null Build Advisor snapshot is not equivalent to a usable recommendation.'
          note = 'Grouped ordinary-mode rune schemes should remain grouped while becoming icon-first when the LCU perk catalog supplies `iconPath`; six compact rune icons must fit beside the existing Apply action. Normal skill priority may use compact Q/W/E/R tokens because those letters are already the source recommendation, not invented metadata.\n'
          if note not in text:
              if anchor not in text:
                  raise SystemExit('rune design anchor missing')
              text = text.replace(anchor, note + anchor, 1)
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/runtime-companion-rune-skill-icons.yml').unlink()
          PY
      - name: Commit grouped rune and skill visual pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish grouped rune and skill visuals in Runtime Companion"
          git push origin HEAD:feat/runtime-companion-20260910
