name: GGman Cloud D1 Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cloud-d1-lab/**'
      - 'scripts/cloudbase-backup/**'
      - '.github/workflows/cloud-d1-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-lab:
    name: Verify offline auth and D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/cloud-d1-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax and offline tests
        run: npm run check
      - name: Verify D1 migration using SQLite constraints
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          migration = pathlib.Path('migrations/0001_init.sql').read_text()
          db = sqlite3.connect(':memory:')
          db.executescript(migration)
          db.execute("insert into sync_documents values (?,?,?,?,?,?)",
                     ("provider-uid-alice","app_settings",1,"{}","0"*64,"2026-10-22T00:00:00Z"))
          assert db.execute("select count(*) from sync_documents").fetchone()[0] == 1
          try:
              db.execute("insert into sync_documents values (?,?,?,?,?,?)",
                         ("provider-uid-alice","app_settings",1,"{}","0"*64,"2026-10-22T00:00:00Z"))
              raise AssertionError("uniqueness enforcement missing")
          except sqlite3.IntegrityError:
              pass
          print('Offline SQLite schema and composite ownership-key uniqueness: PASS')
          PY
  backup-script-static:
    name: Windows PowerShell 5.1 backup script syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse backup utility without contacting CloudBase
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/cloudbase-backup/Backup-CloudBase.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'CloudBase backup script failed Windows PowerShell 5.1 syntax validation.'
          }
          $launch = Get-Content 'scripts/cloudbase-backup/Backup-CloudBase.cmd' -Raw
          if ($launch -notmatch '-File "%~dp0Backup-CloudBase.ps1"') {
            throw 'Backup launcher must derive its own path, not pass a quoted directory.'
          }
          Write-Host 'Windows PowerShell 5.1 syntax: PASS; no database connection attempted.'
