name: Runtime Companion One-Shot Closeout Patch

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile Runtime Companion source and canonical docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit('Patch anchor missing: ' + label)
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit('Start marker missing: ' + label)
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit('End marker missing: ' + label)
              return text[:a] + replacement + text[b:]

          # UI-text contract: the Chinese fixture is deliberately non-user-facing smoke data.
          form_path = 'src/FACM/League/LeagueRuntimeCompanionForm.cs'
          form = read(form_path)
          form = replace_once(
              form,
              '            mayhem.BaseBalanceSummary = "基础 ARAM（完整）：造成伤害 +5%";\n',
              '            mayhem.BaseBalanceSummary = "基础 ARAM（完整）：造成伤害 +5%"; // ui-text-contract: allow\n',
              'ARAM smoke allow marker')
          write(form_path, form)

          architecture_path = 'docs/ARCHITECTURE.md'
          architecture = read(architecture_path)
          architecture_section = '''### Runtime Companion (task PR #283)\n\nThe Runtime Companion is a narrow transient **consumer/orchestration surface**, not another League runtime.\n\n- `LeagueHubModule` remains the automatic Champion Select episode owner. It decides when one companion instance may exist and when leaving Champion Select closes it.\n- `LeagueLiveModule` constructs the companion from the already-initialized Live/Bench services; it does not create another League session.\n- `LeagueRuntimeCompanionController` projects the existing Bench, Build Advisor and Mayhem owners into defensively copied presentation snapshots. Generation/cancellation rules reject stale champion/build/guide work.\n- build recommendation reads reuse `LeagueBuildAdvisorModule.RuntimeCompanionReadService` and the module-owned shared `CachingOpggBuildApi`. The same OP.GG payload may project up to three source-ordered alternatives for supported categories; expansion is presentation-only and does not fan out another request.\n- Bench swaps reuse `LeagueBenchQuickPickService`. Explicit rune/summoner-spell actions reuse `LeagueBuildApplyService`; the first source row remains the apply default and the existing owner retains phase/champion/queue revalidation plus settled postcondition verification.\n- core-build import reuses `LeagueItemSetService`; preparation is read-only, the user confirms explicitly, live context is revalidated before the first filesystem write, only FACM-owned recommendation files are changed, and the committed JSON is verified. Categories without a deliberately wired safe owner remain display-only.\n- base ARAM balance is supplementary presentation data. `RiotGameDataService.EnrichAsync` is the single automatic-guide enrichment owner: it starts `OpggAramBaseBalanceService.EnrichAsync` once in parallel with visual metadata, using that service's bounded ten-minute complete-result cache. `MayhemAutomaticGuideService` must not pre-call the balance service and then call Riot enrichment again.\n- the companion renders base ARAM balance only when a real `BaseBalanceSummary` exists. `syncing`/`unavailable` states remain explicit warning states; missing data is omitted rather than rendered as a fake `0` or `no modifier` result.\n- the transient window has no taskbar entry and keeps `ShowWithoutActivation`; pin/collapse/drag are presentation concerns only.\n\nWindow preferences are also shared ownership rather than Form-local state. `LeagueBuildAdvisorModule.RuntimeCompanionSettings` exposes the already-loaded `SettingsModule.Settings` object; `LeagueRuntimeCompanionWindowState` persists position, pin and collapse values through `AppSettings.Save()` and the existing last-known-good recovery file. It never opens a private settings file.\n\nFACM already declares PerMonitorV2 awareness in `app.manifest`. Runtime Companion placement therefore occurs from the Form's `Shown` path, after WinForms has established DPI-scaled physical geometry. Saved coordinates may be negative for displays left of the primary monitor; restore and user drag are clamped to the chosen monitor's current working area. Expanded height is capped against physical working-area height after DPI scaling so 125/150/200% configurations do not reuse a 96-DPI pre-show size assumption.\n\n'''
          architecture = replace_between(
              architecture,
              '### Runtime Companion (task PR #283)\n',
              '### Champion Select dodge evidence\n',
              architecture_section,
              'ARCHITECTURE Runtime Companion section')
          write(architecture_path, architecture)

          decisions_path = 'docs/DECISIONS.md'
          decisions = read(decisions_path)
          decisions = replace_once(
              decisions,
              '- base ARAM balance enrichment reuses the existing bounded ten-minute cache service and is attached to the already-running automatic guide path; it must not create a periodic balance poller.\n',
              '- base ARAM balance enrichment reuses the existing bounded ten-minute cache service. `RiotGameDataService.EnrichAsync` owns the single automatic-guide call and starts it in parallel with visual metadata; `MayhemAutomaticGuideService` must not call the same service first and then enter Riot enrichment. Available/fail-closed balance text is projected into a dedicated companion section without a periodic balance poller.\n',
              'D-017 base ARAM ownership')
          write(decisions_path, decisions)

          pitfalls_path = 'docs/PITFALLS.md'
          pitfalls = read(pitfalls_path)
          pitfall_anchor = '''## Preserve the fast Mayhem path\n\nThe current cache/network/service path is intentionally retained. UI fixes should not trigger a rewrite or extra normal-path network requests unless a concrete functional defect requires it.\n\n'''
          pitfall_new = pitfall_anchor + '''## Do not enrich the same ARAM balance twice\n\n`RiotGameDataService.EnrichAsync` already starts the bounded `OpggAramBaseBalanceService` task in parallel with visual metadata. Calling the same balance service in `MayhemAutomaticGuideService` immediately before Riot enrichment looks harmless when a complete result hits the ten-minute cache, but an unavailable result can cause a second external attempt and lengthen the visible failure path.\n\nKeep one automatic-guide enrichment owner. The Runtime Companion should render the resulting `BaseBalanceSummary`; it must not create another balance fetch loop merely because the data has a new visible section.\n\n'''
          if '## Do not enrich the same ARAM balance twice\n' not in pitfalls:
              pitfalls = replace_once(pitfalls, pitfall_anchor, pitfall_new, 'PITFALLS ARAM ownership')
          write(pitfalls_path, pitfalls)

          project_path = 'docs/PROJECT_STATE.md'
          project = read(project_path)
          project_section = '''## Runtime Companion modernization（PR #283，未合并/未发布）\n\n- 唯一任务分支：`feat/runtime-companion-20260910`；唯一任务 PR：#283，保持 draft，正式版仍是 3.5.38。\n- 旧 660px 横向 ChampSelect assistant 的正常创建入口已切换为约 388px 逻辑宽度的纵向 Runtime Companion；旧实现暂时保留为未使用兼容代码，待真实 Tencent 客户端验收后再决定是否删除。\n- `LeagueHubModule` 继续持有 Champion Select episode/popup 生命周期；Runtime Companion 不新增 Gameflow owner、第二 League session 或 page-local LCU write stack。\n- `LeagueRuntimeCompanionController` 将现有 Bench、Build Advisor、Mayhem 数据投影为 snapshot，并用 generation/cancellation 阻止换英雄后的旧异步结果覆盖新上下文。\n- Build Advisor 从同一份已获取的 OP.GG payload 中为符文、召唤师技能、出门装、鞋子、核心装和技能顺序保留最多 3 套源顺序方案；第 1 套仍是既有默认，额外方案仅用于“更多”展开，不增加网络请求。英雄头部同时投影 mode/position/patch 与源数据真实存在的 Tier、排名、胜率、登场率、禁用率；缺失统计保持未知，不伪造为 `0%`。\n- Rune / Summoner Spell 就地 Apply 复用 `LeagueBuildApplyService`，继续执行用户确认、phase/champion/queue 重验与 settled postcondition。Core 的“导入装备”复用 `LeagueItemSetService`：准备阶段只读，确认后再次验证选人上下文，只维护 FACM 自有推荐装备文件，并验证最终 JSON；其他没有安全 owner 的类别继续只读。\n- ARAM 基础平衡复用现有 `OpggAramBaseBalanceService` 的 bounded/10 分钟完整结果缓存，并由 `RiotGameDataService.EnrichAsync` 作为 automatic-guide 的唯一调用 owner 与视觉元数据并行获取；已移除 `MayhemAutomaticGuideService` 中的重复预调用，避免失败态触发第二次外部请求。Runtime Companion 已新增独立“大乱斗基础平衡”行：有真实 `BaseBalanceSummary` 才显示，`syncing`/`unavailable` 保持警告语义，缺失时直接省略。\n- Bench 快速换英雄继续走 `LeagueBenchQuickPickService`；Mayhem 海克斯强化继续只在真实数据可用时显示。普通空状态不生成装饰性 N/A 卡片。\n- Runtime Companion 的位置、置顶、收起状态通过共享 `AppSettings` 与现有 last-known-good recovery 持久化；不创建 Form 私有配置文件，也不重新加载第二份 settings。\n- `app.manifest` 已有 PerMonitorV2。Companion 的恢复/默认定位延迟到 `Shown` 后按物理 DPI 尺寸处理，允许左侧屏幕负坐标，并在显示器拓扑变化时 clamp 到当前 working area。\n- deterministic smoke 覆盖紧凑宽度/高度、100%/150% DPI 高度策略、负坐标多屏 clamp、settings round-trip/LKG recovery、snapshot clone、最多 3 套方案投影、缺失胜率不伪造、rune/spell scoped apply、item-set owner 边界，以及 ARAM balance 有值显示/无值省略。\n- ARAM 可视化补丁之前的完整实现 head `df835a040f90caa242d1069bc9d4afbd3d680ff4` 已通过 UI Text Contract #831、Mayhem Source Probe #491 与 Windows Build #1723（含 lightweight FACM.exe verification 和 optional PetHost self-test）。当前收口 head 必须重新通过同样 Gate；旧成功记录不能替代最新代码验证。\n- 剩余外部 Gate 是真实 Tencent 客户端验收：普通 Ranked 的自动出现/不抢焦点/英雄切换；Rune/召唤师技能 Apply；装备导入；ARAM/Mayhem 基础平衡/强化/Bench；关闭仅 dismiss 当前 episode；拖动/置顶/收起跨 episode 恢复，以及有条件时的多屏/125%/150%/200% DPI。未通过这些实机 Gate 前不 merge、不 bump version、不改在线 manifest、不生产发布。\n\n'''
          project = replace_between(
              project,
              '## Runtime Companion modernization（PR #283，未合并/未发布）\n',
              '历史主线：',
              project_section,
              'PROJECT_STATE Runtime Companion section')
          write(project_path, project)
          PY

      - name: Commit closeout patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No closeout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FACM/League/LeagueRuntimeCompanionForm.cs docs/ARCHITECTURE.md docs/DECISIONS.md docs/PITFALLS.md docs/PROJECT_STATE.md
          git commit -m "Reconcile Runtime Companion ARAM closeout state"
          git push origin HEAD:feat/runtime-companion-20260910
