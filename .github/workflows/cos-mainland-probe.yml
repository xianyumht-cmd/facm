name: GGman COS Mainland Probe
on:
  pull_request:
    paths:
      - '.github/workflows/cos-mainland-probe.yml'
      - 'online/control.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/Test-MainlandPublicRoutes.py --control-only
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-mainland-results
          path: mainland-route-results/
          retention-days: 7
