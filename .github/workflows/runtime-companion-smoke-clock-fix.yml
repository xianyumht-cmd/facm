name: Runtime Companion Smoke Clock Fix

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix fake clock yielding without changing production delays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/FACM/League/LeagueMatchmakingAutomationSmokeTest.cs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('public readonly List<TimeSpan> Delays = new List<TimeSpan>();',
               'public readonly System.Collections.Concurrent.ConcurrentQueue<TimeSpan> Delays = new System.Collections.Concurrent.ConcurrentQueue<TimeSpan>();'),
              ('lock (Delays) Delays.Add(delay);', 'Delays.Enqueue(delay);'),
              ('return Task.CompletedTask;', 'return Task.Delay(1, cancellationToken);'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('unexpected smoke anchor count for: ' + old)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit smoke fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/runtime-companion-smoke-clock-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FACM/League/LeagueMatchmakingAutomationSmokeTest.cs .github/workflows/runtime-companion-smoke-clock-fix.yml
          git commit -m "Fix matchmaking smoke fake clock busy loop"
          git push origin HEAD:feat/runtime-companion-20260910
