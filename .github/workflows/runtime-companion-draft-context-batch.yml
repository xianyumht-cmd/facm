              '''            if (LeagueRuntimeCompanionText.DefaultsForSmokeTest().Count < 29)\n                throw new InvalidOperationException("Runtime Companion localized P0 copy is incomplete.");\n            if (ResolveDraftChampionId(new LeagueLivePlayerRow { ChampionPickIntent = 58 }, true) != 58 ||\n                ResolveDraftChampionId(new LeagueLivePlayerRow { ChampionPickIntent = 58 }, false) != 0)\n                throw new InvalidOperationException("Runtime Companion draft intent visibility policy regressed.");\n''',
              'extend form smoke')

          # 7) Durable docs: this batch intentionally postpones live testing until the remaining known items are complete.
          p = Path('docs/RUNTIME-COMPANION-DESIGN.md')
          text = p.read_text(encoding='utf-8')
          marker = '### Live readability acceptance\n'
          addition = '''### Draft-context projection\n\nThe existing lightweight ChampSelect session read also carries timer, ally/enemy draft rows and ban counts into the Runtime Companion snapshot. This must not add another ChampSelect GET, another Gameflow observer or automatic per-player match-history fan-out. The compact surface may show allied pick intent because it is already local-team context; enemy rows fail closed to actually revealed champion/account context. Team rows are icon-first, tooltip-assisted and scroll with the existing body rather than increasing the fixed header/context footprint.\n\n'''
          if addition not in text:
