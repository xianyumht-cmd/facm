name: Runtime Companion draft context batch

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-companion-20260910
          fetch-depth: 0
      - name: Apply batched draft-context projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # 1) Extend the already-read lightweight ChampSelect state instead of adding another LCU reader.
          replace_once(
              'src/FACM/League/LeagueLiveModels.cs',
              '''        public LeagueBenchQuickPickState()\n        {\n            ChampionIds = new List<int>();\n            SwapRoute = LeagueBenchSwapRoute.Legacy;\n        }\n\n        public bool SessionAvailable { get; set; }\n        public bool BenchEnabled { get; set; }\n        public int QueueId { get; set; }\n        public string GameMode { get; set; }\n        public int LocalPlayerCellId { get; set; }\n        public int LocalChampionId { get; set; }\n        public LeagueBenchSwapRoute SwapRoute { get; set; }\n        public List<int> ChampionIds { get; private set; }\n''',
              '''        public LeagueBenchQuickPickState()\n        {\n            ChampionIds = new List<int>();\n            AllyBans = new List<int>();\n            EnemyBans = new List<int>();\n            Players = new List<LeagueLivePlayerRow>();\n            SwapRoute = LeagueBenchSwapRoute.Legacy;\n        }\n\n        public bool SessionAvailable { get; set; }\n        public bool BenchEnabled { get; set; }\n        public int QueueId { get; set; }\n        public string GameMode { get; set; }\n        public int LocalPlayerCellId { get; set; }\n        public int LocalChampionId { get; set; }\n        public string TimerPhase { get; set; }\n        public int TimerMillisecondsLeft { get; set; }\n        public LeagueBenchSwapRoute SwapRoute { get; set; }\n        public List<int> ChampionIds { get; private set; }\n        public List<int> AllyBans { get; private set; }\n        public List<int> EnemyBans { get; private set; }\n        public List<LeagueLivePlayerRow> Players { get; private set; }\n''',
              'extend quick-pick state')

          replace_once(
              'src/FACM/League/LeagueLiveDataService.cs',
              '''                        if (teamBuilderState.QueueId <= 0 && state != null)\n                            teamBuilderState.QueueId = state.QueueId;\n                        if (string.IsNullOrWhiteSpace(teamBuilderState.GameMode) && state != null)\n                            teamBuilderState.GameMode = state.GameMode;\n                        teamBuilderState.SwapRoute = LeagueBenchSwapRoute.TeamBuilder;\n''',
              '''                        if (teamBuilderState.QueueId <= 0 && state != null)\n                            teamBuilderState.QueueId = state.QueueId;\n                        if (string.IsNullOrWhiteSpace(teamBuilderState.GameMode) && state != null)\n                            teamBuilderState.GameMode = state.GameMode;\n                        if (state != null)\n                        {\n                            if (string.IsNullOrWhiteSpace(teamBuilderState.TimerPhase))\n                                teamBuilderState.TimerPhase = state.TimerPhase;\n                            if (teamBuilderState.TimerMillisecondsLeft <= 0)\n                                teamBuilderState.TimerMillisecondsLeft = state.TimerMillisecondsLeft;\n                            if (teamBuilderState.AllyBans.Count == 0)\n                                foreach (var value in state.AllyBans) teamBuilderState.AllyBans.Add(value);\n                            if (teamBuilderState.EnemyBans.Count == 0)\n                                foreach (var value in state.EnemyBans) teamBuilderState.EnemyBans.Add(value);\n                            if (teamBuilderState.Players.Count == 0)\n                                foreach (var value in state.Players) teamBuilderState.Players.Add(value);\n                        }\n                        teamBuilderState.SwapRoute = LeagueBenchSwapRoute.TeamBuilder;\n''',
              'preserve generic draft context through team-builder fallback')

          replace_once(
              'src/FACM/League/LeagueLiveDataService.cs',
              '''            state.SwapRoute = ResolveBenchSwapRoute(data);\n            RememberBenchSwapRoute(state.SwapRoute);\n            AppendBenchChampionIds(state.ChampionIds, data);\n\n            foreach (var member in EnumerateDictionaries(ReadValue(data, "myTeam")))\n            {\n                if (ReadInt(member, "cellId") != state.LocalPlayerCellId) continue;\n                state.LocalChampionId = ReadInt(member, "championId");\n                break;\n            }\n            return state;\n''',
              '''            state.SwapRoute = ResolveBenchSwapRoute(data);\n            RememberBenchSwapRoute(state.SwapRoute);\n            AppendBenchChampionIds(state.ChampionIds, data);\n\n            var timer = ReadDictionary(data, "timer");\n            state.TimerPhase = ReadString(timer, "phase");\n            state.TimerMillisecondsLeft = ReadInt(timer, "adjustedTimeLeftInPhase");\n\n            var bans = ReadDictionary(data, "bans");\n            AppendInts(state.AllyBans, ReadValue(bans, "myTeamBans"));\n            AppendInts(state.EnemyBans, ReadValue(bans, "theirTeamBans"));\n\n            // Reuse the same parser as League Live so the compact quick state can project draft\n            // context without a second ChampSelect GET or a second Gameflow owner.\n            var projected = new LeagueLiveSnapshot { LocalPlayerCellId = state.LocalPlayerCellId };\n            AppendChampSelectTeam(projected, ReadValue(data, "myTeam"), "ally");\n            AppendChampSelectTeam(projected, ReadValue(data, "theirTeam"), "enemy");\n            foreach (var member in projected.Players) state.Players.Add(member);\n\n            foreach (var member in state.Players)\n            {\n                if (!member.IsLocalPlayer) continue;\n                state.LocalChampionId = member.ChampionId;\n                break;\n            }\n            return state;\n''',
              'project timer teams and bans from existing session payload')

          # 2) Carry the projected draft context through the Runtime Companion snapshot boundary.
          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionModels.cs',
              '''        public LeagueBenchSwapRoute SwapRoute { get; set; }\n        public IReadOnlyList<int> BenchChampionIds { get; set; } = Array.Empty<int>();\n\n        public bool BuildLoading { get; set; }\n''',
              '''        public LeagueBenchSwapRoute SwapRoute { get; set; }\n        public IReadOnlyList<int> BenchChampionIds { get; set; } = Array.Empty<int>();\n        public string TimerPhase { get; set; }\n        public int TimerMillisecondsLeft { get; set; }\n        public IReadOnlyList<int> AllyBans { get; set; } = Array.Empty<int>();\n        public IReadOnlyList<int> EnemyBans { get; set; } = Array.Empty<int>();\n        public IReadOnlyList<LeagueLivePlayerRow> Players { get; set; } = Array.Empty<LeagueLivePlayerRow>();\n\n        public bool BuildLoading { get; set; }\n''',
              'extend companion snapshot')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionModels.cs',
              '''                BenchChampionIds = BenchChampionIds == null\n                    ? Array.Empty<int>()\n                    : new List<int>(BenchChampionIds).AsReadOnly(),\n                BuildLoading = BuildLoading,\n''',
              '''                BenchChampionIds = BenchChampionIds == null\n                    ? Array.Empty<int>()\n                    : new List<int>(BenchChampionIds).AsReadOnly(),\n                TimerPhase = TimerPhase,\n                TimerMillisecondsLeft = TimerMillisecondsLeft,\n                AllyBans = AllyBans == null ? Array.Empty<int>() : new List<int>(AllyBans).AsReadOnly(),\n                EnemyBans = EnemyBans == null ? Array.Empty<int>() : new List<int>(EnemyBans).AsReadOnly(),\n                Players = ClonePlayers(Players),\n                BuildLoading = BuildLoading,\n''',
              'clone companion draft context')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionModels.cs',
              '''        internal static LeagueBuildAdvisorSnapshot CloneBuild(LeagueBuildAdvisorSnapshot source)\n''',
              '''        private static IReadOnlyList<LeagueLivePlayerRow> ClonePlayers(IReadOnlyList<LeagueLivePlayerRow> source)\n        {\n            if (source == null || source.Count == 0) return Array.Empty<LeagueLivePlayerRow>();\n            var rows = new List<LeagueLivePlayerRow>(source.Count);\n            foreach (var row in source)\n            {\n                if (row == null) continue;\n                rows.Add(new LeagueLivePlayerRow\n                {\n                    Side = row.Side,\n                    CellId = row.CellId,\n                    IsLocalPlayer = row.IsLocalPlayer,\n                    GameName = row.GameName,\n                    TagLine = row.TagLine,\n                    DisplayName = row.DisplayName,\n                    PuuId = row.PuuId,\n                    SummonerId = row.SummonerId,\n                    Position = row.Position,\n                    Role = row.Role,\n                    ChampionId = row.ChampionId,\n                    ChampionPickIntent = row.ChampionPickIntent,\n                    Spell1Id = row.Spell1Id,\n                    Spell2Id = row.Spell2Id\n                });\n            }\n            return rows.AsReadOnly();\n        }\n\n        internal static LeagueBuildAdvisorSnapshot CloneBuild(LeagueBuildAdvisorSnapshot source)\n''',
              'add defensive player cloning')

          # 3) Copy the lightweight state into the controller snapshot; no new request path is introduced.
          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionController.cs',
              '''                    _snapshot.SwapRoute = state == null ? LeagueBenchSwapRoute.Legacy : state.SwapRoute;\n                    _snapshot.BenchChampionIds = championIds.AsReadOnly();\n                    _snapshot.UpdatedAtUtc = DateTime.UtcNow;\n''',
              '''                    _snapshot.SwapRoute = state == null ? LeagueBenchSwapRoute.Legacy : state.SwapRoute;\n                    _snapshot.BenchChampionIds = championIds.AsReadOnly();\n                    _snapshot.TimerPhase = state == null ? null : state.TimerPhase;\n                    _snapshot.TimerMillisecondsLeft = state == null ? 0 : state.TimerMillisecondsLeft;\n                    _snapshot.AllyBans = CopyInts(state == null ? null : state.AllyBans);\n                    _snapshot.EnemyBans = CopyInts(state == null ? null : state.EnemyBans);\n                    _snapshot.Players = CopyPlayers(state == null ? null : state.Players);\n                    _snapshot.UpdatedAtUtc = DateTime.UtcNow;\n''',
              'project draft context in controller')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionController.cs',
              '''        private void MaybeStartBuildRequest(int championHint)\n''',
              '''        private static IReadOnlyList<int> CopyInts(IReadOnlyList<int> source)\n        {\n            return source == null || source.Count == 0\n                ? Array.Empty<int>()\n                : new List<int>(source).AsReadOnly();\n        }\n\n        private static IReadOnlyList<LeagueLivePlayerRow> CopyPlayers(IReadOnlyList<LeagueLivePlayerRow> source)\n        {\n            if (source == null || source.Count == 0) return Array.Empty<LeagueLivePlayerRow>();\n            var rows = new List<LeagueLivePlayerRow>(source.Count);\n            foreach (var row in source)\n            {\n                if (row == null) continue;\n                rows.Add(new LeagueLivePlayerRow\n                {\n                    Side = row.Side, CellId = row.CellId, IsLocalPlayer = row.IsLocalPlayer,\n                    GameName = row.GameName, TagLine = row.TagLine, DisplayName = row.DisplayName,\n                    PuuId = row.PuuId, SummonerId = row.SummonerId, Position = row.Position, Role = row.Role,\n                    ChampionId = row.ChampionId, ChampionPickIntent = row.ChampionPickIntent,\n                    Spell1Id = row.Spell1Id, Spell2Id = row.Spell2Id\n                });\n            }\n            return rows.AsReadOnly();\n        }\n\n        private void MaybeStartBuildRequest(int championHint)\n''',
              'add controller draft copy helpers')

          # 4) Localized compact labels for the new context rows.
          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionUiText.cs',
              '''        public const string ItemSetConfirmFormat = "LeagueRuntimeCompanionItemSetConfirmFormat";\n''',
              '''        public const string ItemSetConfirmFormat = "LeagueRuntimeCompanionItemSetConfirmFormat";\n        public const string AllyTeam = "LeagueRuntimeCompanionAllyTeam";\n        public const string EnemyTeam = "LeagueRuntimeCompanionEnemyTeam";\n        public const string DraftPickedShort = "LeagueRuntimeCompanionDraftPickedShort";\n        public const string DraftUnknownPosition = "LeagueRuntimeCompanionDraftUnknownPosition";\n''',
              'add draft ui keys')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionUiText.cs',
              '''            { LeagueRuntimeCompanionUiTextKeys.ItemSetConfirmFormat, "{0}\\n\\n将导入 {1} 件推荐装备到英雄联盟推荐装备目录。\\n仅写入 FACM 自有方案，是否继续？" }\n''',
              '''            { LeagueRuntimeCompanionUiTextKeys.ItemSetConfirmFormat, "{0}\\n\\n将导入 {1} 件推荐装备到英雄联盟推荐装备目录。\\n仅写入 FACM 自有方案，是否继续？" },\n            { LeagueRuntimeCompanionUiTextKeys.AllyTeam, "我方阵容" },\n            { LeagueRuntimeCompanionUiTextKeys.EnemyTeam, "对方阵容" },\n            { LeagueRuntimeCompanionUiTextKeys.DraftPickedShort, "已选" },\n            { LeagueRuntimeCompanionUiTextKeys.DraftUnknownPosition, "?" }\n''',
              'add draft ui defaults')

          # 5) Compact UI: timer in header + icon-first allied/enemy draft rows using the same champion icon cache.
          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private readonly Label _status;\n        private readonly Button _quitButton;\n''',
              '''        private readonly Label _status;\n        private readonly Label _timerLabel;\n        private readonly Button _quitButton;\n''',
              'add timer field')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private readonly RecommendationSection _counters;\n        private readonly Panel _aramBalanceSection;\n''',
              '''        private readonly RecommendationSection _counters;\n        private readonly RecommendationSection _allyTeam;\n        private readonly RecommendationSection _enemyTeam;\n        private readonly Panel _aramBalanceSection;\n''',
              'add draft section fields')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private string _benchRenderFingerprint;\n\n        private sealed class BenchTarget\n''',
              '''        private string _benchRenderFingerprint;\n        private string _draftTeamFingerprint;\n\n        private sealed class BenchTarget\n''',
              'add draft fingerprint')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            };\n            _status = new Label\n            {\n                Text = char.ConvertFromUtf32(0x25CF),\n''',
              '''            };\n            _timerLabel = new Label\n            {\n                Text = string.Empty,\n                Location = new Point(94, 0),\n                Size = new Size(60, HeaderHeight),\n                TextAlign = ContentAlignment.MiddleRight,\n                AutoEllipsis = true,\n                BackColor = Color.Transparent,\n                ForeColor = FacmDesignSystem.TextMuted,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 8F, FontStyle.Bold)\n            };\n            _status = new Label\n            {\n                Text = char.ConvertFromUtf32(0x25CF),\n''',
              'create timer label')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            _header.Controls.Add(_title);\n            _header.Controls.Add(_status);\n''',
              '''            _header.Controls.Add(_title);\n            _header.Controls.Add(_timerLabel);\n            _header.Controls.Add(_status);\n''',
              'attach timer label')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            _counters = CreateRecommendationSection(\n                "counters",\n                LeagueRecommendationText.Get(_ui, LeagueRecommendationUiTextKeys.Counters),\n                null);\n\n            _runes.Action.Click += async delegate { await ApplyLoadoutAsync(LeagueRuntimeCompanionApplyTarget.Runes, _runes); };\n''',
              '''            _counters = CreateRecommendationSection(\n                "counters",\n                LeagueRecommendationText.Get(_ui, LeagueRecommendationUiTextKeys.Counters),\n                null);\n            _allyTeam = CreateRecommendationSection(\n                "ally-team",\n                CompanionText(LeagueRuntimeCompanionUiTextKeys.AllyTeam),\n                null);\n            _enemyTeam = CreateRecommendationSection(\n                "enemy-team",\n                CompanionText(LeagueRuntimeCompanionUiTextKeys.EnemyTeam),\n                null);\n\n            _runes.Action.Click += async delegate { await ApplyLoadoutAsync(LeagueRuntimeCompanionApplyTarget.Runes, _runes); };\n''',
              'create draft team sections')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''            foreach (var section in RecommendationSections()) _sections.Controls.Add(section.Host);\n\n            _aramBalanceSection = new Panel\n''',
              '''            foreach (var section in RecommendationSections()) _sections.Controls.Add(section.Host);\n            _sections.Controls.Add(_allyTeam.Host);\n            _sections.Controls.Add(_enemyTeam.Host);\n\n            _aramBalanceSection = new Panel\n''',
              'append draft sections')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private void ApplySnapshot(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            if (snapshot == null || IsDisposed) return;\n\n            var hasContext = snapshot.HasVisibleChampSelectContext;\n''',
              '''        private void ApplySnapshot(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            if (snapshot == null || IsDisposed) return;\n\n            RenderChampSelectTimer(snapshot);\n            RenderDraftTeams(snapshot);\n            var hasContext = snapshot.HasVisibleChampSelectContext;\n''',
              'render projected draft context')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionForm.cs',
              '''        private void RenderBuild(LeagueBuildAdvisorSnapshot build, bool loading, string error)\n''',
              '''        private void RenderChampSelectTimer(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            if (snapshot == null || !snapshot.SessionAvailable || snapshot.TimerMillisecondsLeft <= 0)\n            {\n                _timerLabel.Text = string.Empty;\n                _toolTip.SetToolTip(_timerLabel, string.Empty);\n                return;\n            }\n            var seconds = Math.Max(0, (int)Math.Ceiling(snapshot.TimerMillisecondsLeft / 1000d));\n            _timerLabel.Text = seconds.ToString(CultureInfo.InvariantCulture) + "s";\n            _timerLabel.ForeColor = seconds <= 5 ? FacmDesignSystem.Warning : FacmDesignSystem.TextMuted;\n            _toolTip.SetToolTip(_timerLabel, FirstNonEmpty(snapshot.TimerPhase, _timerLabel.Text) + " · " + _timerLabel.Text);\n        }\n\n        private void RenderDraftTeams(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            if (snapshot == null || !snapshot.SessionAvailable)\n            {\n                _draftTeamFingerprint = null;\n                HideRecommendationSection(_allyTeam);\n                HideRecommendationSection(_enemyTeam);\n                return;\n            }\n\n            var fingerprint = BuildDraftFingerprint(snapshot);\n            if (string.Equals(_draftTeamFingerprint, fingerprint, StringComparison.Ordinal)) return;\n            _draftTeamFingerprint = fingerprint;\n            RenderDraftTeamSection(_allyTeam, snapshot.Players, "ally", snapshot.AllyBans == null ? 0 : snapshot.AllyBans.Count, true, fingerprint);\n            RenderDraftTeamSection(_enemyTeam, snapshot.Players, "enemy", snapshot.EnemyBans == null ? 0 : snapshot.EnemyBans.Count, false, fingerprint);\n            HideNativeBodyScrollBars();\n        }\n\n        private static string BuildDraftFingerprint(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            if (snapshot == null) return string.Empty;\n            var parts = new List<string>();\n            foreach (var row in snapshot.Players ?? Array.Empty<LeagueLivePlayerRow>())\n            {\n                if (row == null) continue;\n                parts.Add((row.Side ?? string.Empty) + ":" + row.CellId + ":" + row.ChampionId + ":" + row.ChampionPickIntent + ":" +\n                          (row.Position ?? string.Empty) + ":" + (row.AccountName ?? string.Empty));\n            }\n            parts.Add("ab:" + string.Join(",", snapshot.AllyBans ?? Array.Empty<int>()));\n            parts.Add("eb:" + string.Join(",", snapshot.EnemyBans ?? Array.Empty<int>()));\n            return string.Join("|", parts);\n        }\n\n        private void RenderDraftTeamSection(\n            RecommendationSection section,\n            IReadOnlyList<LeagueLivePlayerRow> players,\n            string side,\n            int banCount,\n            bool allowIntent,\n            string fingerprint)\n        {\n            if (section == null) return;\n            var rows = (players ?? Array.Empty<LeagueLivePlayerRow>())\n                .Where(row => row != null && string.Equals(row.Side, side, StringComparison.OrdinalIgnoreCase))\n                .Where(row => allowIntent || row.ChampionId > 0 || !string.IsNullOrWhiteSpace(row.AccountName))\n                .OrderBy(row => row.CellId)\n                .Take(5)\n                .ToList();\n            if (rows.Count == 0)\n            {\n                HideRecommendationSection(section);\n                return;\n            }\n\n            ClearSectionVisuals(section);\n            section.Value.Text = string.Empty;\n            section.Value.Visible = false;\n            section.Host.Visible = true;\n            section.More.Visible = false;\n            section.Alternatives.Visible = false;\n            section.Alternatives.Height = 0;\n            section.Host.Height = RecommendationBaseHeight;\n            section.Rule.Top = RecommendationBaseHeight - 1;\n            section.Rows = Array.Empty<LeagueBuildAdvisorRow>();\n            foreach (var row in rows)\n                section.Visuals.Controls.Add(CreateDraftChampionToken(row, allowIntent, fingerprint));\n            section.Visuals.Visible = section.Visuals.Controls.Count > 0;\n\n            var picked = rows.Count(row => ResolveDraftChampionId(row, allowIntent) > 0);\n            section.Evidence.ForeColor = FacmDesignSystem.TextMuted;\n            section.Evidence.Text = picked.ToString(CultureInfo.InvariantCulture) + "/5 " +\n                                    CompanionText(LeagueRuntimeCompanionUiTextKeys.DraftPickedShort) + " · " +\n                                    CompanionText(LeagueRuntimeCompanionUiTextKeys.BanShort) + " " +\n                                    Math.Max(0, banCount).ToString(CultureInfo.InvariantCulture);\n            _toolTip.SetToolTip(section.Evidence, section.Evidence.Text);\n        }\n\n        private Control CreateDraftChampionToken(LeagueLivePlayerRow row, bool allowIntent, string fingerprint)\n        {\n            var host = new Panel\n            {\n                Size = new Size(GuideTokenSize, GuideTokenSize),\n                Margin = new Padding(0, 2, GuideTokenGap, 0),\n                BackColor = FacmDesignSystem.SurfaceRaised\n            };\n            FacmDesignSystem.Round(host, Math.Min(4, FacmDesignSystem.ControlRadius));\n            var picture = new PictureBox\n            {\n                Dock = DockStyle.Fill,\n                SizeMode = PictureBoxSizeMode.Zoom,\n                BackColor = Color.Transparent\n            };\n            var fallback = new Label\n            {\n                Dock = DockStyle.Fill,\n                Text = ShortPosition(row == null ? null : row.Position),\n                TextAlign = ContentAlignment.MiddleCenter,\n                ForeColor = FacmDesignSystem.Text,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 7.5F, FontStyle.Bold)\n            };\n            host.Controls.Add(picture);\n            host.Controls.Add(fallback);\n            fallback.BringToFront();\n            var tooltip = BuildDraftPlayerTooltip(row);\n            _toolTip.SetToolTip(host, tooltip);\n            _toolTip.SetToolTip(picture, tooltip);\n            _toolTip.SetToolTip(fallback, tooltip);\n            var championId = ResolveDraftChampionId(row, allowIntent);\n            if (championId > 0) _ = LoadDraftChampionIconAsync(picture, fallback, championId, fingerprint);\n            return host;\n        }\n\n        private async Task LoadDraftChampionIconAsync(PictureBox picture, Label fallback, int championId, string fingerprint)\n        {\n            try\n            {\n                var bitmap = await LoadChampionBitmapAsync(championId);\n                if (bitmap == null || IsDisposed || picture.IsDisposed ||\n                    !string.Equals(_draftTeamFingerprint, fingerprint, StringComparison.Ordinal)) return;\n                picture.Image = bitmap;\n                if (fallback != null && !fallback.IsDisposed) fallback.Visible = false;\n            }\n            catch (OperationCanceledException) { } catch (ObjectDisposedException) { } catch { }\n        }\n\n        private string BuildDraftPlayerTooltip(LeagueLivePlayerRow row)\n        {\n            if (row == null) return string.Empty;\n            var values = new List<string>();\n            var position = ShortPosition(row.Position);\n            if (!string.IsNullOrWhiteSpace(position)) values.Add(position);\n            if (!string.IsNullOrWhiteSpace(row.AccountName)) values.Add(row.AccountName);\n            if (row.IsLocalPlayer) values.Add(UiTextRuntime.Text(UiTextKeys.AppName));\n            return string.Join(" · ", values);\n        }\n\n        private static int ResolveDraftChampionId(LeagueLivePlayerRow row, bool allowIntent)\n        {\n            if (row == null) return 0;\n            if (row.ChampionId > 0) return row.ChampionId;\n            return allowIntent && row.ChampionPickIntent > 0 ? row.ChampionPickIntent : 0;\n        }\n\n        private string ShortPosition(string value)\n        {\n            if (string.IsNullOrWhiteSpace(value)) return CompanionText(LeagueRuntimeCompanionUiTextKeys.DraftUnknownPosition);\n            switch (value.Trim().ToUpperInvariant())\n            {\n                case "TOP": return "上"; // ui-text-contract: allow\n                case "JUNGLE": return "野"; // ui-text-contract: allow\n                case "MIDDLE":\n                case "MID": return "中"; // ui-text-contract: allow\n                case "BOTTOM":\n                case "ADC": return "下"; // ui-text-contract: allow\n                case "UTILITY":\n                case "SUPPORT": return "辅"; // ui-text-contract: allow\n                default: return value.Length <= 2 ? value : value.Substring(0, 1).ToUpperInvariant();\n            }\n        }\n\n        private void RenderBuild(LeagueBuildAdvisorSnapshot build, bool loading, string error)\n''',
              'add draft timer/team rendering')

          # 6) Deterministic smokes protect that projection and defensive cloning.
          replace_once(
              'src/FACM/League/LeagueLiveSmokeTest.cs',
              '''            Require(bench.LocalPlayerCellId == 1 && bench.LocalChampionId == 22, "Bench state did not resolve the local champion.");\n            Require(bench.ChampionIds.SequenceEqual(new[] { 266, 55 }), "Legacy bench ids did not preserve client order.");\n''',
              '''            Require(bench.LocalPlayerCellId == 1 && bench.LocalChampionId == 22, "Bench state did not resolve the local champion.");\n            Require(bench.ChampionIds.SequenceEqual(new[] { 266, 55 }), "Legacy bench ids did not preserve client order.");\n            Require(bench.TimerPhase == "BAN_PICK" && bench.TimerMillisecondsLeft == 25000, "Bench-compatible draft projection lost the timer.");\n            Require(bench.AllyBans.SequenceEqual(new[] { 11, 22 }) && bench.EnemyBans.SequenceEqual(new[] { 33 }), "Bench-compatible draft projection lost bans.");\n            Require(bench.Players.Count == 3 && bench.Players.Exists(row => row.IsLocalPlayer && row.AccountName == "Me#CQ100"),\n                "Bench-compatible draft projection lost team rows or local identity.");\n''',
              'smoke projected draft state')

          replace_once(
              'src/FACM/League/LeagueRuntimeCompanionController.cs',
              '''                BenchChampionIds = new List<int> { 266, 55 }.AsReadOnly(),\n                Build = build,\n''',
              '''                BenchChampionIds = new List<int> { 266, 55 }.AsReadOnly(),\n                TimerPhase = "BAN_PICK",\n                TimerMillisecondsLeft = 25000,\n                AllyBans = new List<int> { 11, 22 }.AsReadOnly(),\n                EnemyBans = new List<int> { 33 }.AsReadOnly(),\n                Players = new List<LeagueLivePlayerRow>\n                {\n                    new LeagueLivePlayerRow { Side = "ally", CellId = 1, IsLocalPlayer = true, GameName = "Me", TagLine = "CN1", ChampionId = 58, Position = "TOP" }\n                }.AsReadOnly(),\n                Build = build,\n''',
              'seed controller draft clone smoke')

          replace_once(
