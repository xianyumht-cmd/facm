name: Runtime Companion Bench + Build Icons Fix

on:
  push:
    branches:
      - feat/runtime-companion-20260910
    paths:
      - .github/workflows/runtime-companion-bench-build-icons-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-companion-20260910
          fetch-depth: 0

      - name: Patch Runtime Companion
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          form = 'src/FACM/League/LeagueRuntimeCompanionForm.cs'
          replace_once(form,
              '        internal const int BenchHeight = 58;\n',
              '        internal const int BenchHeight = 64;\n'
              '        internal const int BenchLabelHeight = 16;\n'
              '        internal const int BenchButtonHeight = 38;\n'
              '        private const int BenchHostVerticalPadding = 2;\n'
              '        private const int BenchControlVerticalMargin = 2;\n',
              'bench constants')
          replace_once(form,
              '                Padding = new Padding(8, 4, 8, 4),\n',
              '                Padding = new Padding(8, BenchHostVerticalPadding, 8, BenchHostVerticalPadding),\n',
              'bench host padding')
          replace_once(form,
              '                Height = 16,\n',
              '                Height = BenchLabelHeight,\n',
              'bench label height')
          replace_once(form,
              '                Padding = new Padding(0, 2, 0, 0),\n',
              '                Padding = Padding.Empty,\n',
              'bench panel padding')
          replace_once(form,
              '            var button = CreateInlineButton(next ? "›" : "‹", Point.Empty, new Size(20, 38));\n',
              '            var button = CreateInlineButton(next ? "›" : "‹", Point.Empty, new Size(20, BenchButtonHeight));\n',
              'bench nav height')
          replace_once(form,
              '                Height = 38,\n',
              '                Height = BenchButtonHeight,\n',
              'bench button height')
          replace_once(form,
              '                ImageAlign = ContentAlignment.MiddleCenter,\n',
              '                ImageAlign = ContentAlignment.MiddleCenter,\n'
              '                BackgroundImageLayout = ImageLayout.Zoom,\n',
              'bench image layout')
          replace_once(form,
              '                button.Image = bitmap;\n                button.Text = string.Empty;\n',
              '                button.Image = null;\n'
              '                button.BackgroundImage = bitmap;\n'
              '                button.BackgroundImageLayout = ImageLayout.Zoom;\n'
              '                button.Text = string.Empty;\n',
              'bench icon scaling')

          models = 'src/FACM/League/LeagueBuildAdvisorModels.cs'
          replace_once(models,
              '        public string Evidence { get; set; }\n    }\n',
              '        public string Evidence { get; set; }\n'
              '        public IReadOnlyList<string> IconReferences { get; set; } = Array.Empty<string>();\n'
              '    }\n',
              'row icon references')
          replace_once(models,
              '            Perks = new Dictionary<int, string>();\n',
              '            Perks = new Dictionary<int, string>();\n'
              '            ItemIcons = new Dictionary<int, string>();\n'
              '            SpellIcons = new Dictionary<int, string>();\n',
              'catalog icon dictionaries ctor')
          replace_once(models,
              '        public Dictionary<int, string> Perks { get; private set; }\n',
              '        public Dictionary<int, string> Perks { get; private set; }\n'
              '        public Dictionary<int, string> ItemIcons { get; private set; }\n'
              '        public Dictionary<int, string> SpellIcons { get; private set; }\n',
              'catalog icon dictionaries props')

          data = 'src/FACM/League/LeagueBuildAdvisorDataService.cs'
          replace_once(data,
              '            AddPickRows(output, "summoner-spells", ReadValue(data, "summoner_spells"), catalog == null ? null : catalog.Spells, AlternativeRowLimit);\n'
              '            AddRuneRows(output, ReadValue(data, "runes"), ReadValue(data, "rune_pages"), catalog == null ? null : catalog.Perks, AlternativeRowLimit);\n'
              '            AddPickRows(output, "starter-items", ReadValue(data, "starter_items"), catalog == null ? null : catalog.Items, AlternativeRowLimit);\n'
              '            AddPickRows(output, "boots", ReadValue(data, "boots"), catalog == null ? null : catalog.Items, AlternativeRowLimit);\n'
              '            AddPickRows(output, "core-items", ReadValue(data, "core_items"), catalog == null ? null : catalog.Items, AlternativeRowLimit);\n',
              '            AddPickRows(output, "summoner-spells", ReadValue(data, "summoner_spells"), catalog == null ? null : catalog.Spells, catalog == null ? null : catalog.SpellIcons, AlternativeRowLimit);\n'
              '            AddRuneRows(output, ReadValue(data, "runes"), ReadValue(data, "rune_pages"), catalog == null ? null : catalog.Perks, AlternativeRowLimit);\n'
              '            AddPickRows(output, "starter-items", ReadValue(data, "starter_items"), catalog == null ? null : catalog.Items, catalog == null ? null : catalog.ItemIcons, AlternativeRowLimit);\n'
              '            AddPickRows(output, "boots", ReadValue(data, "boots"), catalog == null ? null : catalog.Items, catalog == null ? null : catalog.ItemIcons, AlternativeRowLimit);\n'
              '            AddPickRows(output, "core-items", ReadValue(data, "core_items"), catalog == null ? null : catalog.Items, catalog == null ? null : catalog.ItemIcons, AlternativeRowLimit);\n',
              'parse build icon catalogs')
          replace_once(data,
              '            ParseIdNameArray(championsBytes, catalog.Champions);\n'
              '            ParseIdNameArray(itemsBytes, catalog.Items);\n'
              '            ParseIdNameArray(spellsBytes, catalog.Spells);\n'
              '            ParseIdNameArray(perksBytes, catalog.Perks);\n',
              '            ParseIdNameArray(championsBytes, catalog.Champions);\n'
              '            ParseIdNameArray(itemsBytes, catalog.Items, catalog.ItemIcons);\n'
              '            ParseIdNameArray(spellsBytes, catalog.Spells, catalog.SpellIcons);\n'
              '            ParseIdNameArray(perksBytes, catalog.Perks);\n',
              'parse catalog icon paths')
          replace_once(data,
              '        private void AddPickRows(\n'
              '            LeagueBuildRecommendation output,\n'
              '            string category,\n'
              '            object value,\n'
              '            IDictionary<int, string> names,\n'
              '            int limit)\n',
              '        private void AddPickRows(\n'
              '            LeagueBuildRecommendation output,\n'
              '            string category,\n'
              '            object value,\n'
              '            IDictionary<int, string> names,\n'
              '            IDictionary<int, string> icons,\n'
              '            int limit)\n',
              'pick row signature')
          replace_once(data,
              '                    Recommendation = JoinNames(ids, names),\n                    Evidence = BuildEvidence(row, null)\n',
              '                    Recommendation = JoinNames(ids, names),\n'
              '                    Evidence = BuildEvidence(row, null),\n'
              '                    IconReferences = BuildIconReferences(ids, icons)\n',
              'pick row icon refs')
          replace_once(data,
              '        private void ParseIdNameArray(byte[] bytes, IDictionary<int, string> output)\n',
              '        private void ParseIdNameArray(byte[] bytes, IDictionary<int, string> output, IDictionary<int, string> icons = null)\n',
              'catalog parser signature')
          replace_once(data,
              '                var name = ReadString(row, "name");\n                if (id > 0 && !string.IsNullOrWhiteSpace(name)) output[id] = name.Trim();\n',
              '                var name = ReadString(row, "name");\n'
              '                var iconPath = ReadString(row, "iconPath");\n'
              '                if (id > 0 && !string.IsNullOrWhiteSpace(name)) output[id] = name.Trim();\n'
              '                if (id > 0 && icons != null && !string.IsNullOrWhiteSpace(iconPath))\n'
              '                    icons[id] = AssetReference(iconPath);\n',
              'catalog parser icon path')
          replace_once(data,
              '        private static string ResolveName(IDictionary<int, string> names, int id, string fallback)\n',
              '        private static IReadOnlyList<string> BuildIconReferences(IEnumerable<int> ids, IDictionary<int, string> icons)\n'
              '        {\n'
              '            var output = new List<string>();\n'
              '            foreach (var id in ids ?? Array.Empty<int>())\n'
              '            {\n'
              '                string reference;\n'
              '                output.Add(icons != null && icons.TryGetValue(id, out reference) ? reference : null);\n'
              '            }\n'
              '            return output.AsReadOnly();\n'
              '        }\n\n'
              '        private static string AssetReference(string path)\n'
              '        {\n'
              '            if (string.IsNullOrWhiteSpace(path)) return null;\n'
              '            var value = path.Trim();\n'
              '            if (value.StartsWith("http://", StringComparison.OrdinalIgnoreCase) ||\n'
              '                value.StartsWith("https://", StringComparison.OrdinalIgnoreCase)) return value;\n'
              '            if (!value.StartsWith("/", StringComparison.Ordinal))\n'
              '                value = "/lol-game-data/assets/" + value.TrimStart(\'/\');\n'
              '            return "lcu:" + value;\n'
              '        }\n\n'
              '        private static string ResolveName(IDictionary<int, string> names, int id, string fallback)\n',
              'icon helpers')
          replace_once(data,
              '                    Evidence = row.Evidence\n                });\n',
              '                    Evidence = row.Evidence,\n'
              '                    IconReferences = row.IconReferences == null\n'
              '                        ? Array.Empty<string>()\n'
              '                        : new List<string>(row.IconReferences).AsReadOnly()\n'
              '                });\n',
              'recommendation clone icon refs')
          replace_once(data,
              '            Copy(source.Perks, clone.Perks);\n',
              '            Copy(source.Perks, clone.Perks);\n'
              '            Copy(source.ItemIcons, clone.ItemIcons);\n'
              '            Copy(source.SpellIcons, clone.SpellIcons);\n',
              'catalog clone icon refs')

          runtime_models = 'src/FACM/League/LeagueRuntimeCompanionModels.cs'
          replace_once(runtime_models,
              '                    Evidence = row.Evidence\n                });\n',
              '                    Evidence = row.Evidence,\n'
              '                    IconReferences = row.IconReferences == null\n'
              '                        ? Array.Empty<string>()\n'
              '                        : new List<string>(row.IconReferences).AsReadOnly()\n'
              '                });\n',
              'runtime snapshot clone icon refs')

          replace_once(form,
              '            section.Rows = usable;\n'
              '            section.GuideFallback = false;\n'
              '            ClearSectionVisuals(section);\n'
              '            section.Value.Visible = true;\n',
              '            var preservePrimaryIcons = SupportsBuildPrimaryIcons(section.Category) &&\n'
              '                section.Visuals.Visible && section.Rows != null && section.Rows.Count > 0 &&\n'
              '                usable.Count > 0 && string.Equals(section.Rows[0].Recommendation, usable[0].Recommendation, StringComparison.Ordinal);\n'
              '            section.Rows = usable;\n'
              '            section.GuideFallback = false;\n'
              '            if (!preservePrimaryIcons) ClearSectionVisuals(section);\n'
              '            section.Value.Visible = !preservePrimaryIcons;\n',
              'preserve build icons')
          replace_once(form,
              '            section.Host.Visible = true;\n'
              '            section.Value.Text = usable[0].Recommendation;\n'
              '            _toolTip.SetToolTip(section.Value, usable[0].Recommendation ?? string.Empty);\n',
              '            section.Host.Visible = true;\n'
              '            section.Value.Text = usable[0].Recommendation;\n'
              '            var renderedIcons = preservePrimaryIcons || TryRenderBuildPrimaryIcons(section, usable[0]);\n'
              '            section.Value.Visible = !renderedIcons;\n'
              '            _toolTip.SetToolTip(section.Value, usable[0].Recommendation ?? string.Empty);\n',
              'primary build icon hook')
          replace_once(form,
              '        private void SetAlternativesExpanded(RecommendationSection section, bool expanded)\n',
              '        private bool TryRenderBuildPrimaryIcons(RecommendationSection section, LeagueBuildAdvisorRow row)\n'
              '        {\n'
              '            if (section == null || row == null || !SupportsBuildPrimaryIcons(section.Category) ||\n'
              '                row.IconReferences == null || row.IconReferences.Count == 0) return false;\n'
              '            var labels = (row.Recommendation ?? string.Empty).Split(new[] { " · " }, StringSplitOptions.None);\n'
              '            var count = Math.Min(BuildPrimaryIconLimit(section.Category), row.IconReferences.Count);\n'
              '            for (var index = 0; index < count; index++)\n'
              '            {\n'
              '                var label = index < labels.Length ? labels[index] : row.Recommendation;\n'
              '                section.Visuals.Controls.Add(CreateGuideToken(label, row.IconReferences[index], _guideSectionRenderGeneration));\n'
              '            }\n'
              '            section.Visuals.Visible = section.Visuals.Controls.Count > 0;\n'
              '            if (section.Visuals.Visible) _toolTip.SetToolTip(section.Visuals, row.Recommendation ?? string.Empty);\n'
              '            return section.Visuals.Visible;\n'
              '        }\n\n'
              '        private static bool SupportsBuildPrimaryIcons(string category)\n'
              '        {\n'
              '            return string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase) ||\n'
              '                   string.Equals(category, "starter-items", StringComparison.OrdinalIgnoreCase) ||\n'
              '                   string.Equals(category, "boots", StringComparison.OrdinalIgnoreCase) ||\n'
              '                   string.Equals(category, "core-items", StringComparison.OrdinalIgnoreCase);\n'
              '        }\n\n'
              '        private static int BuildPrimaryIconLimit(string category)\n'
              '        {\n'
              '            if (string.Equals(category, "summoner-spells", StringComparison.OrdinalIgnoreCase)) return 2;\n'
              '            if (string.Equals(category, "starter-items", StringComparison.OrdinalIgnoreCase)) return 3;\n'
              '            if (string.Equals(category, "boots", StringComparison.OrdinalIgnoreCase)) return 2;\n'
              '            return 5;\n'
              '        }\n\n'
              '        private void SetAlternativesExpanded(RecommendationSection section, bool expanded)\n',
              'build icon helpers')
          replace_once(form,
              '            if (HeaderHeight + ContextHeight + BenchHeight >= MinimumExpandedHeight)\n                throw new InvalidOperationException("Runtime Companion fixed regions leave no useful scroll body.");\n',
              '            if (HeaderHeight + ContextHeight + BenchHeight >= MinimumExpandedHeight)\n'
              '                throw new InvalidOperationException("Runtime Companion fixed regions leave no useful scroll body.");\n'
              '            var benchRequiredHeight = (BenchHostVerticalPadding * 2) + BenchLabelHeight + BenchButtonHeight + BenchControlVerticalMargin;\n'
              '            if (benchRequiredHeight > BenchHeight)\n'
              '                throw new InvalidOperationException("Runtime Companion Bench controls exceed the fixed Bench host height.");\n',
              'bench smoke geometry')

          smoke = 'src/FACM/League/LeagueBuildAdvisorSmokeTest.cs'
          replace_once(smoke,
              '                Require(spellRows[0].Evidence.Contains("win 54.2%") && spellRows[0].Evidence.Contains("1,200 games"),\n                    "Build Advisor did not project available win/sample evidence.");\n',
              '                Require(spellRows[0].Evidence.Contains("win 54.2%") && spellRows[0].Evidence.Contains("1,200 games"),\n'
              '                    "Build Advisor did not project available win/sample evidence.");\n'
              '                Require(spellRows[0].IconReferences.Count == 2 && spellRows[0].IconReferences.All(value => value != null && value.StartsWith("lcu:/lol-game-data/assets/", StringComparison.OrdinalIgnoreCase)),\n'
              '                    "Build Advisor did not preserve summoner-spell icon references for Runtime Companion.");\n'
              '                Require(starterRows[0].IconReferences.Count > 0 && coreRows[0].IconReferences.Count > 0,\n'
              '                    "Build Advisor did not preserve item icon references for Runtime Companion.");\n',
              'build icon smoke assertions')

          p = Path(smoke)
          text = p.read_text(encoding='utf-8')
          replacements = {
              '\\"id\\":4,\\"name\\":\\"闪现\\"}': '\\"id\\":4,\\"name\\":\\"闪现\\",\\"iconPath\\":\\"ASSETS/Spells/Icons2D/SummonerFlash.png\\"}',
              '\\"id\\":11,\\"name\\":\\"惩戒\\"}': '\\"id\\":11,\\"name\\":\\"惩戒\\",\\"iconPath\\":\\"ASSETS/Spells/Icons2D/SummonerSmite.png\\"}',
              '\\"id\\":12,\\"name\\":\\"传送\\"}': '\\"id\\":12,\\"name\\":\\"传送\\",\\"iconPath\\":\\"ASSETS/Spells/Icons2D/SummonerTeleport.png\\"}',
              '\\"id\\":1056,\\"name\\":\\"多兰之戒\\"}': '\\"id\\":1056,\\"name\\":\\"多兰之戒\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/1056.png\\"}',
              '\\"id\\":1055,\\"name\\":\\"多兰之刃\\"}': '\\"id\\":1055,\\"name\\":\\"多兰之刃\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/1055.png\\"}',
              '\\"id\\":3020,\\"name\\":\\"法师之靴\\"}': '\\"id\\":3020,\\"name\\":\\"法师之靴\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/3020.png\\"}',
              '\\"id\\":3117,\\"name\\":\\"疾行之靴\\"}': '\\"id\\":3117,\\"name\\":\\"疾行之靴\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/3117.png\\"}',
              '\\"id\\":6655,\\"name\\":\\"卢登伴侣\\"}': '\\"id\\":6655,\\"name\\":\\"卢登伴侣\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/6655.png\\"}',
              '\\"id\\":3071,\\"name\\":\\"黑色切割者\\"}': '\\"id\\":3071,\\"name\\":\\"黑色切割者\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/3071.png\\"}',
              '\\"id\\":3065,\\"name\\":\\"振奋盔甲\\"}': '\\"id\\":3065,\\"name\\":\\"振奋盔甲\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/3065.png\\"}',
              '\\"id\\":3089,\\"name\\":\\"灭世者的死亡之帽\\"}': '\\"id\\":3089,\\"name\\":\\"灭世者的死亡之帽\\",\\"iconPath\\":\\"ASSETS/Items/Icons2D/3089.png\\"}',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'fixture patch expected one match for {old}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit patch, remove one-shot workflows, cleanup accidental branches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-bench-build-icons.yml
          git rm .github/workflows/runtime-companion-bench-build-icons-fix.yml
          git add src/FACM/League/LeagueRuntimeCompanionForm.cs \
                  src/FACM/League/LeagueBuildAdvisorModels.cs \
                  src/FACM/League/LeagueBuildAdvisorDataService.cs \
                  src/FACM/League/LeagueRuntimeCompanionModels.cs \
                  src/FACM/League/LeagueBuildAdvisorSmokeTest.cs
          git commit -m "Fix Bench avatar clipping and iconify build rows"
          git push origin HEAD:feat/runtime-companion-20260910
          for branch in \
            __noop-do-not-use \
            feat/runtime-companion-20260910-temp \
            feat/runtime-companion-20260910-patch \
            feat/runtime-companion-20260910-finalpatch \
            feat/runtime-companion-20260910-cleanup \
            feat/runtime-companion-20260910-icons \
            feat/runtime-companion-20260910-real \
            feat/runtime-companion-20260910-x \
            feat/runtime-companion-20260910-zz; do
            git push origin --delete "$branch" || true
          done
