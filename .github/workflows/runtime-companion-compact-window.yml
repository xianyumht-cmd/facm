                  '''            var bitmap = DecodeBitmap(bytes, new Size(44, 44));\n''',
                  'cached champion bitmap size'),
              (
                  '''                var bitmap = DecodeBitmap(bytes, new Size(52, 52));\n''',
                  '''                var bitmap = DecodeBitmap(bytes, new Size(44, 44));\n''',
                  'guide champion bitmap size'),
              (
                  '''                Location = new Point(x, 7),\n                Size = new Size(width, 28),\n''',
                  '''                Location = new Point(x, 4),\n                Size = new Size(width, 28),\n''',
                  'chrome vertical geometry'),
              (
                  '''            if (DesignWidth < 360 || DesignWidth > 430)\n''',
                  '''            if (DesignWidth < 300 || DesignWidth > 340)\n''',
