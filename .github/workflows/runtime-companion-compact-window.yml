                  '''            _pinButton = CreateChromeButton("↑", 284, 30);\n''',
                  '''            _pinButton = CreateChromeButton("↑", 216, 30);\n''',
                  'pin position'),
              (
                  '''            _collapseButton = CreateChromeButton("−", 316, 30);\n''',
                  '''            _collapseButton = CreateChromeButton("−", 248, 30);\n''',
