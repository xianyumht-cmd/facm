        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-compact-window.yml
          git add src/FACM/League/LeagueRuntimeCompanionForm.cs src/FACM/League/LeagueRuntimeCompanionWindowState.cs
