name: Runtime Companion Compact Window

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact Akari-style geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new, label in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f'{path}: missing anchor: {label}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='\n')

          patch('src/FACM/League/LeagueRuntimeCompanionForm.cs', [
              (
                  '''        internal const int DesignWidth = 388;\n        internal const int HeaderHeight = 42;\n        internal const int ContextHeight = 96;\n        internal const int BenchHeight = 70;\n        internal const int MinimumExpandedHeight = 480;\n        internal const int MaximumExpandedHeight = 720;\n        internal const int BodyContentWidth = 348;\n        internal const int AugmentColumnTotalWidth = 334;\n        private const int SectionWidth = 348;\n        private const int RecommendationBaseHeight = 74;\n        private const int AlternativeRowHeight = 42;\n''',
