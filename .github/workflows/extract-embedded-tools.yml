name: extract-facm-embedded-tools

on:
  push:
    branches:
      - codex/extract-facm-tools-20260806
    paths:
      - tools/FACM.exe
      - scripts/extract_embedded_tools.py
      - .github/workflows/extract-embedded-tools.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/FACM.exe
      - scripts/extract_embedded_tools.py
      - .github/workflows/extract-embedded-tools.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extractor dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26

      - name: Extract embedded files without execution
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          python scripts/extract_embedded_tools.py tools/FACM.exe extracted-facm-tools
          if ($LASTEXITCODE -ne 0) { throw "Extractor returned $LASTEXITCODE" }

      - name: Stage original embedded resources
        shell: pwsh
        run: |
          $raw = Join-Path $PWD 'extracted-facm-tools/raw-resources'
          $mapping = [ordered]@{
            'resource-009-*' = 'clean driver.exe'
            'resource-010-*' = 'clean game file.exe'
            'resource-011-*' = 'Fix-LCU-Window.exe'
            'resource-012-*' = 'fix-mode-4.bat'
            'resource-013-*' = 'fix-mode-1.bat'
            'resource-014-*' = 'fix-mode-2.bat'
            'resource-015-*' = 'fix-mode-3.bat'
          }

          foreach ($pattern in $mapping.Keys) {
            $source = @(Get-ChildItem $raw -File -Filter $pattern)
            if ($source.Count -ne 1) {
              throw "Expected exactly one resource for $pattern, found $($source.Count)"
            }
            Copy-Item $source[0].FullName (Join-Path $PWD ('tools/' + $mapping[$pattern])) -Force
          }

          $selected = @($mapping.Values | ForEach-Object { Join-Path $PWD ('tools/' + $_) })
          $hashLines = foreach ($path in $selected) {
            $hash = Get-FileHash $path -Algorithm SHA256
            '{0} *{1}' -f $hash.Hash, (Split-Path $path -Leaf)
          }
          $hashLines | Set-Content (Join-Path $PWD 'tools/EXTRACTED-TOOLS-SHA256.txt') -Encoding ascii

          $summary = [ordered]@{
            source = 'tools/FACM.exe'
            source_sha256 = (Get-FileHash (Join-Path $PWD 'tools/FACM.exe') -Algorithm SHA256).Hash
            extraction_method = 'PE resource extraction; files were never executed'
            files = @(
              foreach ($path in $selected) {
                $item = Get-Item $path
                [ordered]@{
                  name = $item.Name
                  size = $item.Length
                  sha256 = (Get-FileHash $path -Algorithm SHA256).Hash
                }
              }
            )
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $PWD 'tools/EXTRACTED-TOOLS.json') -Encoding utf8

      - name: Display extraction report
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          Get-Content extracted-facm-tools/REPORT.md -Encoding utf8
          Get-Content tools/EXTRACTED-TOOLS-SHA256.txt -Encoding ascii
          Get-Content tools/EXTRACTED-TOOLS.json -Encoding utf8

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: facm-embedded-tools
          path: |
            tools/clean driver.exe
            tools/clean game file.exe
            tools/Fix-LCU-Window.exe
            tools/fix-mode-*.bat
            tools/EXTRACTED-TOOLS-SHA256.txt
            tools/EXTRACTED-TOOLS.json
            extracted-facm-tools/REPORT.md
            extracted-facm-tools/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit extracted tools to branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'tools/clean driver.exe' 'tools/clean game file.exe' 'tools/Fix-LCU-Window.exe' 'tools/fix-mode-1.bat' 'tools/fix-mode-2.bat' 'tools/fix-mode-3.bat' 'tools/fix-mode-4.bat' 'tools/EXTRACTED-TOOLS-SHA256.txt' 'tools/EXTRACTED-TOOLS.json'
          if (git diff --cached --quiet) {
            Write-Host 'Extracted tool files are already current.'
            exit 0
          }
          git commit -m 'Extract embedded FACM tools'
          git push origin HEAD:${{ github.ref_name }}
