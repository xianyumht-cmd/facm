name: Runtime Companion Akari Readability Pass

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact readability and native-scrollbar removal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # Localized compact control copy.
          path = 'src/FACM/League/LeagueRuntimeCompanionUiText.cs'
          text = read(path)
          text = replace_once(text,
              '        public const string ImportItems = "LeagueRuntimeCompanionImportItems";\n',
              '        public const string ImportItems = "LeagueRuntimeCompanionImportItems";\n'
              '        public const string ApplyShort = "LeagueRuntimeCompanionApplyShort";\n'
              '        public const string ImportShort = "LeagueRuntimeCompanionImportShort";\n'
              '        public const string PreviousPage = "LeagueRuntimeCompanionPreviousPage";\n'
              '        public const string NextPage = "LeagueRuntimeCompanionNextPage";\n'
              '        public const string ChampionResolving = "LeagueRuntimeCompanionChampionResolving";\n',
              'runtime compact text keys')
          text = replace_once(text,
              '            { LeagueRuntimeCompanionUiTextKeys.ImportItems, "导入装备" },\n',
              '            { LeagueRuntimeCompanionUiTextKeys.ImportItems, "导入装备" },\n'
              '            { LeagueRuntimeCompanionUiTextKeys.ApplyShort, "应用" },\n'
              '            { LeagueRuntimeCompanionUiTextKeys.ImportShort, "导入" },\n'
              '            { LeagueRuntimeCompanionUiTextKeys.PreviousPage, "上一页" },\n'
              '            { LeagueRuntimeCompanionUiTextKeys.NextPage, "下一页" },\n'
              '            { LeagueRuntimeCompanionUiTextKeys.ChampionResolving, "正在读取英雄名称" },\n',
              'runtime compact text defaults')
          write(path, text)

          # Add one-shot champion-name resolver using the existing LCU-first Riot game-data path.
          path = 'src/FACM/Mayhem/RiotGameDataService.cs'
          text = read(path)
          marker = '        public static async Task<byte[]> DownloadImageAsync(\n'
          addition = '''        public static async Task<string> ResolveChampionNameAsync(\n            int championId,\n            ILeagueClientApi leagueClient,\n            CancellationToken token)\n        {\n            if (championId <= 0) return null;\n            try\n            {\n                var detail = await ReadGameDataAsync(\n                    "champions/" + championId + ".json",\n                    leagueClient,\n                    token).ConfigureAwait(false) as Dictionary<string, object>;\n                var name = ReadString(detail, "name");\n                return string.IsNullOrWhiteSpace(name) ? null : name.Trim();\n            }\n            catch (OperationCanceledException)\n            {\n                throw;\n            }\n            catch\n            {\n                return null;\n            }\n        }\n\n'''
          text = replace_once(text, marker, addition + marker, 'champion name resolver')
          write(path, text)

          # Keep image/name access behind the existing companion controller boundary.
          path = 'src/FACM/League/LeagueRuntimeCompanionController.cs'
          text = read(path)
          text = replace_once(text, 'using System.Collections.Generic;\n', 'using System.Collections.Generic;\nusing System.Drawing;\n', 'controller drawing import')
          marker = '''        public Task<byte[]> LoadGuideChampionIconAsync(string reference, CancellationToken cancellationToken)\n        {\n            ThrowIfDisposed();\n            return RiotGameDataService.DownloadImageAsync(reference, _leagueClient, cancellationToken);\n        }\n\n'''
          addition = marker + '''        public Task<Bitmap> LoadGuideAssetAsync(string reference, CancellationToken cancellationToken)\n        {\n            ThrowIfDisposed();\n            return MayhemImageCache.GetAsync(reference, _leagueClient, cancellationToken);\n        }\n\n        public Task<string> ResolveChampionNameAsync(int championId, CancellationToken cancellationToken)\n        {\n            ThrowIfDisposed();\n            return RiotGameDataService.ResolveChampionNameAsync(championId, _leagueClient, cancellationToken);\n        }\n\n'''
          text = replace_once(text, marker, addition, 'controller guide asset/name methods')
          write(path, text)

          path = 'src/FACM/League/LeagueRuntimeCompanionForm.cs'
          text = read(path)

          # Constants / fields / state.
          text = replace_once(text,
              '        private const int AlternativeRowHeight = 36;\n',
              '        private const int AlternativeRowHeight = 36;\n'
              '        private const int AugmentPageSize = 5;\n'
              '        private const int AugmentRowHeight = 36;\n'
              '        private const int BenchPageSize = 5;\n',
              'compact paging constants')
          text = replace_once(text,
              '        private readonly Panel _mayhemSection;\n        private readonly ListView _augments;\n',
              '        private readonly Panel _mayhemSection;\n'
              '        private readonly FlowLayoutPanel _augmentRows;\n'
              '        private readonly Button _augmentPrevButton;\n'
              '        private readonly Button _augmentNextButton;\n'
              '        private readonly Label _augmentPageLabel;\n',
              'augment custom fields')
          text = replace_once(text,
              '        private Point _dragWindow;\n',
              '        private Point _dragWindow;\n'
              '        private IReadOnlyList<MayhemAugmentRow> _augmentSource = Array.Empty<MayhemAugmentRow>();\n'
              '        private readonly List<Image> _ownedAugmentIcons = new List<Image>();\n'
              '        private int _augmentPage;\n'
              '        private int _augmentRenderGeneration;\n'
              '        private int _benchPage;\n'
              '        private string _benchRosterFingerprint;\n'
              '        private string _benchRenderFingerprint;\n',
              'paging state')

          # Header status: compact semantic indicator; detailed status remains in tooltip/context row.
          text = replace_once(text,
              '''            _status = new Label\n            {\n                Text = CompanionText(LeagueRuntimeCompanionUiTextKeys.BuildWaiting),\n                Location = new Point(92, 0),\n                Size = new Size(116, HeaderHeight),\n                TextAlign = ContentAlignment.MiddleRight,\n                AutoEllipsis = true,\n                BackColor = Color.Transparent,\n                ForeColor = FacmDesignSystem.TextMuted\n            };\n''',
              '''            _status = new Label\n            {\n                Text = char.ConvertFromUtf32(0x25CF),\n                Location = new Point(190, 0),\n                Size = new Size(18, HeaderHeight),\n                TextAlign = ContentAlignment.MiddleCenter,\n                AutoEllipsis = false,\n                BackColor = Color.Transparent,\n                ForeColor = FacmDesignSystem.TextMuted\n            };\n''',
              'compact header status')

          # Bench never exposes native white scrollbars; pagination keeps every champion reachable.
          text = replace_once(text,
              '''                WrapContents = false,\n                AutoScroll = true,\n                BackColor = FacmDesignSystem.Canvas,\n                Padding = new Padding(0, 2, 0, 0),\n''',
              '''                WrapContents = false,\n                AutoScroll = false,\n                BackColor = FacmDesignSystem.Canvas,\n                Padding = new Padding(0, 2, 0, 0),\n''',
              'bench no native scroll')

          # Short adjacent action labels reclaim recommendation width.
          text = replace_once(text,
              '                T(LeagueBuildApplyUiTextKeys.Apply));\n            _spells = CreateRecommendationSection(\n                "summoner-spells",\n                LeagueRecommendationText.Get(_ui, LeagueRecommendationUiTextKeys.Spells),\n                T(LeagueBuildApplyUiTextKeys.Apply));\n',
              '                CompanionText(LeagueRuntimeCompanionUiTextKeys.ApplyShort));\n            _spells = CreateRecommendationSection(\n                "summoner-spells",\n                LeagueRecommendationText.Get(_ui, LeagueRecommendationUiTextKeys.Spells),\n                CompanionText(LeagueRuntimeCompanionUiTextKeys.ApplyShort));\n',
              'short rune spell actions')
          text = replace_once(text,
              '                CompanionText(LeagueRuntimeCompanionUiTextKeys.ImportItems));\n',
              '                CompanionText(LeagueRuntimeCompanionUiTextKeys.ImportShort));\n',
              'short import action')

          # Replace the native Details ListView with FACM-native icon rows + local paging.
          start = text.index('            _mayhemSection = new Panel\n')
          end_marker = '            _sections.Controls.Add(_mayhemSection);\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''            _mayhemSection = new Panel\n            {\n                Width = SectionWidth,\n                Height = 226,\n                Margin = Padding.Empty,\n                BackColor = FacmDesignSystem.Canvas,\n                Visible = false\n            };\n            var augmentTitle = new Label\n            {\n                Text = CompanionText(LeagueRuntimeCompanionUiTextKeys.MayhemAugments),\n                Location = new Point(0, 7),\n                Size = new Size(150, 20),\n                AutoEllipsis = true,\n                ForeColor = FacmDesignSystem.Text,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 9F, FontStyle.Bold)\n            };\n            _augmentPrevButton = CreateInlineButton(char.ConvertFromUtf32(0x2039), new Point(184, 3), new Size(24, 24));\n            _augmentPageLabel = new Label\n            {\n                Text = string.Empty,\n                Location = new Point(208, 5),\n                Size = new Size(48, 20),\n                TextAlign = ContentAlignment.MiddleCenter,\n                ForeColor = FacmDesignSystem.TextMuted,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 7.8F)\n            };\n            _augmentNextButton = CreateInlineButton(char.ConvertFromUtf32(0x203A), new Point(258, 3), new Size(24, 24));\n            _augmentPrevButton.Click += delegate { SetAugmentPage(_augmentPage - 1); };\n            _augmentNextButton.Click += delegate { SetAugmentPage(_augmentPage + 1); };\n            var augmentRule = new Panel\n            {\n                Location = new Point(0, 31),\n                Size = new Size(SectionWidth, 1),\n                BackColor = FacmDesignSystem.BorderSoft\n            };\n            _augmentRows = new FlowLayoutPanel\n            {\n                Location = new Point(0, 38),\n                Size = new Size(SectionWidth, AugmentPageSize * AugmentRowHeight),\n                FlowDirection = FlowDirection.TopDown,\n                WrapContents = false,\n                AutoScroll = false,\n                Margin = Padding.Empty,\n                Padding = Padding.Empty,\n                BackColor = FacmDesignSystem.Canvas\n            };\n            _mayhemSection.Controls.Add(augmentTitle);\n            _mayhemSection.Controls.Add(_augmentPrevButton);\n            _mayhemSection.Controls.Add(_augmentPageLabel);\n            _mayhemSection.Controls.Add(_augmentNextButton);\n            _mayhemSection.Controls.Add(augmentRule);\n            _mayhemSection.Controls.Add(_augmentRows);\n            _sections.Controls.Add(_mayhemSection);\n'''
          text = text[:start] + replacement + text[end:]

          # Tooltip for semantic header status after ToolTip exists.
          text = replace_once(text,
              '            _toolTip = new ToolTip { ShowAlways = true, AutomaticDelay = 120 };\n',
              '            _toolTip = new ToolTip { ShowAlways = true, AutomaticDelay = 120 };\n'
              '            _toolTip.SetToolTip(_status, CompanionText(LeagueRuntimeCompanionUiTextKeys.BuildWaiting));\n'
              '            _toolTip.SetToolTip(_augmentPrevButton, CompanionText(LeagueRuntimeCompanionUiTextKeys.PreviousPage));\n'
              '            _toolTip.SetToolTip(_augmentNextButton, CompanionText(LeagueRuntimeCompanionUiTextKeys.NextPage));\n',
              'status and pager tooltips')

          # Recommendation geometry: keep two useful text lines and a full-width evidence line.
          text = text.replace('Size = new Size(actionText == null ? 214 : 148, 31),', 'Size = new Size(actionText == null ? 214 : 168, 31),', 1)
          text = text.replace('Size = new Size(154, 16),', 'Size = new Size(214, 16),', 1)
          text = text.replace('CreateInlineButton(actionText, new Point(222, 6), new Size(62, 26))', 'CreateInlineButton(actionText, new Point(242, 6), new Size(42, 26))', 1)
          text = text.replace('CreateInlineButton(string.Empty, new Point(230, 36), new Size(54, 20))', 'CreateInlineButton(string.Empty, new Point(8, 36), new Size(54, 20))', 1)

          # Full source text remains discoverable without forcing ellipsis into the primary reading path.
          text = replace_once(text,
              '''            section.Value.Text = usable[0].Recommendation;\n            if (!_actionBusy || section.Action == null)\n                section.Evidence.Text = usable[0].Evidence ?? string.Empty;\n''',
              '''            section.Value.Text = usable[0].Recommendation;\n            _toolTip.SetToolTip(section.Value, usable[0].Recommendation ?? string.Empty);\n            if (!_actionBusy || section.Action == null)\n                section.Evidence.Text = usable[0].Evidence ?? string.Empty;\n            _toolTip.SetToolTip(section.Evidence, usable[0].Evidence ?? string.Empty);\n''',
              'recommendation tooltips')

          # Stop exposing raw #ID as a user-facing hero name while metadata is still resolving.
          text = replace_once(text,
              '                _championTitle.Text = FirstNonEmpty(result.ChampionName, result.Query, MayhemUiCopy.Unknown);\n',
              '''                if (!string.IsNullOrWhiteSpace(result.ChampionName))\n                    _championTitle.Text = result.ChampionName;\n                else if (_renderedGuideChampionId > 0)\n                {\n                    _championTitle.Text = CompanionText(LeagueRuntimeCompanionUiTextKeys.ChampionResolving);\n                    _ = ResolveGuideChampionNameAsync(_renderedGuideChampionId);\n                }\n                else\n                    _championTitle.Text = MayhemUiCopy.Unknown;\n''',
              'no raw champion id title')

          # Replace native ListView population with compact paged data rows.
          pattern = re.compile(r'''            _augments\.BeginUpdate\(\);\n            try\n            \{.*?            finally \{ _augments\.EndUpdate\(\); \}\n            _mayhemSection\.Visible = _augments\.Items\.Count > 0;\n''', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('missing anchor: augment ListView render block')
          text = text[:match.start()] + '''            _augmentSource = (result.AugmentRows ?? new List<MayhemAugmentRow>())\n                .Where(value => value != null && !string.IsNullOrWhiteSpace(value.Name))\n                .OrderBy(value => value.Rank <= 0 ? int.MaxValue : value.Rank)\n                .ThenBy(value => value.Name, StringComparer.OrdinalIgnoreCase)\n                .Take(40)\n                .ToList()\n                .AsReadOnly();\n            SetAugmentPage(0);\n''' + text[match.end():]

          # Old clear calls become custom row cleanup.
          text = text.replace('            _augments.Items.Clear();\n', '            ClearAugments();\n')

          # Bench render becomes compact paging rather than OS scrollbars.
          pattern = re.compile(r'''        private void RenderBench\(LeagueRuntimeCompanionSnapshot snapshot\)\n        \{.*?\n        \}\n\n        private void ClearBenchButtons\(\)''', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('missing anchor: RenderBench method')
          bench_code = '''        private void RenderBench(LeagueRuntimeCompanionSnapshot snapshot)\n        {\n            var ids = (snapshot.BenchChampionIds ?? Array.Empty<int>())\n                .Where(id => id > 0)\n                .Distinct()\n                .ToArray();\n            var rosterFingerprint = string.Join(",", ids.Select(id => id.ToString(CultureInfo.InvariantCulture)));\n            if (!string.Equals(_benchRosterFingerprint, rosterFingerprint, StringComparison.Ordinal))\n            {\n                _benchRosterFingerprint = rosterFingerprint;\n                _benchPage = 0;\n                _benchRenderFingerprint = null;\n            }\n\n            var pageCount = Math.Max(1, (int)Math.Ceiling(ids.Length / (double)BenchPageSize));\n            _benchPage = Math.Max(0, Math.Min(_benchPage, pageCount - 1));\n            var renderFingerprint = rosterFingerprint + "|" + _benchPage.ToString(CultureInfo.InvariantCulture) + "|" +\n                                    snapshot.LocalChampionId.ToString(CultureInfo.InvariantCulture) + "|" + snapshot.SwapRoute;\n            if (string.Equals(_benchRenderFingerprint, renderFingerprint, StringComparison.Ordinal)) return;\n            _benchRenderFingerprint = renderFingerprint;\n\n            var old = _benchPanel.Controls.Cast<Control>().ToArray();\n            _benchPanel.Controls.Clear();\n            foreach (var control in old) control.Dispose();\n\n            if (pageCount > 1) _benchPanel.Controls.Add(CreateBenchNavButton(false));\n            foreach (var championId in ids.Skip(_benchPage * BenchPageSize).Take(BenchPageSize))\n            {\n                var button = CreateBenchButton(championId);\n                button.Tag = new BenchTarget { ChampionId = championId, Route = snapshot.SwapRoute };\n                button.Click += async delegate\n                {\n                    var target = button.Tag as BenchTarget;\n                    if (target != null) await SwapToAsync(target.ChampionId, target.Route);\n                };\n                button.FlatAppearance.BorderColor = championId == snapshot.LocalChampionId\n                    ? FacmDesignSystem.Accent\n                    : FacmDesignSystem.BorderSoft;\n                _toolTip.SetToolTip(button, BenchText(LeagueBenchQuickPickUiTextKeys.Tooltip) + " #" + championId.ToString(CultureInfo.InvariantCulture));\n                _benchPanel.Controls.Add(button);\n                _ = LoadBenchIconAsync(button, championId);\n            }\n            if (pageCount > 1) _benchPanel.Controls.Add(CreateBenchNavButton(true));\n        }\n\n        private Button CreateBenchNavButton(bool next)\n        {\n            var button = CreateInlineButton(\n                char.ConvertFromUtf32(next ? 0x203A : 0x2039),\n                Point.Empty,\n                new Size(20, 34));\n            button.Margin = new Padding(0, 1, 3, 1);\n            button.Click += delegate\n            {\n                var snapshot = _controller.CurrentSnapshot;\n                var count = (snapshot.BenchChampionIds ?? Array.Empty<int>()).Count(id => id > 0);\n                var pages = Math.Max(1, (int)Math.Ceiling(count / (double)BenchPageSize));\n                _benchPage = next ? Math.Min(pages - 1, _benchPage + 1) : Math.Max(0, _benchPage - 1);\n                _benchRenderFingerprint = null;\n                RenderBench(snapshot);\n            };\n            _toolTip.SetToolTip(button, CompanionText(next\n                ? LeagueRuntimeCompanionUiTextKeys.NextPage\n                : LeagueRuntimeCompanionUiTextKeys.PreviousPage));\n            return button;\n        }\n\n        private void ClearBenchButtons()'''
          text = text[:match.start()] + bench_code + text[match.end():]

          # Make Bench buttons fit five plus pager controls.
          text = text.replace('                Width = 48,\n                Height = 42,\n                Margin = new Padding(0, 1, 5, 1),',
                              '                Width = 38,\n                Height = 34,\n                Margin = new Padding(0, 1, 4, 1),', 1)

          # Clear Bench page identity whenever Bench disappears.
          text = replace_once(text,
              '''            foreach (var control in controls) control.Dispose();\n        }\n\n        private Button CreateBenchButton''',
              '''            foreach (var control in controls) control.Dispose();\n            _benchRosterFingerprint = null;\n            _benchRenderFingerprint = null;\n            _benchPage = 0;\n        }\n\n        private Button CreateBenchButton''',
              'bench paging reset')

          # Add custom augment renderer + name fallback before ARAM balance rendering.
          marker = '        private void RenderAramBaseBalance(MayhemChampionResult result)\n'
          helper = '''        private void SetAugmentPage(int page)\n        {\n            var pageCount = Math.Max(1, (int)Math.Ceiling(_augmentSource.Count / (double)AugmentPageSize));\n            _augmentPage = Math.Max(0, Math.Min(page, pageCount - 1));\n            RenderAugmentPage();\n        }\n\n        private void RenderAugmentPage()\n        {\n            DisposeAugmentRows();\n            if (_augmentSource == null || _augmentSource.Count == 0)\n            {\n                _augmentPageLabel.Text = string.Empty;\n                _augmentPrevButton.Enabled = false;\n                _augmentNextButton.Enabled = false;\n                _mayhemSection.Visible = false;\n                return;\n            }\n\n            var pageCount = Math.Max(1, (int)Math.Ceiling(_augmentSource.Count / (double)AugmentPageSize));\n            _augmentPage = Math.Max(0, Math.Min(_augmentPage, pageCount - 1));\n            _augmentPageLabel.Text = (_augmentPage + 1).ToString(CultureInfo.InvariantCulture) + "/" + pageCount.ToString(CultureInfo.InvariantCulture);\n            _augmentPrevButton.Enabled = _augmentPage > 0;\n            _augmentNextButton.Enabled = _augmentPage + 1 < pageCount;\n            var generation = ++_augmentRenderGeneration;\n\n            foreach (var row in _augmentSource.Skip(_augmentPage * AugmentPageSize).Take(AugmentPageSize))\n                _augmentRows.Controls.Add(CreateAugmentRow(row, generation));\n            _mayhemSection.Visible = _augmentRows.Controls.Count > 0;\n        }\n\n        private Panel CreateAugmentRow(MayhemAugmentRow row, int generation)\n        {\n            var host = new Panel\n            {\n                Width = SectionWidth,\n                Height = AugmentRowHeight,\n                Margin = Padding.Empty,\n                BackColor = FacmDesignSystem.Canvas\n            };\n            var icon = new PictureBox\n            {\n                Location = new Point(0, 5),\n                Size = new Size(26, 26),\n                SizeMode = PictureBoxSizeMode.Zoom,\n                BackColor = FacmDesignSystem.SurfaceRaised\n            };\n            FacmDesignSystem.Round(icon, Math.Min(4, FacmDesignSystem.ControlRadius));\n            var rank = row.Rank > 0 ? row.Rank.ToString(CultureInfo.InvariantCulture) : string.Empty;\n            var title = new Label\n            {\n                Text = string.IsNullOrWhiteSpace(rank) ? row.Name : rank + "  " + row.Name,\n                Location = new Point(34, 1),\n                Size = new Size(178, 17),\n                AutoEllipsis = true,\n                ForeColor = FacmDesignSystem.Text,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 8.5F, FontStyle.Bold)\n            };\n            var rarity = new Label\n            {\n                Text = string.Equals(row.Rarity, MayhemUiCopy.Unknown, StringComparison.OrdinalIgnoreCase) ? string.Empty : (row.Rarity ?? string.Empty),\n                Location = new Point(216, 1),\n                Size = new Size(68, 17),\n                TextAlign = ContentAlignment.TopRight,\n                AutoEllipsis = true,\n                ForeColor = FacmDesignSystem.TextMuted,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 7.4F)\n            };\n            var metrics = new Label\n            {\n                Text = BuildAugmentMetrics(row),\n                Location = new Point(34, 18),\n                Size = new Size(250, 16),\n                AutoEllipsis = true,\n                ForeColor = FacmDesignSystem.TextMuted,\n                BackColor = Color.Transparent,\n                Font = new Font(FacmThemeRuntime.Current.FontName, 7.5F)\n            };\n            var rule = new Panel\n            {\n                Location = new Point(0, AugmentRowHeight - 1),\n                Size = new Size(SectionWidth, 1),\n                BackColor = FacmDesignSystem.BorderSoft\n            };\n            host.Controls.Add(icon);\n            host.Controls.Add(title);\n            host.Controls.Add(rarity);\n            host.Controls.Add(metrics);\n            host.Controls.Add(rule);\n            var detail = string.IsNullOrWhiteSpace(row.Description) ? row.Name : row.Name + Environment.NewLine + row.Description;\n            _toolTip.SetToolTip(host, detail);\n            _toolTip.SetToolTip(title, detail);\n            _toolTip.SetToolTip(metrics, detail);\n            if (!string.IsNullOrWhiteSpace(row.IconUrl)) _ = LoadAugmentIconAsync(icon, row.IconUrl, generation);\n            return host;\n        }\n\n        private static string BuildAugmentMetrics(MayhemAugmentRow row)\n        {\n            var parts = new List<string>();\n            if (row == null) return string.Empty;\n            if (row.WinRate.HasValue) parts.Add(MayhemUiCopy.WinShort + FormatRate(row.WinRate));\n            if (row.PickRate.HasValue) parts.Add(MayhemUiCopy.PickShort + FormatRate(row.PickRate));\n            if (row.Games.HasValue) parts.Add(row.Games.Value.ToString("N0", CultureInfo.InvariantCulture) + MayhemUiCopy.GamesSuffix);\n            return string.Join(MayhemUiCopy.SeparatorDot, parts);\n        }\n\n        private async Task LoadAugmentIconAsync(PictureBox target, string reference, int generation)\n        {\n            try\n            {\n                var bitmap = await _controller.LoadGuideAssetAsync(reference, _lifetime.Token);\n                if (bitmap == null) return;\n                if (IsDisposed || target.IsDisposed || generation != _augmentRenderGeneration)\n                {\n                    bitmap.Dispose();\n                    return;\n                }\n                _ownedAugmentIcons.Add(bitmap);\n                target.Image = bitmap;\n            }\n            catch (OperationCanceledException) { }\n            catch (ObjectDisposedException) { }\n            catch { }\n        }\n\n        private void DisposeAugmentRows()\n        {\n            _augmentRenderGeneration++;\n            var controls = _augmentRows.Controls.Cast<Control>().ToArray();\n            _augmentRows.Controls.Clear();\n            foreach (var control in controls) control.Dispose();\n            foreach (var image in _ownedAugmentIcons) image.Dispose();\n            _ownedAugmentIcons.Clear();\n        }\n\n        private void ClearAugments()\n        {\n            _augmentSource = Array.Empty<MayhemAugmentRow>();\n            _augmentPage = 0;\n            DisposeAugmentRows();\n            _augmentPageLabel.Text = string.Empty;\n            _augmentPrevButton.Enabled = false;\n            _augmentNextButton.Enabled = false;\n        }\n\n        private async Task ResolveGuideChampionNameAsync(int championId)\n        {\n            try\n            {\n                var name = await _controller.ResolveChampionNameAsync(championId, _lifetime.Token);\n                if (string.IsNullOrWhiteSpace(name) || IsDisposed || championId != _renderedGuideChampionId) return;\n                _championTitle.Text = name;\n            }\n            catch (OperationCanceledException) { }\n            catch (ObjectDisposedException) { }\n            catch { }\n        }\n\n'''
          text = replace_once(text, marker, helper + marker, 'augment helper insertion')

          # Header indicator tooltip carries full text.
          text = replace_once(text,
              '''        private void SetStatus(string text, Color color)\n        {\n            _status.Text = text ?? string.Empty;\n            _status.ForeColor = color;\n        }\n''',
              '''        private void SetStatus(string text, Color color)\n        {\n            var detail = text ?? string.Empty;\n            _status.Text = char.ConvertFromUtf32(0x25CF);\n            _status.ForeColor = color;\n            if (_toolTip != null) _toolTip.SetToolTip(_status, detail);\n        }\n''',
              'semantic status dot')

          # Ensure custom row-owned images are disposed on close.
          text = replace_once(text,
              '            DetachChampionImage();\n            foreach (var bitmap in _championIcons.Values) bitmap.Dispose();\n',
              '            DetachChampionImage();\n            ClearAugments();\n            foreach (var bitmap in _championIcons.Values) bitmap.Dispose();\n',
              'augment image disposal')

          # Smoke contract now rejects returning to native table/scrollbar design.
          text = replace_once(text,
              '''            if (AugmentColumnTotalWidth > BodyContentWidth)\n                throw new InvalidOperationException("Runtime Companion augment table would require horizontal scrolling at the design width.");\n''',
              '''            if (AugmentColumnTotalWidth > BodyContentWidth)\n                throw new InvalidOperationException("Runtime Companion compact content width contract drifted.");\n            if (AugmentPageSize < 4 || AugmentRowHeight < 32 || BenchPageSize < 4)\n                throw new InvalidOperationException("Runtime Companion compact paging density regressed.");\n''',
              'compact paging smoke')

          if 'new ListView' in text or '_augments.' in text:
              raise SystemExit('native augment ListView survived readability patch')
          write(path, text)

          # Durable design contract: visual completeness outranks merely fitting the rectangle.
          path = 'docs/RUNTIME-COMPANION-DESIGN.md'
          text = read(path)
          anchor = 'The fixed top region must not scroll. The detail body may scroll vertically and must not expose a normal horizontal scrollbar at supported widths.\n'
          addition = anchor + '''\n### Live readability acceptance\n\nCompactness must not be achieved by clipping the primary recommendation, exposing raw internal champion IDs, or compressing a desktop data table until its columns become unreadable. At the 320 px baseline, the primary line must carry the recommendation and the secondary line may carry source metrics; full detail can remain in tooltip/progressive disclosure.\n\nThe transient runtime surface must not expose native light-themed WinForms scrollbars or Details-view headers against the dark FACM shell. Bench selection uses bounded local paging when it cannot fit. Mayhem augments use FACM-native compact icon rows with local paging; unavailable metrics are omitted instead of filling columns with repeated `—` / `unknown` placeholders. This keeps the Akari-inspired runtime reading model without importing Akari branding or a web runtime.\n'''
          text = replace_once(text, anchor, addition, 'live readability contract')
          write(path, text)
          PY

      - name: Commit readability pass and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-akari-readability.yml
          git add src/FACM/League/LeagueRuntimeCompanionForm.cs \
                  src/FACM/League/LeagueRuntimeCompanionController.cs \
                  src/FACM/League/LeagueRuntimeCompanionUiText.cs \
                  src/FACM/Mayhem/RiotGameDataService.cs \
                  docs/RUNTIME-COMPANION-DESIGN.md
          git commit -m "Refine Runtime Companion Akari readability"
          git push origin HEAD:feat/runtime-companion-20260910
