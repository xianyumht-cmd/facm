name: Runtime Companion One-Shot Mode Fix

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix cancellation fence and reconcile mode contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def change(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: missing anchor: {label}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          change(
              'src/FACM/League/LeagueRuntimeCompanionController.cs',
              '''            lock (_stateGate)\n            {\n                request = _guideRequest;\n                _guideRequest = null;\n                if (_guideRequest == null && _guideChampionId == 0 && _guideKind == LeagueRuntimeCompanionGuideKind.None) return;\n                _guideChampionId = 0;\n''',
              '''            lock (_stateGate)\n            {\n                if (_guideRequest == null && _guideChampionId == 0 && _guideKind == LeagueRuntimeCompanionGuideKind.None) return;\n                request = _guideRequest;\n                _guideRequest = null;\n                _guideChampionId = 0;\n''',
              'cancel request lifetime')

          change(
              'docs/ARCHITECTURE.md',
              '''- base ARAM balance is supplementary presentation data. `RiotGameDataService.EnrichAsync` is the single automatic-guide enrichment owner: it starts `OpggAramBaseBalanceService.EnrichAsync` once in parallel with visual metadata, using that service's bounded ten-minute complete-result cache. `MayhemAutomaticGuideService` must not pre-call the balance service and then call Riot enrichment again.\n- the companion renders base ARAM balance only when a real `BaseBalanceSummary` exists. `syncing`/`unavailable` states remain explicit warning states; missing data is omitted rather than rendered as a fake `0` or `no modifier` result.\n''',
              '''- base ARAM balance is supplementary presentation data. `RiotGameDataService.EnrichAsync` is the single full-Mayhem enrichment owner: it starts `OpggAramBaseBalanceService.EnrichAsync` once in parallel with visual metadata, using that service's bounded ten-minute complete-result cache. `MayhemAutomaticGuideService` must not pre-call the balance service and then call Riot enrichment again.\n- Bench availability is not a game-mode classifier. `LeagueQueueModePolicy` separates ordinary ARAM (queue 450 / ARAM) from ARAM Mayhem (observed global queue 2400, CN/WeGame queue 3270, or KIWI/ARAM_MAYHEM mode tokens). Ordinary ARAM requests only its version-bound base-balance supplement; Mayhem uses the full Mayhem guide/augment pipeline. Unsupported Bench modes fail closed instead of displaying Mayhem data.\n- the companion renders base ARAM balance only when a real `BaseBalanceSummary` exists. `syncing`/`unavailable` states remain explicit warning states; missing data is omitted rather than rendered as a fake `0` or `no modifier` result.\n''',
              'architecture mode ownership')

          pit = Path('docs/PITFALLS.md')
          pit_text = pit.read_text(encoding='utf-8')
          if '## Bench availability is not proof of ARAM Mayhem\n' not in pit_text:
              anchor = '''## Do not enrich the same ARAM balance twice\n\n`RiotGameDataService.EnrichAsync` already starts the bounded `OpggAramBaseBalanceService` task in parallel with visual metadata. Calling the same balance service in `MayhemAutomaticGuideService` immediately before Riot enrichment looks harmless when a complete result hits the ten-minute cache, but an unavailable result can cause a second external attempt and lengthen the visible failure path.\n\nKeep one automatic-guide enrichment owner. The Runtime Companion should render the resulting `BaseBalanceSummary`; it must not create another balance fetch loop merely because the data has a new visible section.\n\n'''
              addition = anchor + '''## Bench availability is not proof of ARAM Mayhem\n\nOrdinary ARAM and ARAM Mayhem can both expose Bench. Starting the full Mayhem guide whenever `benchEnabled=true` leaks Mayhem-only augments/data into normal ARAM and wastes external requests. Classify the queue first: current Runtime Companion policy recognizes base ARAM separately from global/CN Mayhem queue identifiers and mode tokens, and unknown Bench queues fail closed.\n\nBase ARAM should wait for the matching Build Advisor version before requesting its balance-only supplement so patch mismatch remains visible instead of silently accepting stale values.\n\n'''
              if anchor not in pit_text:
                  raise SystemExit('PITFALLS mode anchor missing')
              pit.write_text(pit_text.replace(anchor, addition, 1), encoding='utf-8', newline='\n')

          decisions = Path('docs/DECISIONS.md')
          decisions_text = decisions.read_text(encoding='utf-8')
          if '## D-018 — Bench availability does not define ARAM Mayhem\n' not in decisions_text:
              decisions_text = decisions_text.rstrip() + '''\n\n## D-018 — Bench availability does not define ARAM Mayhem\n\n**Decision (2026-09-10, PR #283):** mode-specific Runtime Companion data must be selected from queue/mode context, not from `benchEnabled` alone.\n\n- ordinary ARAM remains queue 450 / ARAM and uses Build Advisor plus a version-bound base-ARAM balance-only supplement;\n- ARAM Mayhem is recognized separately by observed global queue 2400, CN/WeGame queue 3270, or `KIWI` / `ARAM_MAYHEM` mode tokens and may use the full Mayhem build/augment pipeline;\n- Bench remains only a capability signal for quick swap; it is not sufficient evidence that Mayhem-only recommendations apply;\n- unsupported or unrecognized Bench modes fail closed and do not start Mayhem external work;\n- ordinary ARAM waits for its matching Build Advisor version before the balance request so the base-balance parser can retain patch-mismatch semantics.\n\nThis prevents a UI similarity feature from changing data truth: normal ARAM must never show Mayhem augments merely because both modes have a Bench.\n'''
              decisions.write_text(decisions_text, encoding='utf-8', newline='\n')

          change(
              'docs/PROJECT_STATE.md',
              '''- Bench 快速换英雄继续走 `LeagueBenchQuickPickService`；Mayhem 海克斯强化继续只在真实数据可用时显示。普通空状态不生成装饰性 N/A 卡片。\n''',
              '''- Bench 快速换英雄继续走 `LeagueBenchQuickPickService`，但 `benchEnabled` 不再被当作 Mayhem 证明。`LeagueQueueModePolicy` 将普通 ARAM（450/ARAM）与 Mayhem（2400、CN/WeGame 3270、KIWI/ARAM_MAYHEM）分开：普通 ARAM 只读取版本绑定的基础平衡补充，Mayhem 才启动完整攻略/强化链；未知 Bench 模式 fail closed。普通空状态不生成装饰性 N/A 卡片。\n''',
              'project state mode separation')
          PY

      - name: Commit mode fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No mode fix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FACM/League/LeagueRuntimeCompanionController.cs docs/ARCHITECTURE.md docs/DECISIONS.md docs/PITFALLS.md docs/PROJECT_STATE.md
          git commit -m "Harden Runtime Companion mode routing"
          git push origin HEAD:feat/runtime-companion-20260910
