name: Runtime Companion Guide Lifecycle Hardening

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden guide routing and stale presentation cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              changed = False
              for old, new, label in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f'{path}: missing anchor: {label}')
                  text = text.replace(old, new, 1)
                  changed = True
              if changed:
                  p.write_text(text, encoding='utf-8', newline='\n')

          patch('src/FACM/League/LeagueRuntimeCompanionController.cs', [
              (
                  '''        public static LeagueRuntimeCompanionGuideKind Resolve(bool sessionAvailable, bool benchEnabled, int queueId, string gameMode)\n        {\n            if (!sessionAvailable || !benchEnabled) return LeagueRuntimeCompanionGuideKind.None;\n''',
                  '''        public static LeagueRuntimeCompanionGuideKind Resolve(bool sessionAvailable, int queueId, string gameMode)\n        {\n            // Bench availability is independent from guide relevance. Base ARAM and Mayhem still\n            // need their contextual guide when the current client exposes a valid ChampSelect\n            // session/champion but no swappable bench row.\n            if (!sessionAvailable) return LeagueRuntimeCompanionGuideKind.None;\n''',
                  'mode policy independence from Bench'),
              (
                  '''                var guideKind = LeagueRuntimeCompanionModePolicy.Resolve(\n                    sessionAvailable,\n                    state != null && state.BenchEnabled,\n                    state == null ? 0 : state.QueueId,\n''',
                  '''                var guideKind = LeagueRuntimeCompanionModePolicy.Resolve(\n                    sessionAvailable,\n                    state == null ? 0 : state.QueueId,\n''',
                  'mode policy call'),
              (
                  '''            if (LeagueRuntimeCompanionModePolicy.Resolve(true, true, 450, "ARAM") != LeagueRuntimeCompanionGuideKind.AramBalance)\n                throw new InvalidOperationException("Runtime Companion base ARAM routing regressed.");\n            if (LeagueRuntimeCompanionModePolicy.Resolve(true, true, 2400, null) != LeagueRuntimeCompanionGuideKind.Mayhem ||\n                LeagueRuntimeCompanionModePolicy.Resolve(true, true, 3270, "KIWI") != LeagueRuntimeCompanionGuideKind.Mayhem)\n                throw new InvalidOperationException("Runtime Companion ARAM Mayhem routing regressed.");\n            if (LeagueRuntimeCompanionModePolicy.Resolve(true, true, 420, "CLASSIC") != LeagueRuntimeCompanionGuideKind.None ||\n                LeagueRuntimeCompanionModePolicy.Resolve(true, false, 3270, "KIWI") != LeagueRuntimeCompanionGuideKind.None)\n                throw new InvalidOperationException("Runtime Companion guide routing leaked into an unsupported context.");\n''',
                  '''            if (LeagueRuntimeCompanionModePolicy.Resolve(true, 450, "ARAM") != LeagueRuntimeCompanionGuideKind.AramBalance)\n                throw new InvalidOperationException("Runtime Companion base ARAM routing regressed.");\n            if (LeagueRuntimeCompanionModePolicy.Resolve(true, 2400, null) != LeagueRuntimeCompanionGuideKind.Mayhem ||\n                LeagueRuntimeCompanionModePolicy.Resolve(true, 3270, "KIWI") != LeagueRuntimeCompanionGuideKind.Mayhem)\n                throw new InvalidOperationException("Runtime Companion ARAM Mayhem routing regressed.");\n            if (LeagueRuntimeCompanionModePolicy.Resolve(true, 420, "CLASSIC") != LeagueRuntimeCompanionGuideKind.None ||\n                LeagueRuntimeCompanionModePolicy.Resolve(false, 3270, "KIWI") != LeagueRuntimeCompanionGuideKind.None)\n                throw new InvalidOperationException("Runtime Companion guide routing leaked into an unsupported context.");\n''',
                  'mode policy smoke expectations')
          ])

          patch('src/FACM/League/LeagueRuntimeCompanionForm.cs', [
              (
                  '''            public Panel Rule { get; set; }\n            public bool Expanded { get; set; }\n''',
                  '''            public Panel Rule { get; set; }\n            public bool Expanded { get; set; }\n            public bool GuideFallback { get; set; }\n''',
                  'recommendation ownership marker'),
              (
                  '''            if (snapshot.HasGuide && !ReferenceEquals(_renderedGuide, snapshot.Guide))\n            {\n                _renderedGuide = snapshot.Guide;\n                RenderGuideFallbackAndAugments(snapshot.Guide, snapshot.Build != null);\n            }\n\n            if (!hasContext)\n''',
                  '''            if (snapshot.HasGuide && !ReferenceEquals(_renderedGuide, snapshot.Guide))\n            {\n                _renderedGuide = snapshot.Guide;\n                RenderGuideFallbackAndAugments(snapshot.Guide, snapshot.Build != null);\n            }\n            else if (!snapshot.HasGuide && !snapshot.GuideLoading && _renderedGuide != null)\n            {\n                // A guide can disappear because the queue/mode changed, the champion context was\n                // invalidated, or a version-bound refresh failed. Never leave the previous mode's\n                // ARAM/Mayhem presentation visible after the controller has withdrawn that guide.\n                _renderedGuide = null;\n                _renderedGuideChampionId = snapshot.GuideChampionId;\n                ClearGuidePresentation();\n            }\n\n            if (!hasContext)\n''',
                  'stale guide cleanup on withdrawn snapshot'),
              (
                  '''            section.Rows = usable;\n            if (usable.Count == 0)\n''',
                  '''            section.Rows = usable;\n            section.GuideFallback = false;\n            if (usable.Count == 0)\n''',
                  'build rows own recommendation section'),
              (
                  '''            section.Rows = Array.Empty<LeagueBuildAdvisorRow>();\n            section.Expanded = false;\n''',
                  '''            section.Rows = Array.Empty<LeagueBuildAdvisorRow>();\n            section.Expanded = false;\n            section.GuideFallback = false;\n''',
                  'reset guide fallback marker'),
              (
                  '''            section.Rows = new List<LeagueBuildAdvisorRow>\n            {\n                new LeagueBuildAdvisorRow { Category = section.Category, Recommendation = value }\n            }.AsReadOnly();\n        }\n\n        private void ResetRecommendationSections()\n''',
                  '''            section.Rows = new List<LeagueBuildAdvisorRow>\n            {\n                new LeagueBuildAdvisorRow { Category = section.Category, Recommendation = value }\n            }.AsReadOnly();\n            section.GuideFallback = true;\n        }\n\n        private void ClearGuidePresentation()\n        {\n            _aramBalanceSection.Visible = false;\n            _aramBalanceText.Text = string.Empty;\n            _mayhemSection.Visible = false;\n            _augments.Items.Clear();\n            foreach (var section in RecommendationSections())\n            {\n                if (section.GuideFallback) HideRecommendationSection(section);\n            }\n        }\n\n        private void ResetRecommendationSections()\n''',
                  'guide fallback cleanup helper')
          ])

          patch('docs/ARCHITECTURE.md', [
              (
                  '''- Bench swaps reuse `LeagueBenchQuickPickService`. Explicit rune/summoner-spell actions reuse `LeagueBuildApplyService`; the first source row remains the apply default and the existing owner retains phase/champion/queue revalidation plus settled postcondition verification.\n''',
                  '''- Bench swaps reuse `LeagueBenchQuickPickService`. Bench availability controls only the quick-swap strip; it does not gate ARAM/Mayhem guide relevance when a valid ChampSelect session/champion is already known. Explicit rune/summoner-spell actions reuse `LeagueBuildApplyService`; the first source row remains the apply default and the existing owner retains phase/champion/queue revalidation plus settled postcondition verification.\n''',
                  'architecture Bench/guide independence')
          ])

          patch('docs/PROJECT_STATE.md', [
              (
                  '''- Bench 快速换英雄继续走 `LeagueBenchQuickPickService`；Mayhem 海克斯强化继续只在真实数据可用时显示。普通空状态不生成装饰性 N/A 卡片。\n''',
                  '''- Bench 快速换英雄继续走 `LeagueBenchQuickPickService`，但 Bench 是否可换只控制快速换英雄条，不再作为 ARAM/Mayhem 攻略是否相关的前置条件；只要 ChampSelect session、英雄与模式有效，普通 ARAM 平衡或 Mayhem 攻略仍可加载。Mayhem 海克斯强化继续只在真实数据可用时显示。普通空状态不生成装饰性 N/A 卡片。\n- Guide snapshot 被撤回、模式切换或版本绑定刷新失败时，Runtime Companion 会清除上一份 ARAM/Mayhem 专属展示；只有被 guide fallback 实际占用的推荐行会被回收，不会误删 Build Advisor 已接管的普通推荐行。\n''',
                  'project state guide lifecycle hardening')
          ])
          PY

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-guide-lifecycle-hardening.yml
          git add src/FACM/League/LeagueRuntimeCompanionController.cs src/FACM/League/LeagueRuntimeCompanionForm.cs docs/ARCHITECTURE.md docs/PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "No guide lifecycle hardening changes to commit."
            exit 0
          fi
          git commit -m "Harden Runtime Companion guide lifecycle"
          git push origin HEAD:feat/runtime-companion-20260910
