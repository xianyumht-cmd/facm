name: GGman Glass WebView2 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FACM/Presentation/Glass/**'
      - 'src/FACM/FACM.csproj'
      - 'src/FACM/Program.cs'
      - 'scripts/Start-Glass-Preview.cmd'
      - '.github/workflows/glass-workbench-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build isolated WebView2 candidate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify approved design source
        shell: pwsh
        run: |
          $html = 'src/FACM/Presentation/Glass/GGman-Glass-Prototype.html'
          if ((Get-Item $html).Length -ne 49991) {
            throw 'Approved Glass source byte length differs from visual baseline.'
          }
          $actual = (Get-FileHash $html -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '57407b7eb56181ec83f96c646ffd144db6eb9075f377288304f489218bfe9460'
          if ($actual -ne $expected) {
            throw 'Approved Glass source SHA256 differs from visual baseline.'
          }
      - name: Build optional Glass workbench
        shell: pwsh
        run: |
          msbuild FACM.sln /restore /m /p:Configuration=Release /p:Platform="Any CPU" /p:UseGlassWorkbenchPreview=true /p:ContinuousIntegrationBuild=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Glass candidate build failed.' }

      - name: Verify candidate package contents
        shell: pwsh
        run: |
          $output = 'src/FACM/bin/Release/net48'
          $required = @(
            'GGman.exe',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll'
          )
          foreach ($name in $required) {
            $file = Join-Path $output $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Candidate runtime asset missing: $file"
            }
          }
          # net48 AnyCPU with Prefer32Bit=false runs as x64 on supported Win10 x64.
          # The SDK may place an x86 loader in the root output. Select by PE machine,
          # not file name or size; the wrong architecture fails with HRESULT 0x8007000B.
          function Get-PeMachine([string] $path) {
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($stream.Length -lt 64) { throw "Invalid PE file: $path" }
              $stream.Position = 0x3C
              $offset = $reader.ReadInt32()
              if ($offset -lt 0 -or ($offset + 6) -gt $stream.Length) {
                throw "Invalid PE header offset: $path"
              }
              $stream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature: $path" }
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }
          $nuget = Join-Path $env:USERPROFILE '.nuget/packages/microsoft.web.webview2/1.0.4258.31'
          if (-not (Test-Path $nuget)) { throw "WebView2 NuGet package missing: $nuget" }
          $loaderPath = Join-Path $nuget 'runtimes/win-x64/native/WebView2Loader.dll'
          if (-not (Test-Path -LiteralPath $loaderPath -PathType Leaf)) {
            throw "Pinned WebView2 NuGet win-x64 loader path not found: $loaderPath"
          }
          if ((Get-PeMachine $loaderPath) -ne 0x8664) {
            throw 'Pinned WebView2 runtime loader is not AMD64.'
          }
          $exeSize = (Get-Item (Join-Path $output 'GGman.exe')).Length
          Write-Host "Candidate EXE bytes (not including runtime dependencies): $exeSize"
          New-Item -ItemType Directory -Path artifacts/Glass-Preview -Force | Out-Null
          Copy-Item -Path (Join-Path $output '*') -Destination artifacts/Glass-Preview -Recurse -Force
          $rootLoader = 'artifacts/Glass-Preview/WebView2Loader.dll'
          Copy-Item -LiteralPath $loaderPath -Destination $rootLoader -Force
          if ((Get-PeMachine $rootLoader) -ne 0x8664) {
            throw 'Packaged root WebView2Loader is not x64.'
          }
          Write-Host "Packaged native loader: x64; $((Get-Item $rootLoader).Length) bytes"
          # Remove copied x86 runtime assets: the pilot is intentionally x64-only.
          $x86Runtime = 'artifacts/Glass-Preview/runtimes/win-x86'
          if (Test-Path $x86Runtime) { Remove-Item $x86Runtime -Force -Recurse }
          Copy-Item scripts/Start-Glass-Preview.cmd artifacts/Glass-Preview/Start-Glass-Preview.cmd
          $instructions = @'
          Experimental preview, unsigned. Not a normal GGman release.
          The visual preview runs separately from the official GGman instance.
          Extract all files to a separate folder. Double-click Start-Glass-Preview.cmd,
          to start the standalone frameless Glass renderer. No tray or cloud services start.
          This candidate is x64 only; its root WebView2Loader.dll is verified as PE AMD64.\n          WebView2 Evergreen Runtime must already be installed. No automatic installation.
          The glass screen contains only demonstration data and does not operate CloudBase,
          live League matches, accounts, files, automatic updates or real game settings.
          For rollback, close this preview window. The official GGman need not exit.
          '@
          $instructions | Set-Content artifacts/Glass-Preview/README.txt -Encoding UTF8
          (Get-FileHash (Join-Path $output 'GGman.exe') -Algorithm SHA256).Hash |
            Set-Content artifacts/Glass-Preview/SHA256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: GGman-Glass-WebView2-Unsigned
          path: artifacts/Glass-Preview/
          if-no-files-found: error
          retention-days: 7
