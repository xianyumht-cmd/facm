name: Runtime Companion UI Text Unit Fix

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route numeric units through localized titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          form = Path('src/FACM/League/LeagueEfficiencyForm.cs')
          text = form.read_text(encoding='utf-8')
          replacements = {
              '_module.AutoMatchmakingMinPartySize, "人")': '_module.AutoMatchmakingMinPartySize, string.Empty)',
              '_module.AutoMatchmakingStartDelayMs / 1000m, "秒")': '_module.AutoMatchmakingStartDelayMs / 1000m, string.Empty)',
              '_module.AutoAcceptDelayMs / 1000m, "秒")': '_module.AutoAcceptDelayMs / 1000m, string.Empty)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing form anchor: ' + old)
              text = text.replace(old, new, 1)
          form.write_text(text, encoding='utf-8', newline='\n')

          ui = Path('src/FACM/League/LeagueEfficiencyUiText.cs')
          text = ui.read_text(encoding='utf-8')
          replacements = {
              '{ LeagueEfficiencyUiTextKeys.MinPartySize, "自动排队最低人数" }': '{ LeagueEfficiencyUiTextKeys.MinPartySize, "自动排队最低人数（人）" }',
              '{ LeagueEfficiencyUiTextKeys.MatchmakingDelay, "排队前等待" }': '{ LeagueEfficiencyUiTextKeys.MatchmakingDelay, "排队前等待（秒）" }',
              '{ LeagueEfficiencyUiTextKeys.AcceptDelay, "接受对局延迟" }': '{ LeagueEfficiencyUiTextKeys.AcceptDelay, "接受对局延迟（秒）" }',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing ui anchor: ' + old)
              text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-ui-text-units.yml
          git add src/FACM/League/LeagueEfficiencyForm.cs src/FACM/League/LeagueEfficiencyUiText.cs
          git commit -m "Fix localized automation unit labels"
          git push origin HEAD:feat/runtime-companion-20260910
