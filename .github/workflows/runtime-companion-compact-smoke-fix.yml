name: Runtime Companion Compact Smoke Fix

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align smoke contract with intentionally scrollable compact window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/FACM/League/LeagueRuntimeCompanionForm.cs')
          text = path.read_text(encoding='utf-8')

          old = '''        private const int RecommendationBaseHeight = 64;\n        private const int AlternativeRowHeight = 36;\n'''
          new = '''        private const int RecommendationBaseHeight = 64;\n        private const int MoreButtonTop = 33;\n        private const int MoreButtonHeight = 24;\n        private const int AlternativeRowHeight = 36;\n'''
          if old not in text:
              raise SystemExit('missing recommendation constants anchor')
          text = text.replace(old, new, 1)

          old = '            var more = CreateInlineButton(string.Empty, new Point(8, 33), new Size(58, 24));\n'
          new = '            var more = CreateInlineButton(string.Empty, new Point(8, MoreButtonTop), new Size(58, MoreButtonHeight));\n'
          if old not in text:
              raise SystemExit('missing more button geometry anchor')
          text = text.replace(old, new, 1)

          old = '''            var mayhemFirstViewport = MaximumExpandedHeight - HeaderHeight - ContextHeight - BenchHeight;\n            var mayhemFirstStack = (5 * RecommendationBaseHeight) + 58 + 6; // five Mayhem build rows + ARAM row + body vertical padding\n            if (mayhemFirstStack > mayhemFirstViewport)\n                throw new InvalidOperationException("Runtime Companion Mayhem first viewport clips the ARAM balance row.");\n'''
          new = '''            var compactBodyViewport = MaximumExpandedHeight - HeaderHeight - ContextHeight - BenchHeight;\n            if (MaximumExpandedHeight != 420 || MinimumExpandedHeight != 360 || compactBodyViewport < RecommendationBaseHeight * 3)\n                throw new InvalidOperationException("Runtime Companion compact vertical footprint no longer leaves a useful scroll body.");\n            if (MoreButtonHeight < 22 || MoreButtonTop < 0 || MoreButtonTop + MoreButtonHeight > RecommendationBaseHeight - 1)\n                throw new InvalidOperationException("Runtime Companion progressive-disclosure control is vertically clipped inside its recommendation row.");\n            // The 420 px Akari-style surface intentionally does not force every Mayhem module into the first viewport.\n            // Lower build/ARAM/augment content is reached through the existing body wheel scroll; module-local geometry\n            // must remain valid, but total content height is allowed to exceed compactBodyViewport.\n'''
          if old not in text:
              raise SystemExit('missing stale Mayhem first-viewport smoke anchor')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit smoke correction and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-compact-smoke-fix.yml
          git add src/FACM/League/LeagueRuntimeCompanionForm.cs
          git commit -m "Align Runtime Companion compact smoke contract"
          git push origin HEAD:feat/runtime-companion-20260910
