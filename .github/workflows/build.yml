name: Build FACM

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FACM.sln

      - name: Build
        run: dotnet build FACM.sln -c Release --no-restore --warnaserror

      - name: Publish release
        shell: powershell
        run: .\scripts\build-release.ps1

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: FACM-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
