name: build-facm-self-signed-test

on:
  push:
    branches: ["codex/facm-self-signed-build-20260806"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: FACM.sln
  OUTPUT_EXE: src\FACM\bin\Release\net48\FACM.exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: pwsh
        run: |
          msbuild $env:SOLUTION /restore /m /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
          if (-not (Test-Path $env:OUTPUT_EXE)) {
            throw "Build output not found: $env:OUTPUT_EXE"
          }

      - name: Upload unsigned build for signing job
        uses: actions/upload-artifact@v4
        with:
          name: facm-unsigned-${{ github.run_id }}
          path: ${{ env.OUTPUT_EXE }}
          if-no-files-found: error

  sign-linux:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout metadata
        uses: actions/checkout@v4

      - name: Download unsigned build
        uses: actions/download-artifact@v4
        with:
          name: facm-unsigned-${{ github.run_id }}
          path: input

      - name: Install Authenticode signer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode

      - name: Create self-signed certificate and sign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts signing

          openssl req -x509 -newkey rsa:3072 -sha256 -days 1095 -nodes \
            -subj "/CN=FACM Self-Signed Test Publisher/O=FACM Development/" \
            -addext "keyUsage=digitalSignature" \
            -addext "extendedKeyUsage=codeSigning" \
            -keyout signing/FACM-Self-Signed.key \
            -out signing/FACM-Self-Signed-Test-Publisher.cer

          openssl pkcs12 -export \
            -inkey signing/FACM-Self-Signed.key \
            -in signing/FACM-Self-Signed-Test-Publisher.cer \
            -out signing/FACM-Self-Signed.pfx \
            -passout pass:facm-ci-self-signed

          osslsigncode sign \
            -pkcs12 signing/FACM-Self-Signed.pfx \
            -pass facm-ci-self-signed \
            -h sha256 \
            -n "FACM 2.0" \
            -i "https://github.com/xianyumht-cmd/facm" \
            -in input/FACM.exe \
            -out artifacts/FACM.exe

          osslsigncode verify \
            -CAfile signing/FACM-Self-Signed-Test-Publisher.cer \
            -in artifacts/FACM.exe | tee artifacts/SIGNATURE.txt

          sha256sum artifacts/FACM.exe | awk '{print "SHA256  " toupper($1) "  FACM.exe"}' > artifacts/SHA256.txt
          cp signing/FACM-Self-Signed-Test-Publisher.cer artifacts/
          cp README.md artifacts/
          cat > artifacts/SIGNING-MODE.txt <<'EOF'
          Self-signed Authenticode test certificate
          Publisher: FACM Self-Signed Test Publisher
          This certificate is not trusted by Windows by default and does not establish SmartScreen reputation.
          The private signing key is generated only inside the temporary CI runner and is not included in this package.
          EOF

          (cd artifacts && zip -9 ../FACM-2.0-self-signed-test.zip ./*)

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: FACM-2.0-self-signed-test
          path: |
            FACM-2.0-self-signed-test.zip
            artifacts/FACM.exe
            artifacts/SHA256.txt
            artifacts/SIGNATURE.txt
            artifacts/SIGNING-MODE.txt
            artifacts/FACM-Self-Signed-Test-Publisher.cer
          if-no-files-found: error
