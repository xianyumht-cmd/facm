name: build-facm-self-signed-test

on:
  push:
    branches: ["codex/facm-self-signed-build-20260806"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: FACM.sln
  OUTPUT_EXE: src\FACM\bin\Release\net48\FACM.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: pwsh
        run: |
          msbuild $env:SOLUTION /restore /m /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
          if (-not (Test-Path $env:OUTPUT_EXE)) {
            throw "Build output not found: $env:OUTPUT_EXE"
          }

      - name: Sign executable
        shell: powershell
        env:
          FACM_PFX_BASE64: ${{ secrets.FACM_PFX_BASE64 }}
          FACM_PFX_PASSWORD: ${{ secrets.FACM_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $expectedThumbprint = $null

          if (-not [string]::IsNullOrWhiteSpace($env:FACM_PFX_BASE64)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }

            $pfxPath = Join-Path $env:RUNNER_TEMP "facm-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:FACM_PFX_BASE64))
            try {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfxPath /p $env:FACM_PFX_PASSWORD $env:OUTPUT_EXE
              if ($LASTEXITCODE -ne 0) { throw "trusted certificate signing failed: $LASTEXITCODE" }
              "Trusted repository certificate" | Set-Content (Join-Path $artifactDir "SIGNING-MODE.txt") -Encoding UTF8
            }
            finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }
          else {
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=FACM Self-Signed Test Publisher" `
              -FriendlyName "FACM Self-Signed Test Publisher" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -HashAlgorithm SHA256 `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -NotAfter (Get-Date).AddYears(3)

            $expectedThumbprint = $cert.Thumbprint
            $cerPath = Join-Path $artifactDir "FACM-Self-Signed-Test-Publisher.cer"
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null

            $signed = Set-AuthenticodeSignature `
              -FilePath $env:OUTPUT_EXE `
              -Certificate $cert `
              -HashAlgorithm SHA256

            if (-not $signed.SignerCertificate) {
              throw "Set-AuthenticodeSignature did not embed a signer certificate"
            }

            @(
              "Self-signed Authenticode test certificate"
              "Publisher: FACM Self-Signed Test Publisher"
              "This certificate is not trusted by Windows by default and does not establish SmartScreen reputation."
            ) | Set-Content (Join-Path $artifactDir "SIGNING-MODE.txt") -Encoding UTF8
          }

          $signature = Get-AuthenticodeSignature $env:OUTPUT_EXE
          if (-not $signature.SignerCertificate) {
            throw "EXE has no embedded Authenticode signer certificate"
          }
          if ($expectedThumbprint -and $signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
            throw "Signer thumbprint mismatch"
          }
          if ($signature.Status -ne "Valid") {
            throw "Offline Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Signature valid: $($signature.SignerCertificate.Subject) [$($signature.SignerCertificate.Thumbprint)]"

      - name: Verify metadata and create package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "artifacts"
          Copy-Item $env:OUTPUT_EXE (Join-Path $artifactDir "FACM.exe") -Force
          $hash = Get-FileHash (Join-Path $artifactDir "FACM.exe") -Algorithm SHA256
          "SHA256  $($hash.Hash)  FACM.exe" | Set-Content (Join-Path $artifactDir "SHA256.txt") -Encoding ascii
          Get-AuthenticodeSignature (Join-Path $artifactDir "FACM.exe") | Format-List * | Out-File (Join-Path $artifactDir "SIGNATURE.txt") -Encoding utf8
          Copy-Item README.md (Join-Path $artifactDir "README.md")
          Compress-Archive -Path "$artifactDir\*" -DestinationPath "FACM-2.0-self-signed-test.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FACM-2.0-self-signed-test
          path: |
            FACM-2.0-self-signed-test.zip
            artifacts/FACM.exe
            artifacts/SHA256.txt
            artifacts/SIGNATURE.txt
            artifacts/SIGNING-MODE.txt
            artifacts/FACM-Self-Signed-Test-Publisher.cer
          if-no-files-found: error
