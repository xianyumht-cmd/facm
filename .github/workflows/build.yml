name: FACM Windows Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'docs/**'
      - 'FACM.sln'
      - 'README.md'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'docs/**'
      - 'FACM.sln'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facm-windows-build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  SOLUTION: FACM.sln
  OUTPUT_EXE: src\FACM\bin\Release\net48\FACM.exe
  PETHOST_PROJECT: src\FACM.PetHost\FACM.PetHost.csproj
  PETHOST_PUBLISH: out\PetHostPublish
  PACKAGE_NAME: FACM-Windows-x64

jobs:
  build:
    name: Build FACM + VPet PetHost
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify tool inputs
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD 'tools/EXTRACTED-TOOLS.json'
          if (-not (Test-Path $manifestPath)) {
            throw "Missing tool manifest: $manifestPath"
          }

          $manifest = Get-Content $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $manifest.files -or $manifest.files.Count -lt 1) {
            throw 'Tool manifest contains no files.'
          }

          foreach ($entry in $manifest.files) {
            $path = Join-Path $PWD ('tools/' + [string]$entry.name)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing tool input: $($entry.name)"
            }

            $item = Get-Item -LiteralPath $path
            if ($item.Length -ne [long]$entry.size) {
              throw "Size mismatch for $($entry.name): expected $($entry.size), actual $($item.Length)"
            }

            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actualHash -ne [string]$entry.sha256) {
              throw "SHA-256 mismatch for $($entry.name)"
            }
            Write-Host "Verified $($entry.name) ($($item.Length) bytes)"
          }

      - name: Report cleanup configuration state
        shell: pwsh
        run: |
          $profilePath = Join-Path $PWD 'src/FACM/Configuration/CleanupProfile.cs'
          if (-not (Test-Path $profilePath)) {
            throw "Missing cleanup configuration: $profilePath"
          }

          $profile = Get-Content $profilePath -Raw -Encoding utf8
          if ($profile -match 'REPLACE_[A-Z0-9_]+') {
            Write-Warning 'CleanupProfile.cs still contains REPLACE_ placeholders. FACM will build, but cleanup stays disabled until the developer fills them in.'
          }
          else {
            Write-Host 'CleanupProfile.cs contains no REPLACE_ placeholders.'
          }

      - name: Restore and build Release
        shell: pwsh
        run: |
          msbuild $env:SOLUTION /restore /m /p:Configuration=Release /p:Platform="Any CPU" /p:ContinuousIntegrationBuild=true /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $env:OUTPUT_EXE -PathType Leaf)) {
            throw "Build output not found: $env:OUTPUT_EXE"
          }

      - name: Publish and self-test VPet PetHost
        shell: pwsh
        run: |
          $publish = Join-Path $PWD $env:PETHOST_PUBLISH
          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          dotnet publish $env:PETHOST_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -o $publish
          if ($LASTEXITCODE -ne 0) {
            throw "PetHost publish failed with exit code $LASTEXITCODE"
          }

          $hostExe = Join-Path $publish 'FACM.PetHost.exe'
          if (-not (Test-Path $hostExe -PathType Leaf)) {
            throw "PetHost executable not found: $hostExe"
          }

          $selfTest = Start-Process -FilePath $hostExe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            $errorFile = Join-Path $env:LOCALAPPDATA 'FACM\PetHost\self-test-error.txt'
            if (Test-Path $errorFile) {
              Get-Content $errorFile -Raw | Write-Host
            }
            throw "PetHost self-test failed with exit code $($selfTest.ExitCode)"
          }
          Write-Host "PetHost self-test passed: $hostExe"

      - name: Verify FACM.exe
        id: verify
        shell: pwsh
        run: |
          $exe = (Resolve-Path $env:OUTPUT_EXE).Path
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Build output is not a valid Windows PE executable.'
          }

          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ([string]::IsNullOrWhiteSpace($version.FileVersion)) {
            throw 'FACM.exe has no file version metadata.'
          }
          if ($version.ProductName -ne 'FACM') {
            throw "Unexpected product name: $($version.ProductName)"
          }

          $resourceVerifier = Join-Path $env:RUNNER_TEMP 'verify-facm-resources.ps1'
          @'
          param([Parameter(Mandatory=$true)][string]$ExePath)
          $ErrorActionPreference = 'Stop'
          $assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($ExePath)
          $assembly.GetManifestResourceNames()
          '@ | Set-Content -LiteralPath $resourceVerifier -Encoding utf8

          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $resources = @(
            & $windowsPowerShell `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File $resourceVerifier `
              -ExePath $exe
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Resource verification failed with exit code $LASTEXITCODE"
          }
          if ($resources -notcontains 'FACM.Resources.FACM.ToolBundle.dll') {
            throw 'FACM.ToolBundle.dll was not embedded into FACM.exe.'
          }

          "file_version=$($version.FileVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "product_version=$($version.ProductVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Built FACM.exe version $($version.FileVersion), size $($bytes.Length) bytes"
          Write-Host 'Verified embedded FACM.ToolBundle.dll resource.'

      - name: Sign when certificate secrets exist
        shell: pwsh
        env:
          FACM_PFX_BASE64: ${{ secrets.FACM_PFX_BASE64 }}
          FACM_PFX_PASSWORD: ${{ secrets.FACM_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FACM_PFX_BASE64)) {
            Write-Host 'FACM_PFX_BASE64 is not configured; publishing an unsigned build.'
            exit 0
          }

          & .\scripts\sign-ci.ps1 `
            -ExePath $env:OUTPUT_EXE `
            -PfxBase64 $env:FACM_PFX_BASE64 `
            -PfxPassword $env:FACM_PFX_PASSWORD

      - name: Create downloadable package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD 'artifacts'
          if (Test-Path $artifactDir) {
            Remove-Item $artifactDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDir | Out-Null

          $output = Join-Path $artifactDir 'FACM.exe'
          Copy-Item $env:OUTPUT_EXE $output -Force

          $petHostOutput = Join-Path $artifactDir 'PetHost'
          Copy-Item (Join-Path $PWD $env:PETHOST_PUBLISH) $petHostOutput -Recurse -Force
          $petHostExe = Join-Path $petHostOutput 'FACM.PetHost.exe'
          if (-not (Test-Path $petHostExe -PathType Leaf)) {
            throw "Packaged PetHost executable not found: $petHostExe"
          }

          $hash = Get-FileHash $output -Algorithm SHA256
          $petHostHash = Get-FileHash $petHostExe -Algorithm SHA256
          @(
            "$($hash.Hash) *FACM.exe",
            "$($petHostHash.Hash) *PetHost/FACM.PetHost.exe"
          ) | Set-Content (Join-Path $artifactDir 'SHA256.txt') -Encoding ascii

          $signature = Get-AuthenticodeSignature $output
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate |
            Out-File (Join-Path $artifactDir 'SIGNATURE.txt') -Encoding utf8

          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($output)
          $buildInfo = [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            run_number = '${{ github.run_number }}'
            file_version = $fileVersion.FileVersion
            product_version = $fileVersion.ProductVersion
            sha256 = $hash.Hash
            signature_status = [string]$signature.Status
            tool_bundle = 'embedded FACM.ToolBundle.dll'
            pet_host = 'self-contained .NET 8 x64 + VPet-Simulator.Core 1.1.0.66'
            pet_host_sha256 = $petHostHash.Hash
            vpet_assets = 'downloaded on first use; pinned upstream commit 6a6da4089e0706d8f0c61714f3c071fb2a2c268f'
            built_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $buildInfo | ConvertTo-Json | Set-Content (Join-Path $artifactDir 'BUILD-INFO.json') -Encoding utf8

          Copy-Item README.md (Join-Path $artifactDir 'README.md')
          Copy-Item docs\DEVELOPER-CLEANUP-CONFIG.md (Join-Path $artifactDir 'DEVELOPER-CLEANUP-CONFIG.md')
          Copy-Item docs\SIGNING.md (Join-Path $artifactDir 'SIGNING.md')
          if (Test-Path docs\ONLINE-MANAGEMENT.md) {
            Copy-Item docs\ONLINE-MANAGEMENT.md (Join-Path $artifactDir 'ONLINE-MANAGEMENT.md')
          }
          if (Test-Path docs\VPET-PETHOST.md) {
            Copy-Item docs\VPET-PETHOST.md (Join-Path $artifactDir 'VPET-PETHOST.md')
          }

          $zip = Join-Path $PWD ($env:PACKAGE_NAME + '.zip')
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zip -Force
          Write-Host "Package created: $zip"

      - name: Upload FACM package
        uses: actions/upload-artifact@v4
        with:
          name: FACM-Windows-x64-${{ github.run_number }}
          path: |
            FACM-Windows-x64.zip
            artifacts/FACM.exe
            artifacts/PetHost/FACM.PetHost.exe
            artifacts/SHA256.txt
            artifacts/SIGNATURE.txt
            artifacts/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 90
