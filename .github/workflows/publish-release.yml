name: FACM Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，例如 3.1.1'
        required: true
        type: string
      minimum_version:
        description: '允许继续运行的最低版本'
        required: true
        type: string
        default: '3.0.0'
      force_update:
        description: '强制低版本更新'
        required: true
        type: boolean
        default: false
      prerelease:
        description: '标记为预发布版本'
        required: true
        type: boolean
        default: false
      release_notes:
        description: '更新说明'
        required: true
        type: string
        default: '稳定性与功能更新。'
  push:
    branches:
      - main
    paths:
      - 'release/request.json'

permissions:
  contents: write

concurrency:
  group: facm-main-writer
  cancel-in-progress: false

env:
  SOLUTION: FACM.sln
  OUTPUT_EXE: src\FACM\bin\Release\net48\FACM.exe
  PETHOST_PROJECT: src\FACM.PetHost\FACM.PetHost.csproj
  PETHOST_PUBLISH: out\PetHostPublish
  PETHOST_BUNDLE: out\PetHostBundle.zip

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      MINIMUM_VERSION: ${{ inputs.minimum_version }}
      FORCE_UPDATE: ${{ inputs.force_update }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release request
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ne 'push') {
            Write-Host 'Using workflow_dispatch release inputs.'
            exit 0
          }

          $requestPath = 'release/request.json'
          if (-not (Test-Path $requestPath -PathType Leaf)) {
            throw "Release request file is missing: $requestPath"
          }
          $request = Get-Content $requestPath -Raw -Encoding utf8 | ConvertFrom-Json
          $version = [string]$request.version
          $minimumVersion = [string]$request.minimum_version
          $forceUpdate = [string][bool]$request.force_update
          $prerelease = [string][bool]$request.prerelease
          $notes = [string]$request.release_notes

          if ([string]::IsNullOrWhiteSpace($version) -or
              [string]::IsNullOrWhiteSpace($minimumVersion) -or
              [string]::IsNullOrWhiteSpace($notes)) {
            throw 'release/request.json must define version, minimum_version and release_notes.'
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINIMUM_VERSION=$minimumVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORCE_UPDATE=$forceUpdate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $delimiter = 'FACM_RELEASE_NOTES_' + [Guid]::NewGuid().ToString('N')
          "RELEASE_NOTES<<$delimiter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $notes | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved audited release request for FACM $version."

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate release inputs and capture base
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'version must use major.minor.patch format.'
          }
          if ($env:MINIMUM_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'minimum_version must use major.minor.patch format.'
          }
          if ([Version]$env:MINIMUM_VERSION -gt [Version]$env:RELEASE_VERSION) {
            throw 'minimum_version cannot be greater than version.'
          }
          gh release view ("v" + $env:RELEASE_VERSION) --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$($env:RELEASE_VERSION) already exists."
          }
          $global:LASTEXITCODE = 0
          $baseSha = (git rev-parse HEAD).Trim()
          "FACM_RELEASE_BASE_SHA=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release base main SHA: $baseSha"

      - name: Apply release version
        shell: pwsh
        run: |
          $path = 'src/FACM/Properties/AssemblyInfo.cs'
          $content = Get-Content $path -Raw -Encoding utf8
          $assemblyVersion = $env:RELEASE_VERSION + '.0'
          $content = [regex]::Replace($content, 'AssemblyVersion\("[^"]+"\)', 'AssemblyVersion("' + $assemblyVersion + '")')
          $content = [regex]::Replace($content, 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("' + $assemblyVersion + '")')
          $content = [regex]::Replace($content, 'AssemblyInformationalVersion\("[^"]+"\)', 'AssemblyInformationalVersion("' + $env:RELEASE_VERSION + '")')
          Set-Content $path $content -Encoding utf8

      - name: Verify tool inputs
        shell: pwsh
        run: |
          $manifest = Get-Content tools/EXTRACTED-TOOLS.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($entry in $manifest.files) {
            $path = Join-Path $PWD ('tools/' + [string]$entry.name)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing tool input: $($entry.name)"
            }
            if ((Get-Item -LiteralPath $path).Length -ne [long]$entry.size) {
              throw "Tool size mismatch: $($entry.name)"
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne [string]$entry.sha256) {
              throw "Tool SHA-256 mismatch: $($entry.name)"
            }
          }

      - name: Publish, self-test and bundle VPet PetHost
        shell: pwsh
        run: |
          $publish = Join-Path $PWD $env:PETHOST_PUBLISH
          $bundle = Join-Path $PWD $env:PETHOST_BUNDLE
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          if (Test-Path $bundle) { Remove-Item $bundle -Force }

          dotnet publish $env:PETHOST_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -o $publish
          if ($LASTEXITCODE -ne 0) {
            throw "PetHost publish failed with exit code $LASTEXITCODE"
          }

          $hostExe = Join-Path $publish 'FACM.PetHost.exe'
          if (-not (Test-Path $hostExe -PathType Leaf)) {
            throw "PetHost executable not found: $hostExe"
          }
          $selfTestRoot = Join-Path $env:RUNNER_TEMP 'FACM-PetHost-Release-SelfTest'
          if (Test-Path $selfTestRoot) { Remove-Item $selfTestRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $selfTestRoot -Force | Out-Null
          $selfTest = Start-Process -FilePath $hostExe -ArgumentList "--self-test --data-root `"$selfTestRoot`"" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            throw "PetHost self-test failed with exit code $($selfTest.ExitCode)"
          }

          Compress-Archive -Path "$publish\*" -DestinationPath $bundle -CompressionLevel Optimal -Force
          if (-not (Test-Path $bundle -PathType Leaf)) {
            throw "PetHost bundle was not created: $bundle"
          }
          Write-Host "PetHost bundle SHA256: $((Get-FileHash $bundle -Algorithm SHA256).Hash)"

      - name: Build Release with embedded PetHost
        shell: pwsh
        run: |
          $bundle = (Resolve-Path $env:PETHOST_BUNDLE).Path
          msbuild $env:SOLUTION /restore /m /p:Configuration=Release /p:Platform="Any CPU" /p:ContinuousIntegrationBuild=true /p:RequirePetHostBundle=true /p:PetHostBundlePath="$bundle" /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $env:OUTPUT_EXE -PathType Leaf)) {
            throw "Build output not found: $env:OUTPUT_EXE"
          }

      - name: Verify embedded bundles
        shell: pwsh
        run: |
          $exe = (Resolve-Path $env:OUTPUT_EXE).Path
          $resourceVerifier = Join-Path $env:RUNNER_TEMP 'verify-facm-release-resources.ps1'
          @'
          param([Parameter(Mandatory=$true)][string]$ExePath)
          $ErrorActionPreference = 'Stop'
          $assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($ExePath)
          $assembly.GetManifestResourceNames()
          '@ | Set-Content -LiteralPath $resourceVerifier -Encoding utf8

          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $resources = @(
            & $windowsPowerShell `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File $resourceVerifier `
              -ExePath $exe
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Resource verification failed with exit code $LASTEXITCODE"
          }
          if ($resources -notcontains 'FACM.Resources.FACM.ToolBundle.dll') {
            throw 'FACM.ToolBundle.dll was not embedded into FACM.exe.'
          }
          if ($resources -notcontains 'FACM.Resources.PetHost.zip') {
            throw 'PetHost bundle was not embedded into FACM.exe.'
          }
          Write-Host 'Verified embedded tool bundle and PetHost bundle resources under Windows PowerShell 5.1.'

      - name: Sign release executable
        shell: pwsh
        env:
          FACM_PFX_BASE64: ${{ secrets.FACM_PFX_BASE64 }}
          FACM_PFX_PASSWORD: ${{ secrets.FACM_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FACM_PFX_BASE64)) {
            throw 'FACM_PFX_BASE64 is required for publishing a release.'
          }
          & .\scripts\sign-ci.ps1 `
            -ExePath $env:OUTPUT_EXE `
            -PfxBase64 $env:FACM_PFX_BASE64 `
            -PfxPassword $env:FACM_PFX_PASSWORD

      - name: Prepare disabled online manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $env:OUTPUT_EXE release/FACM.exe -Force
          $hash = (Get-FileHash release/FACM.exe -Algorithm SHA256).Hash
          $signature = Get-AuthenticodeSignature release/FACM.exe
          if ($signature.SignerCertificate -eq $null) {
            throw 'Release executable has no Authenticode signer.'
          }

          $notesPath = Join-Path $PWD 'release/RELEASE-NOTES.txt'
          Set-Content $notesPath $env:RELEASE_NOTES -Encoding utf8

          $manifest = [ordered]@{
            enabled = $false
            version = $env:RELEASE_VERSION
            minimum_version = $env:MINIMUM_VERSION
            force_update = [bool]::Parse($env:FORCE_UPDATE)
            download_url = "https://github.com/${{ github.repository }}/releases/download/v$($env:RELEASE_VERSION)/FACM.exe"
            sha256 = $hash
            release_notes = $env:RELEASE_NOTES
            published_at = [DateTimeOffset]::UtcNow.ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content online/version.json -Encoding utf8
          "FACM_RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version metadata with updater disabled
        shell: pwsh
        run: |
          git fetch origin main
          $remoteSha = (git rev-parse origin/main).Trim()
          if ($remoteSha -ne $env:FACM_RELEASE_BASE_SHA) {
            throw "main moved during release build: expected $env:FACM_RELEASE_BASE_SHA, got $remoteSha. Nothing was published."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FACM/Properties/AssemblyInfo.cs online/version.json
          git commit -m "准备发布 FACM $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to commit release metadata."
          }
          $metadataSha = (git rev-parse HEAD).Trim()
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push release metadata. Nothing was published."
          }
          "FACM_RELEASE_METADATA_SHA=$metadataSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create draft GitHub release from committed source
        shell: pwsh
        run: |
          $arguments = @(
            'release', 'create', ("v" + $env:RELEASE_VERSION),
            'release/FACM.exe',
            '--repo', '${{ github.repository }}',
            '--target', $env:FACM_RELEASE_METADATA_SHA,
            '--title', ("FACM " + $env:RELEASE_VERSION),
            '--notes-file', 'release/RELEASE-NOTES.txt',
            '--draft'
          )
          if ([bool]::Parse($env:PRERELEASE)) {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create --draft failed. online/version.json remains safely disabled."
          }

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $arguments = @(
            'release', 'edit', ("v" + $env:RELEASE_VERSION),
            '--repo', '${{ github.repository }}',
            '--draft=false'
          )
          if ([bool]::Parse($env:PRERELEASE)) {
            $arguments += '--prerelease'
          }
          else {
            $arguments += '--latest'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            gh release delete ("v" + $env:RELEASE_VERSION) --repo '${{ github.repository }}' --cleanup-tag --yes
            throw "Publishing draft release failed. Draft/tag cleanup was attempted and online/version.json remains disabled."
          }

      - name: Enable online update manifest
        shell: pwsh
        run: |
          git fetch origin main
          $remoteSha = (git rev-parse origin/main).Trim()
          $localSha = (git rev-parse HEAD).Trim()
          if ($remoteSha -ne $localSha) {
            throw "main moved after release metadata push: expected $localSha, got $remoteSha. Release is public but online update remains disabled."
          }

          $manifest = Get-Content online/version.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ([string]$manifest.version -ne $env:RELEASE_VERSION) {
            throw "online/version.json changed after release metadata commit; refusing to enable it."
          }
          if ([string]$manifest.sha256 -ne $env:FACM_RELEASE_SHA256) {
            throw "online/version.json SHA changed after release metadata commit; refusing to enable it."
          }
          if ([bool]$manifest.enabled) {
            throw "online/version.json was unexpectedly enabled before the release finalization step."
          }

          $manifest.enabled = $true
          $manifest.published_at = [DateTimeOffset]::UtcNow.ToString('o')
          $manifest | ConvertTo-Json | Set-Content online/version.json -Encoding utf8

          New-Item -ItemType Directory -Path docs -Force | Out-Null
          $stateLines = @(
            '# FACM 当前项目状态',
            '',
            ('> 正式发布工作流于 ' + [DateTimeOffset]::UtcNow.ToString('u') + ' 更新。'),
            '',
            '## 当前正式版',
            '',
            ('- 版本：FACM ' + $env:RELEASE_VERSION),
            ('- GitHub Release：v' + $env:RELEASE_VERSION),
            '- 在线更新：已启用',
            ('- minimum_version：' + $env:MINIMUM_VERSION),
            ('- force_update：' + $env:FORCE_UPDATE.ToLowerInvariant()),
            ('- 发布基础 main：' + $env:FACM_RELEASE_BASE_SHA),
            ('- 发布元数据提交：' + $env:FACM_RELEASE_METADATA_SHA),
            '',
            '## 验证状态',
            '',
            '- Build #495 的 Windows 发布候选已完成用户实机验收并确认无问题。',
            '- 正式 Release 继续经过签名、SHA-256、PetHost self-test/内嵌验证与事务式在线清单启用。',
            '- Issue #28 记录本次 3.1.0 正式发布授权与执行。',
            '',
            '## 后续',
            '',
            '- 新功能或缺陷继续通过 Issue + 短分支 + PR 进入 main。',
            '- 下一正式版本继续使用 `.github/workflows/publish-release.yml`；可从 Actions 手动触发，也可通过合并 `release/request.json` 的审计式发布请求触发。'
          )
          Set-Content docs/PROJECT_STATE.md $stateLines -Encoding utf8

          git add online/version.json docs/PROJECT_STATE.md
          git commit -m "启用 FACM $env:RELEASE_VERSION 在线更新"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Release is public but updater remains safely disabled because the final manifest push failed."
          }
