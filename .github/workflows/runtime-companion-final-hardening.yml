name: Runtime Companion Final Hardening

on:
  push:
    branches:
      - feat/runtime-companion-20260910

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden queue context and DPI smoke coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              changed = False
              for old, new, label in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f'{path}: missing anchor: {label}')
                  text = text.replace(old, new, 1)
                  changed = True
              if changed:
                  p.write_text(text, encoding='utf-8', newline='\n')

          patch('src/FACM/League/LeagueLiveDataService.cs', [
              (
                  '''                    if (teamBuilderState != null && teamBuilderState.SessionAvailable)\n                    {\n                        teamBuilderState.SwapRoute = LeagueBenchSwapRoute.TeamBuilder;\n''',
                  '''                    if (teamBuilderState != null && teamBuilderState.SessionAvailable)\n                    {\n                        // Some Team Builder session shapes expose the bench roster but omit the\n                        // queue/mode fields present on the generic ChampSelect session. Preserve\n                        // that already-read context so Runtime Companion mode routing does not\n                        // silently degrade to an unknown guide kind after the compatibility GET.\n                        if (teamBuilderState.QueueId <= 0 && state != null)\n                            teamBuilderState.QueueId = state.QueueId;\n                        if (string.IsNullOrWhiteSpace(teamBuilderState.GameMode) && state != null)\n                            teamBuilderState.GameMode = state.GameMode;\n                        teamBuilderState.SwapRoute = LeagueBenchSwapRoute.TeamBuilder;\n''',
                  'Team Builder queue context preservation')
          ])

          patch('src/FACM/League/LeagueLiveSmokeTest.cs', [
              (
                  '''            var mayhem = "{\\\"gameId\\\":500861493625,\\\"queueId\\\":2400,\\\"localPlayerCellId\\\":2,\\\"benchEnabled\\\":true," +\n''',
                  '''            var mayhem = "{\\\"gameId\\\":500861493625,\\\"queueId\\\":2400,\\\"gameMode\\\":\\\"KIWI\\\",\\\"localPlayerCellId\\\":2,\\\"benchEnabled\\\":true," +\n''',
                  'global Mayhem mode fixture'),
              (
                  '''            Require(state.SessionAvailable && state.BenchEnabled, "Mayhem bench session was not recognized.");\n            Require(state.ChampionIds.SequenceEqual(new[] { 266, 55 }), "Mayhem benchChampions did not parse/deduplicate in client order.");\n''',
                  '''            Require(state.SessionAvailable && state.BenchEnabled, "Mayhem bench session was not recognized.");\n            Require(state.QueueId == 2400 && string.Equals(state.GameMode, "KIWI", StringComparison.OrdinalIgnoreCase),\n                "Mayhem bench queue/mode context did not parse.");\n            Require(LeagueQueueModePolicy.IsAramMayhem(state.QueueId, state.GameMode),\n                "Parsed global Mayhem context did not reach the shared mode policy.");\n            Require(state.ChampionIds.SequenceEqual(new[] { 266, 55 }), "Mayhem benchChampions did not parse/deduplicate in client order.");\n''',
                  'global Mayhem parsed context assertions'),
              (
                  '''            var generic = "{\\\"localPlayerCellId\\\":1,\\\"benchEnabled\\\":true,\\\"isLegacyChampSelect\\\":false,\\\"benchChampions\\\":[],\\\"myTeam\\\":[{\\\"cellId\\\":1,\\\"championId\\\":34}]}";\n''',
                  '''            var generic = "{\\\"queueId\\\":3270,\\\"gameMode\\\":\\\"KIWI\\\",\\\"localPlayerCellId\\\":1,\\\"benchEnabled\\\":true,\\\"isLegacyChampSelect\\\":false,\\\"benchChampions\\\":[],\\\"myTeam\\\":[{\\\"cellId\\\":1,\\\"championId\\\":34}]}";\n''',
                  'Tencent Team Builder fallback source context'),
              (
                  '''            Require(state.SessionAvailable && state.BenchEnabled, "Team Builder fallback did not return a bench session.");\n            Require(state.ChampionIds.SequenceEqual(new[] { 55, 99 }), "Team Builder fallback did not recover bench champions.");\n''',
                  '''            Require(state.SessionAvailable && state.BenchEnabled, "Team Builder fallback did not return a bench session.");\n            Require(state.QueueId == 3270 && string.Equals(state.GameMode, "KIWI", StringComparison.OrdinalIgnoreCase),\n                "Team Builder fallback lost Tencent queue/mode context from the generic session.");\n            Require(LeagueQueueModePolicy.IsAramMayhem(state.QueueId, state.GameMode),\n                "Team Builder fallback no longer resolves as Tencent ARAM Mayhem.");\n            Require(state.ChampionIds.SequenceEqual(new[] { 55, 99 }), "Team Builder fallback did not recover bench champions.");\n''',
                  'Tencent Team Builder fallback assertions')
          ])

          patch('src/FACM/League/LeagueRuntimeCompanionWindowState.cs', [
              (
                  '''            if (ResolveExpandedHeight(1040, 1.5F) != 980)\n                throw new InvalidOperationException("Runtime Companion 150% DPI height policy drifted.");\n            if (ResolveExpandedHeight(2160, 1F) != DesignMaximumExpandedHeight)\n''',
                  '''            if (ResolveExpandedHeight(728, 1.25F) != 678)\n                throw new InvalidOperationException("Runtime Companion 125% DPI height policy drifted.");\n            if (ResolveExpandedHeight(1040, 1.5F) != 980)\n                throw new InvalidOperationException("Runtime Companion 150% DPI height policy drifted.");\n            if (ResolveExpandedHeight(1040, 2F) != 960)\n                throw new InvalidOperationException("Runtime Companion 200% DPI height policy drifted.");\n            if (ResolveExpandedHeight(2160, 2F) != 1440)\n                throw new InvalidOperationException("Runtime Companion 200% DPI maximum height cap drifted.");\n            if (ResolveExpandedHeight(2160, 1F) != DesignMaximumExpandedHeight)\n''',
                  '125 and 200 percent DPI height matrix'),
              (
                  '''            var anchored = ResolveDefaultLocation(leftMonitor, new Size(582, 900), 1.5F);\n            if (anchored.X < leftMonitor.Left || anchored.Y < leftMonitor.Top ||\n                anchored.X + 582 > leftMonitor.Right || anchored.Y + 900 > leftMonitor.Bottom)\n                throw new InvalidOperationException("Runtime Companion DPI-aware default anchor left the working area.");\n\n''',
                  '''            var anchored = ResolveDefaultLocation(leftMonitor, new Size(582, 900), 1.5F);\n            if (anchored.X < leftMonitor.Left || anchored.Y < leftMonitor.Top ||\n                anchored.X + 582 > leftMonitor.Right || anchored.Y + 900 > leftMonitor.Bottom)\n                throw new InvalidOperationException("Runtime Companion DPI-aware default anchor left the working area.");\n\n            var compact125 = new Rectangle(0, 0, 1366, 728);\n            var anchored125 = ResolveDefaultLocation(compact125, new Size(485, 678), 1.25F);\n            if (anchored125.X < compact125.Left || anchored125.Y < compact125.Top ||\n                anchored125.X + 485 > compact125.Right || anchored125.Y + 678 > compact125.Bottom)\n                throw new InvalidOperationException("Runtime Companion 125% DPI compact-display anchor left the working area.");\n\n            var fullHd200 = new Rectangle(0, 0, 1920, 1040);\n            var anchored200 = ResolveDefaultLocation(fullHd200, new Size(776, 960), 2F);\n            if (anchored200.X < fullHd200.Left || anchored200.Y < fullHd200.Top ||\n                anchored200.X + 776 > fullHd200.Right || anchored200.Y + 960 > fullHd200.Bottom)\n                throw new InvalidOperationException("Runtime Companion 200% DPI anchor left the working area.");\n\n''',
                  '125 and 200 percent DPI anchor matrix')
          ])

          patch('docs/PROJECT_STATE.md', [
              (
                  '''- deterministic smoke 覆盖紧凑宽度/高度、100%/150% DPI 高度策略、负坐标多屏 clamp、settings round-trip/LKG recovery、snapshot clone、最多 3 套方案投影、缺失胜率不伪造、rune/spell scoped apply、item-set owner 边界，以及 ARAM balance 有值显示/无值省略。\n''',
                  '''- deterministic smoke 覆盖紧凑宽度/高度、100%/125%/150%/200% DPI 高度与默认锚点策略、负坐标多屏 clamp、settings round-trip/LKG recovery、snapshot clone、最多 3 套方案投影、缺失胜率不伪造、rune/spell scoped apply、item-set owner 边界，以及 ARAM balance 有值显示/无值省略。Team Builder fallback 若只返回 Bench roster 而缺少 queue/mode，会保留 generic ChampSelect 已读到的 queue/mode，避免国服 Mayhem 模式路由退化为 unknown。\n''',
                  'project state hardening summary')
          ])
          PY

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-companion-final-hardening.yml
          if git diff --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git add src/FACM/League/LeagueLiveDataService.cs src/FACM/League/LeagueLiveSmokeTest.cs src/FACM/League/LeagueRuntimeCompanionWindowState.cs docs/PROJECT_STATE.md
          git commit -m "Harden Runtime Companion mode and DPI handling"
          git push origin HEAD:feat/runtime-companion-20260910
