name: FACM 4.0 WinUI Deployment Probe

on:
  push:
    branches:
      - 'feat/facm-4-*'
    paths:
      - 'prototypes/FACM.WinUI.DeploymentProbe/**'
      - '.github/workflows/winui-deployment-probe.yml'
      - 'docs/FACM-4-MIGRATION-CONTRACT.md'
  pull_request:
    branches:
      - main
    paths:
      - 'prototypes/FACM.WinUI.DeploymentProbe/**'
      - '.github/workflows/winui-deployment-probe.yml'
      - 'docs/FACM-4-MIGRATION-CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facm-winui-gate0-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: prototypes\FACM.WinUI.DeploymentProbe\FACM.WinUI.DeploymentProbe.csproj
  PUBLISH_DIR: out\gate0-winui-publish
  EVIDENCE_DIR: out\gate0-winui-evidence

jobs:
  deployment-probe:
    name: Publish and launch unpackaged self-contained single-file probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Report SDK environment
        shell: pwsh
        run: dotnet --info

      - name: Restore deployment probe
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT -r win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 0 WinUI restore failed with exit code $LASTEXITCODE"
          }

      - name: Publish single-file deployment probe
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) {
            Remove-Item $env:PUBLISH_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null

          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:DebugType=None `
            -o $env:PUBLISH_DIR
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 0 WinUI publish failed with exit code $LASTEXITCODE"
          }

      - name: Inspect publish shape and launch twice
        shell: pwsh
        run: |
          $publish = (Resolve-Path $env:PUBLISH_DIR).Path
          $exe = Join-Path $publish 'FACM.WinUI.DeploymentProbe.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Deployment probe executable not found: $exe"
          }

          $files = @(Get-ChildItem $publish -File | Sort-Object Name)
          $dlls = @($files | Where-Object Extension -eq '.dll')
          if ($dlls.Count -gt 0) {
            throw "Single-file publish leaked runtime DLLs: $($dlls.Name -join ', ')"
          }

          if (Test-Path $env:EVIDENCE_DIR) {
            Remove-Item $env:EVIDENCE_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:EVIDENCE_DIR -Force | Out-Null

          function Invoke-Gate0Probe([string]$name) {
            $output = Join-Path $env:EVIDENCE_DIR ($name + '.json')
            $env:FACM_GATE0_PROBE_OUTPUT = $output
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $exe -ArgumentList '--gate0-probe' -Wait -PassThru
            $timer.Stop()
            if ($process.ExitCode -ne 0) {
              throw "$name launch failed with exit code $($process.ExitCode)"
            }
            if (-not (Test-Path $output -PathType Leaf)) {
              throw "$name did not produce runtime evidence."
            }
            $report = Get-Content $output -Raw -Encoding utf8 | ConvertFrom-Json
            if ($report.embedded_marker -ne 'FACM-4-GATE0-WINUI-EMBEDDED-RESOURCE-OK') {
              throw "$name could not read the embedded resource marker."
            }
            if ([string]::IsNullOrWhiteSpace([string]$report.process_path)) {
              throw "$name did not report Environment.ProcessPath."
            }
            return [ordered]@{
              elapsed_ms = $timer.ElapsedMilliseconds
              report = $report
            }
          }

          $first = Invoke-Gate0Probe 'first-launch'
          $second = Invoke-Gate0Probe 'second-launch'
          $hash = Get-FileHash $exe -Algorithm SHA256

          $evidence = [ordered]@{
            generated_at_utc = [DateTime]::UtcNow.ToString('o')
            target_framework = 'net10.0-windows10.0.19041.0'
            target_platform_min_version = '10.0.17763.0'
            windows_app_sdk = '2.4.0'
            deployment = 'unpackaged+self-contained+single-file+self-extract'
            executable = [ordered]@{
              name = [IO.Path]::GetFileName($exe)
              size_bytes = (Get-Item $exe).Length
              sha256 = $hash.Hash
            }
            publish_files = @($files | ForEach-Object {
              [ordered]@{ name = $_.Name; size_bytes = $_.Length }
            })
            first_launch = $first
            second_launch = $second
            note = 'Elapsed values are CI smoke evidence, not the FACM production startup budget.'
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:EVIDENCE_DIR 'deployment-evidence.json') -Encoding utf8

          Write-Host "Gate 0 WinUI probe published: $exe"
          Write-Host "Publish file count: $($files.Count); EXE size: $((Get-Item $exe).Length) bytes"
          Write-Host "First launch: $($first.elapsed_ms) ms; second launch: $($second.elapsed_ms) ms"

      - name: Upload Gate 0 deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: FACM-4-Gate0-WinUI-Deployment-${{ github.run_number }}
          path: |
            out/gate0-winui-publish/FACM.WinUI.DeploymentProbe.exe
            out/gate0-winui-evidence/*.json
